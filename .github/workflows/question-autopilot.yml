name: Question Autopilot

# The mechanical half of the question loop is already automatic (answered label -> sync -> D1 -> FAQ).
# What piles up is the reading and triage, which is what this job does: per open `[Question]`, measure
# whether the corpus answers it through the **production** retrieval path, post a receipt, group questions
# that are the same question, and open one **bounty task** per cluster so the answer comes from someone who
# hit the same thing rather than from a maintainer (`JOIN.md` § Bounties & payment).
#
# It never writes an answer, never adds the `answered` label and never closes an issue: `answered` is the
# switch that puts text into the FAQ, which agents receive as a maintainer answer, and that has to come
# from someone who observed the failure (docs/maintainer/provenance-gate-2026-09-16.md).
#
# Script: scripts/question_autopilot.py

on:
  schedule:
    - cron: '40 6 * * *'
  workflow_dispatch:
    inputs:
      post:
        description: "Write the receipts, the bounty tasks and the digest (set false for a dry run)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Triage the open questions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `${{ }}` inside a `run:` block is substituted *before* bash parses, so a value
          # spelling `$(…)` arrives already expanded into shell code. `inputs.post` is
          # declared `type: boolean`, but the dispatch API takes `inputs` as
          # `map[string]string` and does not check it against the declared type — the type is
          # documentation, not a guarantee. The environment does not expand: bash performs no
          # second pass over the result of a variable substitution, so a value of `$(id)`
          # lands in the comparison as the literal five characters and nothing is executed.
          POST: ${{ inputs.post }}
        run: |
          # Posting is the default, because report-only is the thing this job exists to replace: a report
          # nobody reads *is* the backlog. Established by the maintainer on 2026-09-26 after reviewing a
          # full dry run against the live backlog (18 questions → 18 receipts, 4 cluster bounty tasks,
          # 1 digest). `post: false` on a manual dispatch restores the dry run for inspecting a change.
          #
          # Safe to run daily: every write is idempotent — receipts are keyed by the hash of their own
          # content, bounty tasks by an anchor marker, and the digest is updated in place.
          if [ "$POST" = "false" ]; then
            set +e
            python3 scripts/question_autopilot.py | tee -a "$GITHUB_STEP_SUMMARY"
            RC=${PIPESTATUS[0]}
            set -e
          else
            set +e
            python3 scripts/question_autopilot.py --post --bounties | tee -a "$GITHUB_STEP_SUMMARY"
            RC=${PIPESTATUS[0]}
            set -e
          fi
          # Without this the step reported `tee`'s status and a run that posted nothing
          # looked identical to a run that posted everything. That is the failure this
          # repository already paid for once: automated writers that only act when there
          # is something to write, so the runs where nothing changed stayed green while
          # the runs that mattered went red in a step nobody was reading.
          if [ "$RC" -ne 0 ]; then
            echo "::error::question_autopilot.py exited $RC — receipts, bounty tasks or the digest may not have been written."
            exit 1
          fi
