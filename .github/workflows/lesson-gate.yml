name: Lesson Quality Gate

# Structural gate (issue #889): blocks PRs whose NEW/CHANGED lessons fail the
# quality checks (required frontmatter fields, min content length, duplicate
# titles, allowed domain, tag format).
#
# It runs on **every** pull request, including ones that touch no lesson, so that it can be a
# *required* status check (#1920). A `paths:` filter is what made that impossible: a filtered
# workflow reports nothing for the PRs it skips, and GitHub then leaves those PRs at
# "Expected — waiting for status to be reported" forever. Measured on 2026-09-21: the gate did not
# exist at all on a `scripts/`-only PR, which is exactly how it stayed advisory while looking like a
# gate. The filtering now happens *inside* the job, which still reports a result.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install lesson gate dependencies
        run: python3 -m pip install -q pyyaml

      - name: Get changed lesson files
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            lessons/**/*.md

      - name: Classify added vs modified lesson files
        id: classify
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1 2>/dev/null || true
          BASE="${{ github.event.pull_request.base.sha }}"
          # NEW files get the strict gate; files that already exist on the base
          # branch (metadata/provenance/retag touches) are advisory so legacy
          # debt never blocks metadata batches (#1506).
          ADDED=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- 'lessons/**/*.md' | tr '\n' ' ')
          MODIFIED=$(git diff --name-only --diff-filter=MR "$BASE" HEAD -- 'lessons/**/*.md' | tr '\n' ' ')
          echo "added=$ADDED" >> "$GITHUB_OUTPUT"
          echo "modified=$MODIFIED" >> "$GITHUB_OUTPUT"

      - name: Run lesson quality gate (strict — NEW files)
        if: steps.classify.outputs.added != ''
        id: gate
        run: |
          FILES="${{ steps.classify.outputs.added }}"
          # bash -e would abort before the report and exit code are captured.
          set +e
          python3 scripts/lesson_gate.py $FILES > gate_report.txt 2>&1
          GATE_EXIT=$?
          set -e
          cat gate_report.txt
          echo "gate_exit=$GATE_EXIT" >> "$GITHUB_OUTPUT"
          if [ "$GATE_EXIT" -ne 0 ]; then
            echo "❌ Lesson quality gate FAILED (new file) — see report below."
            exit 1
          fi

      - name: Run lesson quality gate (advisory — modified existing files)
        if: steps.classify.outputs.modified != ''
        run: |
          FILES="${{ steps.classify.outputs.modified }}"
          set +e
          python3 scripts/lesson_gate.py --existing $FILES > gate_report_existing.txt 2>&1
          GATE_EXIT=$?
          set -e
          cat gate_report_existing.txt
          # advisory mode never fails the job; findings are warnings for review
          echo "modified-files findings reported above (advisory)."
          cat gate_report_existing.txt >> gate_report.txt 2>/dev/null || true

      # Always run: now that the job fires on every PR, this is the only step that proves the gate
      # itself can still fail. It used to rely on the path filter to guarantee a lesson-related
      # change; the job no longer has that guarantee, and a gate whose own tests never run is how
      # this repository keeps finding gates that cannot go red (#1984, #1822).
      - name: Run unit tests for the gate
        run: |
          pip install -q pytest
          python3 -m pytest tests/test_lesson_gate.py -q

      - name: No lesson changes — nothing for this gate to check
        if: steps.changed.outputs.any_changed != 'true'
        run: |
          # `success` from this job means "there was nothing to check", not "the deliverable is
          # fine" — and on a bounty PR those two are not the same thing. Measured 2026-09-26: two
          # PRs claiming a *question-bounty* issue (whose task is a lesson under `lessons/`) carried
          # this check green while adding no lesson at all — one patched `scripts/check_provenance.py`
          # and the other added an essay at `solutions/issue_2283_solution.ts`. The annotation below is
          # what a reviewer sees in the diff and on the check summary; the job still reports success
          # because a required status check must always report (#1920).
          echo "::warning title=Lesson Quality Gate verified nothing::This PR changes no lessons/**/*.md file, so this check says nothing about a lesson. If it claims a bounty whose task is 'a lesson under lessons/', the deliverable is missing until a lesson file appears."
          echo "This PR changes no `lessons/**/*.md` file, so the lesson gate has nothing to verify."
          echo "The job still reports success on purpose: a required status check must always report,"
          echo "or GitHub holds the PR at 'Expected — waiting for status to be reported' indefinitely."

      - name: Comment gate result on PR
        if: steps.changed.outputs.any_changed == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const fs = require('fs');
            let report = '✅ **Lesson Quality Gate passed.**';
            let icon = '✅';
            try {
              const gateReport = fs.readFileSync('gate_report.txt', 'utf8');
              if (gateReport.includes('FAIL')) {
                icon = '❌';
                report = '❌ **Lesson Quality Gate failed.** Check the report below.';
              }
              report += '\n\n```\n' + gateReport + '\n```';
            } catch (e) {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report,
            });
