name: Stale PR / Issue Manager
on:
  schedule:
    - cron: "0 6 * * *"  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Labelling only — it never closes anything.
          #
          # Measured 2026-09-25 over the workflow's whole life: 97 runs, **1** `stale` label, **0** automatic
          # closes. So the labelling is what this automation actually does, and the closing is a purely
          # hypothetical action whose only possible effect on a contributor is "a bot closed my issue" —
          # a promise the repository cannot keep on their behalf (the exemption list is a guess about intent,
          # and a closed issue is work the maintainer silently dropped). `-1` disables closing; the messages
          # that announced a closure are gone with it rather than left saying something that cannot happen.
          #
          # Friction test, which is the reason for this change: does it add friction for the people it acts on?
          # Labelling: a reversible hint, yes it helps (maintainers find stale items). Closing: irreversible,
          # zero measured benefit, real cost when it fires.
          stale-pr-message: |
            This PR has been inactive for 14 days. It is still open — leave a comment or push changes whenever
            you can; nothing here will close it for you.
          stale-pr-label: stale
          days-before-pr-stale: 14
          days-before-pr-close: -1

          # Issue settings
          stale-issue-message: |
            This issue has been inactive for 30 days. It is still open — an issue here is not closed for being
            quiet, and the backlog is worked through when someone has the context to act on it.
          stale-issue-label: stale
          days-before-issue-stale: 30
          days-before-issue-close: -1

          # Exemptions
          exempt-pr-labels: keep,dependencies,registered
          exempt-issue-labels: keep,registered,help wanted,bounty
          exempt-all-milestones: true
