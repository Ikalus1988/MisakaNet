name: DCO Auto-Fix
on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-dco:
    # `contains(body, '/fix-dco')` alone was satisfied by `dco-audit`'s own failure comment, which
    # *explains* the command ("Same-repo PRs can also comment `/fix-dco` to auto-apply the sign-off.").
    # So the receipt for a missing sign-off silently ran the auto-fix on every DCO failure, whether or
    # not anybody asked for it — a help string is not a request. The marker exclusion is what keeps
    # teaching the command from being the same thing as typing it.
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/fix-dco') &&
      !contains(github.event.comment.body, 'misakanet-dco-block') &&
      (github.event.comment.user.login == github.event.issue.user.login ||
       contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # A job with no bound holds its runner until the platform default (six hours).
    timeout-minutes: 10
    steps:
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} \
            --jq '{headRef: .head.ref, headRepo: .head.repo.full_name, headLabel: .head.label, baseRef: .base.ref}')
          echo "headRef=$(echo $PR_JSON | jq -r '.headRef')" >> $GITHUB_OUTPUT
          echo "headRepo=$(echo $PR_JSON | jq -r '.headRepo')" >> $GITHUB_OUTPUT
          echo "baseRef=$(echo $PR_JSON | jq -r '.baseRef')" >> $GITHUB_OUTPUT
          echo "isFork=$([ "$(echo $PR_JSON | jq -r '.headRepo')" != "${{ github.repository }}" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Handle fork PR — manual instructions only
        if: steps.pr.outputs.isFork == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                "⚠️ **Auto-fix not available for fork PRs.**",
                "",
                "Since this PR is from a fork, the bot can't push changes directly. Please fix DCO manually:",
                "",
                "```bash",
                "git rebase --signoff HEAD~N   # N = number of commits to fix",
                "git push --force",
                "```",
                "",
                "Or for the latest commit only:",
                "```bash",
                "git commit --amend --signoff --no-edit",
                "git push --force",
                "```",
              ].join('\n')
            });

      - name: Validate this is a PR issue
        if: steps.pr.outputs.isFork != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            if (!issue.data.pull_request) {
              core.setFailed('This issue is not a pull request');
            }

      - name: Checkout PR branch (same-repo only, with path isolation)
        if: steps.pr.outputs.isFork != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0
          path: pr-code
          token: ${{ secrets.GITHUB_TOKEN }}
          # The push below authenticates with its own token, and the two must not coexist:
          # `actions/checkout` writes an `http.https://github.com/.extraheader` with this token, and a
          # later push carries *both* Authorization headers — the server picks the checkout's, so the
          # workflow believes it pushed as the PAT while it actually pushed as the bot.
          # (`auto-sync-prs.yml` measured exactly this on 2026-09-19.)
          persist-credentials: false

      - name: Configure git safe directory
        run: git config --global safe.directory '*'

      - name: Configure git (same-repo only)
        if: steps.pr.outputs.isFork != 'true'
        working-directory: pr-code
        run: |
          git config user.name "misakanet-bot"
          git config user.email "bot@misakanet.dev"

      - name: Rebase with signoff (same-repo only)
        if: steps.pr.outputs.isFork != 'true'
        working-directory: pr-code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment, not interpolated into the script: both values come from the pull
          # request, and `${{ … }}` inside `run:` is substituted *before* bash parses — so a crafted ref
          # would be parsed as shell. (Open Code Review's GitHub Actions ruleset, "Script injection";
          # branch names may contain `$`, backticks and parentheses.)
          BASE_REF: ${{ steps.pr.outputs.baseRef }}
        run: |
          BASE="$BASE_REF"
          echo "Rebasing against $BASE..."
          git rebase --signoff "origin/$BASE" 2>&1 || {
            echo "Rebase with base failed — trying HEAD~N fallback"
            git rebase --abort 2>/dev/null
            MB=$(git merge-base "origin/$BASE" HEAD)
            N=$(git rev-list --count "$MB..HEAD")
            if [ "$N" -gt 0 ] && [ "$N" -le 10 ]; then
              GIT_SEQUENCE_EDITOR=: git rebase --signoff HEAD~"$N" || {
                echo "Could not auto-fix DCO. Manual fix required."
                exit 1
              }
            else
              echo "Too many commits ($N) or none to fix. Manual fix required."
              exit 1
            fi
          }
          echo "DCO fix applied."

      # The push decides whether this workflow helps or *strands* the PR it is fixing.
      #
      # Measured 2026-09-25: this step pushed with the built-in `GITHUB_TOKEN`, and the runs GitHub
      # created for the new head came back as `action_required` — held, never executed
      # (`actor=github-actions[bot]` on PR #2201/#2202). `DCO / Signed-off-by` is one of the three
      # **required** checks on `main`, so a held DCO run means the PR sits at "Expected — waiting for
      # status to be reported" for ever, and the auto-fix that was supposed to unblock a contributor
      # is what blocks them. The repository's own lesson file says it in the title
      # (`lessons/contrib/ci-github-token-push-does-not-trigger-workflows.md`), and
      # `auto-sync-prs.yml` already solved it by pushing with a PAT: a PAT push is an ordinary user
      # push, so `pull_request: synchronize` runs actually run.
      - name: Force push (same-repo only)
        if: steps.pr.outputs.isFork != 'true'
        working-directory: pr-code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.SHELDON_PAT }}
          HEAD_REF: ${{ steps.pr.outputs.headRef }}
        run: |
          if [ -z "${PUSH_TOKEN:-}" ]; then
            echo "::warning::SHELDON_PAT is empty — the sign-off was applied locally but NOT pushed. A push with GITHUB_TOKEN would create held runs (`action_required`) on the new head, and with `DCO / Signed-off-by` a required check that leaves this PR unmergeable — worse than leaving it red, where the contributor can still fix it by hand. Set the secret and re-run this workflow, or use the manual commands in the DCO comment."
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force-with-lease origin "HEAD:refs/heads/$HEAD_REF" 2>&1 || {
            echo "Force push failed — branch may have diverged"
            exit 1
          }

      - name: Post success comment (same-repo only)
        if: steps.pr.outputs.isFork != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "✅ **DCO Auto-Fix applied!** All commits have been signed off and pushed. CI checks should re-trigger shortly."
            });
