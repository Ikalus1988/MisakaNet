name: Publish @misaka-net/misakanet-setup

on:
  push:
    tags:
      - "misakanet-setup-v*"
  workflow_dispatch:      # allow a manual publish of the current version

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/misakanet-setup
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify zero dependencies
        run: |
          DEPS=$(node -e "const p=require('./package.json');console.log(p.dependencies?Object.keys(p.dependencies).length:0)")
          echo "dependencies: $DEPS"
          [ "$DEPS" = "0" ] || { echo "FAIL: expected 0 dependencies"; exit 1; }

      - name: Copy the canonical hook into the package
        run: node scripts/copy-hook.mjs

      - name: Run tests
        run: npm test

      # Build the tarball ONCE, then test *that file* and publish *that file*.
      #
      # Before this, the release path ran `npm test` (the source tree) and `npm pack --dry-run`, and
      # `npm publish` then packed the directory again — so the bytes that reached npm had been built
      # by a command nothing had inspected, and the source tree was what every check had actually
      # tested. That is the "test the checkout, ship the artifact" gap this repository already fixed
      # for pull requests (misakanet-setup-ci.yml); on the release path it compounds with every
      # version, which is why the e2e runs here too.
      - name: Build the tarball once
        id: pack
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          TGZ=$(ls "$RUNNER_TEMP"/misaka-net-misakanet-setup-*.tgz)
          SHA=$(sha256sum "$TGZ" | cut -d' ' -f1)
          VERSION=$(tar -xzOf "$TGZ" package/package.json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          {
            echo "tgz=$TGZ"
            echo "sha256=$SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "tarball: $TGZ"
          echo "version: $VERSION"
          echo "sha256:  $SHA"

      # A release tag that does not match the packaged version publishes a version nobody asked for
      # (or fails at npm with a 403 that reads like a permissions problem). Both are cheap to catch
      # here, and `workflow_dispatch` runs have no tag to compare — only the tag path is checked.
      - name: A release tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/misakanet-setup-v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#misakanet-setup-v}"
          if [ "$TAG" != "${{ steps.pack.outputs.version }}" ]; then
            echo "::error::tag says $TAG but the tarball says ${{ steps.pack.outputs.version }}"
            exit 1
          fi
          echo "tag and tarball agree on $TAG"

      - name: Install the tarball and run the packaged lifecycle e2e
        run: |
          npm install -g --prefix "$RUNNER_TEMP/prefix" "${{ steps.pack.outputs.tgz }}"
          node scripts/e2e-packaged-install.mjs \
            --prefix "$RUNNER_TEMP/prefix" --expect-version "${{ steps.pack.outputs.version }}"

      # One injection, so "the e2e passed" cannot mean "the e2e does nothing" at release time
      # either. The full set (5) and the live endpoint checks run on every PR and push to main;
      # this step exists to make the release path itself carry the proof, cheaply and offline.
      - name: Prove one e2e check can fail (injection)
        run: node scripts/e2e-packaged-install.mjs --prefix "$RUNNER_TEMP/prefix" --inject leftover-temp

      # Fail-fast diagnostics. The first attempt at this publish failed with a bare
      # `PUT ... 404`, which npm also returns when the token simply is not allowed to
      # *create* a new package (an existing package in the same scope publishes fine with a
      # package-scoped granular token) - so the message says nothing actionable. These two
      # commands name the account and list what the token can actually touch. Neither prints
      # the token itself.
      - name: Check npm identity and publish rights
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is empty - set it to a token that can publish this package."
            exit 1
          fi
          if ! ACCOUNT=$(npm whoami 2>/tmp/whoami.err); then
            echo "::error::npm rejected NPM_TOKEN (npm whoami failed)."
            sed 's/^/    /' /tmp/whoami.err | head -5
            echo "::error::A rejected token is usually expired (npm tokens default to 90 days;"
            echo "::error::a 401 here is not a permissions problem) or belongs to another registry."
            echo "::error::Fix: create a new automation token on npmjs.com and update the"
            echo "::error::NPM_TOKEN repository secret, then re-run this workflow."
            exit 1
          fi
          echo "account: $ACCOUNT"
          echo "packages this token can reach:"
          npm access list packages --json 2>/dev/null || echo "  (npm access not permitted by this token)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        run: |
          set +e
          # The exact file the e2e above installed and exercised — `npm publish <file>` publishes a
          # tarball as-is, so there is no second pack between "tested" and "published". The sha256 is
          # printed so the run log names the artifact, and the registry can be compared against it.
          echo "publishing ${{ steps.pack.outputs.tgz }} (${{ steps.pack.outputs.sha256 }})"
          npm publish "${{ steps.pack.outputs.tgz }}" --access public
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::npm publish failed (exit $RC). If the output was 'PUT ... 404 Not found',"
            echo "::error::the token cannot create a new package in this scope. Fix: use an npm"
            echo "::error::automation token from the org owner, or a granular token with"
            echo "::error::'All packages' write access, then update the NPM_TOKEN secret."
          fi
          exit $RC
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
