name: Publish @misaka-net/misakanet-setup

on:
  push:
    branches:
      - "main"           # the repository's release flow lands here; the `tag` job below reacts
    tags:
      - "misakanet-setup-v*"
  workflow_dispatch:      # allow a manual publish of the current version

#  * **Authentication, best first** (2026-09-30, the migration `misakanet-publish.yml` made): this job asks
#    for `id-token: write`, so npm CLI (>= 11.5.1 on Node >= 22.14) can exchange a GitHub OIDC token for a
#    short-lived publish credential — nothing long-lived to rotate. One-time entry on npmjs.com (package ->
#    Settings -> Trusted Publisher -> GitHub Actions): user `Ikalus1988`, repository `MisakaNet`, **workflow
#    filename `misakanet-setup-publish.yml`**, environment `release` (this job declares it; leaving the field empty also works), and
#    **allow direct `npm publish`** — the staged-only default would reject this workflow's command. Until the
#    entry exists the token keeps working: npm prefers OIDC when it is available, then falls back.
permissions:
  contents: read

jobs:
  # The tag the publish below listens for. release-please owns the *version* — it bumps
  # `packages/misakanet-setup/package.json` in the release PR — but nothing ever created the
  # `misakanet-setup-v*` tag, so the publish path had nothing to fire on: npm stayed at 0.5.6
  # while the package's source moved ten commits ahead, and `--verify` could not see it because
  # it compares npm with npm (#3691).
  #
  # The tag is pushed with the built-in token on purpose. A GITHUB_TOKEN push never triggers
  # another workflow, so the publish is dispatched explicitly below instead of firing behind our
  # back — the same reason `release-please.yml` tags with GITHUB_TOKEN and then dispatches the
  # PyPI, npm and MCP-registry publishes one by one.
  tag:
    name: Tag the setup package release
    # Only the repository's release flow creates a tag. A tag push and a manual dispatch go
    # straight to the publish job below.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # `automation`, not `release`: this job reads no credential, but every job in a workflow that
    # reads one has to name an environment (`tests/test_secret_scoping.py`), and `release` puts
    # a required reviewer in front of the job — an approval request on every push to main. The
    # `automation` environment is the reviewer-free one, restricted to main, which is exactly
    # what a job that may only ever tag a main commit wants.
    environment: automation
    permissions:
      contents: write      # push the release tag
      actions: write       # dispatch this workflow at that tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0        # the release tags say what has already been released

      - name: Decide whether a release tag is owed
        id: decide
        run: |
          set -euo pipefail
          PACKAGE=packages/misakanet-setup
          VERSION=$(node -p "require('./$PACKAGE/package.json').version")
          MANIFEST=$(node -p "require('./.release-please-manifest.json')['$PACKAGE'] || ''")
          LATEST=$(git tag -l 'misakanet-setup-v*' | sed 's/^misakanet-setup-v//' | sort -V | tail -1)
          {
            echo "version=$VERSION"
            echo "manifest=$MANIFEST"
            echo "latest_tag=${LATEST:-none}"
          } >> "$GITHUB_OUTPUT"
          echo "package version : $VERSION"
          echo "manifest version: ${MANIFEST:-none}"
          echo "last release tag: ${LATEST:-none}"
          if [ -z "$MANIFEST" ]; then
            # release-please has not released this package yet: there is no manifest entry, so
            # there is no version anybody asked for. The drift gate reports the debt; this job
            # does not invent a version.
            echo "release-please has not released this package yet — nothing to tag"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::the manifest says $MANIFEST but the package says $VERSION — the release wiring is inconsistent"
            exit 1
          fi
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)" = "$LATEST" ]; then
            echo "the last release tag is already $LATEST — nothing to tag"
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "a release tag is owed: misakanet-setup-v$VERSION"
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Create the release tag
        if: steps.decide.outputs.needed == 'true'
        # The version crosses through `env:`, not as script text: GitHub substitutes an
        # expression before bash parses the script, and `tests/test_workflow_script_injection.py`
        # is right to refuse a value that arrives that way. (A comment may not carry the
        # expression token either — GitHub evaluates that too, and refuses the whole file.)
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          TAG="misakanet-setup-v$VERSION"
          git tag "$TAG"
          git push origin "$TAG"
          echo "created $TAG"

      - name: Publish the tagged version
        if: steps.decide.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: misakanet-setup-v${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run misakanet-setup-publish.yml --ref "$TAG"
          echo "dispatched the publish at $TAG"

  publish:
    # Secrets live in the `release` environment, not at repository level: they are publish and
    # deploy credentials, and environment secrets can carry protection rules — a branch policy today,
    # and "required reviewers" as soon as it is switched on, which is what stops a workflow that has
    # been edited on a branch from using them without a person approving the run.
    environment: release
    # The publish runs for a release tag and for a manual dispatch. A push to `main` only asks
    # for the tag (the job above), which dispatches this workflow at that tag — publishing from
    # two places at once would publish whatever `main` happened to hold.
    if: github.event_name != 'push' || github.ref_type == 'tag'
    permissions:
      # The only writer in this job is the Release step at the end: it creates a release object on
      # the tag the `tag` job already pushed, and never touches the tree — the `gh release`
      # commands are the only writes, and the tree is not staged or committed anywhere. The npm
      # publish itself needs no write access.
      contents: write
      id-token: write      # npm trusted publishing (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/misakanet-setup
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: "24"   # trusted publishing: npm CLI >= 11.5.1 needs Node >= 22.14
          registry-url: "https://registry.npmjs.org"

      - name: Verify zero dependencies
        run: |
          DEPS=$(node -e "const p=require('./package.json');console.log(p.dependencies?Object.keys(p.dependencies).length:0)")
          echo "dependencies: $DEPS"
          [ "$DEPS" = "0" ] || { echo "FAIL: expected 0 dependencies"; exit 1; }

      - name: Copy the canonical hook into the package
        run: node scripts/copy-hook.mjs

      - name: Run tests
        run: npm test

      # Build the tarball ONCE, then test *that file* and publish *that file*.
      #
      # Before this, the release path ran `npm test` (the source tree) and `npm pack --dry-run`, and
      # `npm publish` then packed the directory again — so the bytes that reached npm had been built
      # by a command nothing had inspected, and the source tree was what every check had actually
      # tested. That is the "test the checkout, ship the artifact" gap this repository already fixed
      # for pull requests (misakanet-setup-ci.yml); on the release path it compounds with every
      # version, which is why the e2e runs here too.
      - name: Build the tarball once
        id: pack
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          TGZ=$(ls "$RUNNER_TEMP"/misaka-net-misakanet-setup-*.tgz)
          SHA=$(sha256sum "$TGZ" | cut -d' ' -f1)
          VERSION=$(tar -xzOf "$TGZ" package/package.json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          {
            echo "tgz=$TGZ"
            echo "sha256=$SHA"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "tarball: $TGZ"
          echo "version: $VERSION"
          echo "sha256:  $SHA"

      # A release tag that does not match the packaged version publishes a version nobody asked for
      # (or fails at npm with a 403 that reads like a permissions problem). Both are cheap to catch
      # here, and `workflow_dispatch` runs have no tag to compare — only the tag path is checked.
      - name: A release tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/misakanet-setup-v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#misakanet-setup-v}"
          if [ "$TAG" != "${{ steps.pack.outputs.version }}" ]; then
            echo "::error::tag says $TAG but the tarball says ${{ steps.pack.outputs.version }}"
            exit 1
          fi
          echo "tag and tarball agree on $TAG"

      - name: Install the tarball and run the packaged lifecycle e2e
        run: |
          npm install -g --prefix "$RUNNER_TEMP/prefix" "${{ steps.pack.outputs.tgz }}"
          node scripts/e2e-packaged-install.mjs \
            --prefix "$RUNNER_TEMP/prefix" --expect-version "${{ steps.pack.outputs.version }}"

      # One injection, so "the e2e passed" cannot mean "the e2e does nothing" at release time
      # either. The full set (5) and the live endpoint checks run on every PR and push to main;
      # this step exists to make the release path itself carry the proof, cheaply and offline.
      - name: Prove one e2e check can fail (injection)
        run: node scripts/e2e-packaged-install.mjs --prefix "$RUNNER_TEMP/prefix" --inject leftover-temp

      # Fail-fast diagnostics. The first attempt at this publish failed with a bare
      # `PUT ... 404`, which npm also returns when the token simply is not allowed to
      # *create* a new package (an existing package in the same scope publishes fine with a
      # package-scoped granular token) - so the message says nothing actionable. These two
      # commands name the account and list what the token can actually touch. Neither prints
      # the token itself.
      - name: Check npm identity and publish rights
        run: |
          # Trusted publishing first, token second (2026-09-30). Asking for `id-token: write` means GitHub
          # exposes `ACTIONS_ID_TOKEN_REQUEST_URL`, and npm CLI (>= 11.5.1) exchanges that OIDC token for a
          # short-lived credential **before** falling back to a token — so an empty `NPM_TOKEN` is only fatal
          # when there is no OIDC either. `npm whoami` also runs on the token path only: under OIDC there is
          # no long-lived identity to name.
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC available: npm will authenticate with trusted publishing (no long-lived token)."
            echo "node $(node --version) / npm $(npm --version)"
          elif [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Neither trusted publishing (no OIDC token request URL) nor NPM_TOKEN is available."
            echo "::error::Configure a trusted publisher for workflow misakanet-setup-publish.yml on npmjs.com,"
            echo "::error::or set the transitional NPM_TOKEN secret."
            exit 1
          elif ! ACCOUNT=$(npm whoami 2>/tmp/whoami.err); then
            echo "::error::npm rejected NPM_TOKEN (npm whoami failed)."
            sed 's/^/    /' /tmp/whoami.err | head -5
            echo "::error::A rejected token is usually expired (npm tokens default to 90 days;"
            echo "::error::a 401 here is not a permissions problem) or belongs to another registry."
            echo "::error::Fix: create a new automation token on npmjs.com and update the"
            echo "::error::NPM_TOKEN repository secret, then re-run this workflow."
            exit 1
          else
            echo "account: $ACCOUNT (token fallback)"
            echo "packages this token can reach:"
            npm access list packages --json 2>/dev/null || echo "  (npm access not permitted by this token)"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Idempotent by design (2026-09-30, matching `misakanet-publish.yml`): a re-run after a successful
      # publish used to fail with a bare npm conflict, so "run it again to be sure" was impossible and a
      # retried event looked like a broken release. A version already on the registry is a *done* state.
      - name: Skip when npm already has this version
        id: npm_state
        env:
          VERSION: ${{ steps.pack.outputs.version }}
          PKG: "@misaka-net/misakanet-setup"
        run: |
          set -euo pipefail
          ALREADY=false
          FOUND=$(npm view "$PKG@$VERSION" version 2>/tmp/npm-view.err || true)
          if [ "$(printf '%s' "$FOUND" | tr -d '[:space:]')" = "$VERSION" ]; then
            ALREADY=true
            echo "$PKG@$VERSION is already on npm - nothing to publish."
            echo "### $PKG@$VERSION is already on npm" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm does not report $PKG@$VERSION as published - publishing it"
            if [ -s /tmp/npm-view.err ]; then sed 's/^/    npm view: /' /tmp/npm-view.err | head -3; fi
          fi
          echo "already=$ALREADY" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.npm_state.outputs.already != 'true'
        run: |
          set +e
          # The exact file the e2e above installed and exercised — `npm publish <file>` publishes a
          # tarball as-is, so there is no second pack between "tested" and "published". The sha256 is
          # printed so the run log names the artifact, and the registry can be compared against it.
          echo "publishing ${{ steps.pack.outputs.tgz }} (${{ steps.pack.outputs.sha256 }})"
          npm publish "${{ steps.pack.outputs.tgz }}" --access public
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::npm publish failed (exit $RC). If the output was 'PUT ... 404 Not found',"
            echo "::error::the token cannot create a new package in this scope. Fix: use an npm"
            echo "::error::automation token from the org owner, or a granular token with"
            echo "::error::'All packages' write access, then update the NPM_TOKEN secret."
          fi
          exit $RC
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The installer's version used to exist only on npm. Measured 2026-10-23: the last 100
      # GitHub Releases contained **zero** `misakanet-setup-*` entries, and
      # `gh release view misakanet-setup-v0.6.0` answered "release not found" — so the Releases
      # page, the one page a reader opens to ask "what is the newest installer, and what
      # changed", showed nothing. The release belongs **here**, after npm has the version:
      # creating it in the `tag` job would advertise a version the registry does not have yet,
      # which is exactly the drift #3774 is about.
      #
      # GITHUB_TOKEN, deliberately: a release created by a PAT fires `on: release: published` in
      # `misakanet-publish.yml` (the *root* package's publisher) for a tag that package does not
      # own, and that run would fail its version guard. The built-in token creates the release
      # without starting a workflow from the event it caused.
      #
      # Idempotent: the tag job's dispatch and a human's manual dispatch can both get here for
      # one version, and a run that finds the release already created stands down. `--verify-tag`
      # means a missing tag is reported, never fabricated (the `tag` job owns tag creation).
      - name: Create the GitHub Release for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          set -euo pipefail
          TAG="misakanet-setup-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — nothing to do"
            exit 0
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::tag $TAG is not on the remote; skipping the Release (npm is unaffected)"
            exit 0
          fi
          python3 ../../scripts/setup_release_notes.py --version "$VERSION" \
            > "$RUNNER_TEMP/setup-release-notes.md"
          # --latest=false: `gh release create` otherwise marks this release as the repository's
          # "Latest", and a package under the root line would displace the product release
          # (`v2.49.x`) on the one page that answers "what shipped most recently".
          gh release create "$TAG" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/setup-release-notes.md" --verify-tag --latest=false
