name: Update lessons.json

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at 08:00 Beijing time
  workflow_dispatch:  # Manual trigger for release prep

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate lessons.json
        run: python3 scripts/update_lessons_json.py

      - name: Check for changes
        id: check
        run: |
          # update_lessons_json.py rewrites data/lessons.json and then refreshes
          # every managed public lesson count via scripts/sync_lesson_count.py
          # (README, ARCHITECTURE, website metadata, issue templates, …). Ask git
          # what changed instead of hardcoding that file list: the registry grows,
          # and a stale list here is how counts drifted before (handoff 2026-09-11).
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --porcelain
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # -u stages the tracked files the generator + count sync touched.
          git add -u
          git commit -m "chore: auto-update lessons.json + public lesson counts"
          git push
