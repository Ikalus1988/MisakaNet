name: Update lessons.json

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at 08:00 Beijing time
  workflow_dispatch:  # Manual trigger for release prep

# Serialize runs: two overlapping runs regenerate and commit the same artifacts.
# That exact race is what left leaderboard-watch in a detached HEAD (#1625).
concurrency:
  group: update-lessons
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write   # the regeneration lands through the auto-merging PR, not a push
    runs-on: ubuntu-latest
    # A job with no bound holds its runner until the platform default (six hours).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # `persist-credentials: false`, because `land_change.py` supplies its own: it pushes
          # `https://x-access-token:<PAT>@…`, and the token `actions/checkout` stored takes precedence
          # over the URL — so the branch went out as `github-actions[bot]` and every run on its pull
          # request came back `action_required`: held, never executed, with nothing able to satisfy the
          # required checks, so the self-merging PR could not merge. Measured 2026-09-25: 39 held runs on
          # `bot/release-version-sync` and 24 on `bot/build-feed`, with the version-sync PR stuck.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip

      # PyYAML is required: most lesson files carry YAML frontmatter and
      # update_lessons_json.py now refuses to fall back to slug/dir metadata
      # without it. This job installed no dependencies at all, so `import yaml`
      # raised ImportError and every YAML lesson was written to
      # data/lessons.json with its file stem as the title and the parent
      # directory as the domain.
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate lessons.json
        run: python3 scripts/update_lessons_json.py

      # Static lesson/topic pages and the sitemap are derived from lessons.json.
      # Nothing ran this until 2026-09-12, so the site served 205 lesson pages for
      # 378 lessons and topic pages with counts frozen at generation time
      # (docs/topics/contrib said "176" while the index held 330). It owns its
      # output: pages it no longer generates are pruned (marker-checked), and
      # docs/.generated-pages.json records the set.
      - name: Regenerate lesson/topic pages
        run: python3 scripts/build_lesson_pages.py

      # The OKF export had no writer for two and a half months (#2185): `data/okf/lessons.jsonl` was last
      # written 2026-07-07 while the corpus grew to 411 lessons, and because `data/sag.db` is built from it
      # and the search path prefers SAG over the complete BM25 index, following the documented setup produced
      # an index covering 47% of the corpus — recall *worse* than building nothing. It looked fine in the
      # repository (tracked, valid format, readable), which is why only a relation, not a number, catches it.
      # Regenerating it here makes it the same kind of artifact as `data/lessons.json`: derived, refreshed
      # daily, landed through the self-merging pull request below.
      - name: Regenerate the OKF export
        run: python3 scripts/export_okf.py

      - name: Check for changes
        id: check
        run: |
          # update_lessons_json.py rewrites data/lessons.json and then refreshes
          # every managed public lesson count via scripts/sync_lesson_count.py
          # (README, ARCHITECTURE, website metadata, issue templates, …). Ask git
          # what changed instead of hardcoding that file list: the registry grows,
          # and a stale list here is how counts drifted before (handoff 2026-09-11).
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --porcelain
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The "did anything change?" step that used to live here is gone with the push it gated:
      # `land_change.py` answers the same question by asking git (never a hardcoded file list — the
      # registry grows, and a stale list is how the counts drifted before, handoff 2026-09-11) and
      # exits 0 with no pull request when the regeneration produced no diff.

      - name: Land the regeneration through a pull request that merges itself
        # Was `git push` — refused by the ruleset on `main`, which requires `DCO / Signed-off-by`,
        # `test (ubuntu-latest, 3.11)` and `gate` on every commit that lands there and exempts no
        # actor. A regeneration that changes something is exactly the run that used to lose its
        # work here, while every quiet run reported success: the failure only ever appeared on the
        # days the job had something to land. See docs/maintainer/automation-lands-via-pr.md.
        #
        # `land_change.py` signs the commit off (DCO is one of the three required checks), pushes
        # it to the stable branch `bot/update-lessons` and enables squash auto-merge: the pull
        # request is made once and updated by later runs instead of accumulating one PR per day in
        # front of a human. It stages everything (`git add -A`) on purpose — the page generator
        # both creates files (a new lesson gets a new page) and deletes them (a retitled lesson
        # orphans the old URL) — and it exits 0 without opening anything when the regeneration
        # produced no diff, so "Check for changes" above is now a log line rather than a gate.
        env:
          # `SHELDON_PAT`, never `GITHUB_TOKEN`: a branch pushed with `GITHUB_TOKEN` starts no
          # workflow runs, so the required checks would never report and the auto-merge would wait
          # forever.
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          python3 scripts/ci/land_change.py \
            --branch bot/update-lessons \
            --title "chore: auto-update lessons.json, public counts and generated pages" \
            --note "data/lessons.json, the OKF export (data/okf/lessons.jsonl), every managed public lesson count, and the static lesson/topic pages."
