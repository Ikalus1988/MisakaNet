name: Update lessons.json

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at 08:00 Beijing time
  workflow_dispatch:  # Manual trigger for release prep

# Serialize runs: two overlapping runs regenerate and commit the same artifacts.
# That exact race is what left leaderboard-watch in a detached HEAD (#1625).
concurrency:
  group: update-lessons
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate lessons.json
        run: python3 scripts/update_lessons_json.py

      # Static lesson/topic pages and the sitemap are derived from lessons.json.
      # Nothing ran this until 2026-09-12, so the site served 205 lesson pages for
      # 378 lessons and topic pages with counts frozen at generation time
      # (docs/topics/contrib said "176" while the index held 330). It owns its
      # output: pages it no longer generates are pruned (marker-checked), and
      # docs/.generated-pages.json records the set.
      - name: Regenerate lesson/topic pages
        run: python3 scripts/build_lesson_pages.py

      - name: Check for changes
        id: check
        run: |
          # update_lessons_json.py rewrites data/lessons.json and then refreshes
          # every managed public lesson count via scripts/sync_lesson_count.py
          # (README, ARCHITECTURE, website metadata, issue templates, …). Ask git
          # what changed instead of hardcoding that file list: the registry grows,
          # and a stale list here is how counts drifted before (handoff 2026-09-11).
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --porcelain
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # -A (not -u): the page generator both creates files (new lessons get a
          # new page) and deletes them (a retitled lesson orphans the old URL).
          git add -A
          git commit -m "chore: auto-update lessons.json, public counts and generated pages"
          # main moves under this job (leaderboard snapshots, releases, maintainer
          # pushes), and a rejected push throws away a full regeneration. Retry once
          # through a rebase — but let a real conflict fail loudly: #1625 was a
          # `|| true` that swallowed exactly this and left the repo in a bad state.
          git push || { git pull --rebase origin main && git push; }
