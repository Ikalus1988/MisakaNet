name: Update lessons.json

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at 08:00 Beijing time
  workflow_dispatch:  # Manual trigger for release prep

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate lessons.json
        run: python3 scripts/update_lessons_json.py

      - name: Check for changes
        id: check
        run: |
          # data/lessons.json plus the {{LESSONS_COUNT}} marker docs refreshed
          # by update_lessons_json.py (audit 2026-09-05, QW6).
          if git diff --quiet data/lessons.json ARCHITECTURE.md README.md docs/_lessons_count.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/lessons.json ARCHITECTURE.md README.md docs/_lessons_count.txt
          git commit -m "chore: auto-update lessons.json + lesson count markers"
          git push
