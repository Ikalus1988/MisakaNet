name: MCP Endpoint Stress Tests

on:
  # `workers/**`, not a hand-picked list. This filter used to name `register-proxy-sw.js` plus five test
  # files, while the job itself runs `node --test workers/*.test.mjs` — so the *suite* was fixed in
  # 2026-09-12 (`d1-fts-search.test.mjs` had been red on main unnoticed) and the *trigger* kept the same
  # defect: a PR touching any of the other ~54 test files ran no node tests at all. Found by an
  # architecture review, 2026-09-29. A path filter that enumerates files is a file list that drifts.
  pull_request:
    paths:
      - "workers/**"
      - ".github/workflows/mcp-stress.yml"
  push:
    branches: [main]
    paths:
      - "workers/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "22"
      - name: Run MCP stress suite
        run: |
          set -o pipefail
          node --expose-gc --test workers/mcp-endpoint.stress.test.mjs 2>&1 | tee mcp-stress-results.txt
      - name: Run MCP no-match tests (PRD ① intake loop)
        run: |
          node --test workers/mcp-no-match.test.mjs
      # The whole worker suite, not a hand-picked list: this file used to name four
      # test files, and `d1-fts-search.test.mjs` sat red on main unnoticed because it
      # was not one of them (found 2026-09-12 — the same "a check nothing runs"
      # pattern as the lesson counts and the page generator). The suite runs in ~4s.
      #
      # Keep the glob quoted: `workers/*.test.mjs` (and an *unquoted* `workers/**`) does
      # not reach `workers/email-register/email-utils.test.mjs`, so that file ran in no
      # workflow. Node expands the quoted `**` pattern and matches at every depth.
      - name: Run the full worker test suite
        run: |
          node --test 'workers/**/*.test.mjs'
      - name: Run D1 lesson service tests (PRD ④)
        run: |
          node --test workers/d1-lesson-service.test.mjs
      - name: Run MCP anonymous-read tests (PRD ④ free quota)
        run: |
          node --test workers/mcp-anonymous-read.test.mjs
      - name: Run submit_intake kind tests (question kind)
        run: |
          node --test workers/intake-kind.test.mjs
      - name: Publish performance metrics
        if: always()
        run: |
          {
            echo "## MCP stress metrics"
            echo '```json'
            grep 'MCP_STRESS_METRIC' mcp-stress-results.txt | sed 's/^.*MCP_STRESS_METRIC //' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload stress results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: mcp-stress-results
          path: mcp-stress-results.txt
