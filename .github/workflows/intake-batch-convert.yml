name: Intake Batch Convert

# The scheduled half of the intake flywheel (docs/maintainer/intake-flywheel.md).
#
# What it does: asks the converter to turn every open `mcp-intake` report into a lesson, regenerates
# the derived corpus files, and opens **one** pull request. What it does not do: merge. A batch PR
# carries regenerated files (`data/lessons.json`, `data/okf/`, `lessons/index.md`, …), and
# `lesson-gate.yml` requires those to match the corpus — while `Auto-Merge Lessons` only merges PRs
# whose every path is under `lessons/` (`scripts/lesson_pr_mergeable.py`). Both rules are right, so a
# batch always ends with one human click. Pretending otherwise would mean weakening one of them.
#
# Weekly, not daily: measured 2026-11-02, roughly 100-150 reports arrive per week and a batch below
# ~5 lessons is not worth a PR. `workflow_dispatch` exists for the "I want it now" case.
on:
  schedule:
    - cron: "40 6 * * 1"   # Mondays 06:40 UTC, before the daily data sync at 00:00 UTC reruns it
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: intake-batch-convert
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install the corpus dependencies
        run: python3 -m pip install --quiet pyyaml

      # The histogram is the point of this step: "converted 0" alone does not say whether the form is
      # still not asking, or whether the queue is simply empty. It goes into the job summary so the
      # answer is readable without opening a log.
      - name: Convert what the converter can read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/convert_intake_batch.py --write | tee /tmp/batch-report.txt
          {
            echo "### Intake batch"
            echo '```'
            cat /tmp/batch-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Anything written?
        id: changed
        run: |
          if git status --porcelain -- lessons/ | grep -q .; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- lessons/ | wc -l | xargs echo "new lesson file(s):"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "nothing convertible this week — the form-shape number in the summary says why"
          fi

      # Same generators `lesson-gate.yml` checks and `update-lessons.yml` runs. Omitting one is what
      # made a previous batch fail the "main-side generated files" step.
      - name: Regenerate the derived files
        if: steps.changed.outputs.any == 'true'
        run: |
          set -euo pipefail
          python3 scripts/update_lessons_json.py
          python3 scripts/export_okf.py
          python3 scripts/rebuild_lessons_index.py
          python3 scripts/export_public_vocabulary.py
          python3 scripts/sync_lesson_count.py
          python3 scripts/build_lesson_pages.py
          python3 scripts/gen_ranking_snapshot.py
          python3 scripts/build_feed.py
          python3 - <<'PY'
          import re, subprocess, pathlib
          out = subprocess.run(["python3", "scripts/evidence_distribution.py"],
                               capture_output=True, text=True).stdout.strip()
          p = pathlib.Path("docs/trust-semantics.md")
          t = p.read_text(encoding="utf-8")
          m = re.search(r"<!-- Generated by: python3 scripts/evidence_distribution\.py -->.*?(?=\n\nThree things)", t, re.S)
          if m:
              p.write_text(t[:m.start()] + out + t[m.end():], encoding="utf-8")
          PY

      - name: Open the batch pull request
        if: steps.changed.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          set -euo pipefail
          BRANCH="intake-batch/$(date -u +%Y-%m-%d)"
          git config user.name "misakanet-intake-bot"
          git config user.email "bot@misakanet.dev"
          git checkout -b "$BRANCH"
          git add -A
          git commit --signoff -m "feat(lessons): intake batch $(date -u +%Y-%m-%d)" \
            -m "$(cat /tmp/batch-report.txt)" \
            -m "Generated by .github/workflows/intake-batch-convert.yml from open \`mcp-intake\` reports.
          Each lesson cites its intake in \`provenance.issue\`; \`update-lessons.yml\` posts the receipt
          and closes the issue on the next daily run, so the loop ends without a person.
          The derived files are here because \`lesson-gate.yml\` requires them; that is also why this
          PR cannot take the auto-merge path (it is not lessons-only) and needs one click."
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "feat(lessons): intake batch $(date -u +%Y-%m-%d)" \
            --body "$(printf '%s\n\n' \
              'Converted by `scripts/convert_intake_batch.py` from the open `mcp-intake` queue.' \
              '```' "$(cat /tmp/batch-report.txt)" '```' \
              '**Why this is not auto-merged**: it carries the derived corpus files, which `lesson-gate.yml` requires in any PR that adds lessons, while `Auto-Merge Lessons` only takes PRs whose every path is under `lessons/`. Both rules are deliberate — this one needs a click.' \
              '**After merge**: `update-lessons.yml` posts the receipt on every cited intake and closes it.')"
          echo "opened $BRANCH"

      - name: Report what could not be converted
        if: steps.changed.outputs.any == 'false'
        run: echo "::notice::Nothing convertible this run — see the summary for the skip histogram."
