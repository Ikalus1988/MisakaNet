name: Intake Batch Convert

# The scheduled half of the intake flywheel (docs/maintainer/intake-flywheel.md).
#
# What it does: asks the converter to turn every open `mcp-intake` report into a lesson, regenerates
# the derived corpus files, and opens **one** pull request. It merges itself.
#
# Until 2026-11-19 that last sentence was false: a batch PR carries regenerated files
# (`data/lessons.json`, `data/okf/`, `lessons/index.md`, …) because `lesson-gate.yml` requires them in
# any PR that adds lessons, while `Auto-Merge Lessons` refused every path outside `lessons/` — so each
# batch ended with a human click and the queue moved at one batch a week against 35-45 reports a day.
# The rule now names the generator-owned paths (`lesson_pr_mergeable.GENERATED_PATHS`) instead of
# refusing them, and the gate's own proof does the work: it re-runs the generators, so output that
# does not match its lessons is red before anything merges.
#
# Two-hourly since 2026-11-20 (was six-hourly, and weekly before that). The weekly cadence existed
# because a batch cost a click and a review; with the click gone, the only argument left was "a batch
# below ~5 lessons is not worth a PR". Measured 2026-11-20: the queue grows **61 intakes a day** and a
# six-hourly run converted **2** — an 8x gap between what arrives and what leaves, which is why the
# open count kept climbing while every automation reported success. Two-hourly does not close that gap
# by itself (most intakes are not convertible: 33 of 81 lack Problem/Root Cause/Fix), but it stops the
# batch from being the second bottleneck. Each run that finds nothing opens no PR, so the extra ticks
# cost a checkout and a scan.
on:
  schedule:
    - cron: "40 */2 * * *"   # every two hours at :40, clear of the daily data sync at 00:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: intake-batch-convert
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      # `requirements.txt`, not just pyyaml: `gen_ranking_snapshot.py` imports the search engine, which
      # imports `misakanet_core`. Installing one dependency and not the others failed the first real
      # run of this workflow at the regenerate step — after the conversion had already succeeded.
      - name: Install the corpus dependencies
        run: python3 -m pip install --quiet -r requirements.txt

      # The histogram is the point of this step: "converted 0" alone does not say whether the form is
      # still not asking, or whether the queue is simply empty. It goes into the job summary so the
      # answer is readable without opening a log.
      - name: Convert what the converter can read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/convert_intake_batch.py --write | tee /tmp/batch-report.txt
          {
            echo "### Intake batch"
            echo '```'
            cat /tmp/batch-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Anything written?
        id: changed
        run: |
          if git status --porcelain -- lessons/ | grep -q .; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            git status --porcelain -- lessons/ | wc -l | xargs echo "new lesson file(s):"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "nothing convertible this week — the form-shape number in the summary says why"
          fi

      # Same generators `lesson-gate.yml` checks and `update-lessons.yml` runs. Omitting one is what
      # made a previous batch fail the "main-side generated files" step.
      # **Stage before regenerating.** `update_lessons_json.py` reads the corpus through
      # `canonical_lessons`, which only sees *tracked* files — so a lesson the batch has just
      # written is invisible to it until it is staged. (The command itself lives there; naming it
      # here would trip `test_workflow_git_quotepath`, which reads every occurrence.) Measured 2026-11-16 on #5110: the converter wrote 63
      # lessons, this step reported "Loaded 949 lessons / already consistent", and the pull request
      # shipped 63 lessons with the previous count and stale okf/index/llms.txt — which the PR gate
      # then caught as "main-side generated files" drift.
      #
      # The asymmetry is the trap: `export_public_vocabulary.py` walks the **disk** (so untracked
      # files inflate it locally), while `update_lessons_json.py` walks **git** (so unstaged files
      # vanish from it). Staging first satisfies both.
      - name: Stage the new lessons
        if: steps.changed.outputs.any == 'true'
        run: git add -A lessons/

      - name: Regenerate the derived files
        if: steps.changed.outputs.any == 'true'
        run: |
          set -euo pipefail
          # **This order is load-bearing** (`docs/maintainer/handoff-2026-11-15-part2.md` §4:
          # "顺序不能反"). The batch used to run `export_okf` and `rebuild_lessons_index` before
          # `sync_lesson_count`, which left both artifacts carrying the previous count — and the
          # PR's own suite said so (`test_okf_export_freshness`, `test_export_okf_frontmatter`,
          # `test_template_named_lessons_are_visible`), measured 2026-11-16 on #5104.
          python3 scripts/update_lessons_json.py
          python3 scripts/build_lesson_pages.py
          python3 scripts/sync_lesson_count.py
          python3 scripts/export_okf.py
          python3 scripts/rebuild_lessons_index.py
          python3 scripts/export_public_vocabulary.py
          python3 scripts/gen_ranking_snapshot.py
          # NOT `build_feed.py`: its `generated_at` and "newest merged PRs" change on every run, so a
          # batch PR that carried it would conflict with main by construction — measured on the first
          # automated batch (#4352), where the feed was the only real diff besides one lesson. The
          # daily sync owns that file.

          python3 - <<'PY'
          import re, subprocess, pathlib
          out = subprocess.run(["python3", "scripts/evidence_distribution.py"],
                               capture_output=True, text=True).stdout.strip()
          p = pathlib.Path("docs/trust-semantics.md")
          t = p.read_text(encoding="utf-8")
          m = re.search(r"<!-- Generated by: python3 scripts/evidence_distribution\.py -->.*?(?=\n\nThree things)", t, re.S)
          if m:
              p.write_text(t[:m.start()] + out + t[m.end():], encoding="utf-8")
          PY

      - name: Open the batch pull request
        if: steps.changed.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          set -euo pipefail
          BRANCH="intake-batch/$(date -u +%Y-%m-%d)"
          git config user.name "misakanet-intake-bot"
          git config user.email "bot@misakanet.dev"
          git checkout -b "$BRANCH"
          git add -A
          git commit --signoff -m "feat(lessons): intake batch $(date -u +%Y-%m-%d)" \
            -m "$(cat /tmp/batch-report.txt)" \
            -m "Generated by .github/workflows/intake-batch-convert.yml from open \`mcp-intake\` reports.
          Each lesson cites its intake in \`provenance.issue\`; \`update-lessons.yml\` posts the receipt
          and closes the issue on the next daily run, so the loop ends without a person.
          The derived files are here because \`lesson-gate.yml\` requires them; that is also why this
          PR cannot take the auto-merge path (it is not lessons-only) and needs one click."
          # `--force`, because the branch name is the date and it is machine-owned: a second run on the
          # same day (a closed batch, a re-dispatch after a fix) rebuilt the branch from scratch and
          # the plain push was rejected — measured twice on 2026-11-16 (runs 43875789523 and
          # 43885216486), each time after the lessons and the derived files were already committed.
          # `--force-with-lease` is not enough here: the workflow never fetches that branch, so the
          # lease has no expected value to compare against and the push stays rejected.
          git push --force -u origin "$BRANCH"
          # Idempotent on purpose: a re-run on the same day force-pushes the same branch, so the pull
          # request already exists and `gh pr create` would fail the job *after* the lessons and the
          # derived files are committed — measured 2026-11-16 (run 43890245556): the content landed,
          # the run went red, and nothing said why.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "pull request for $BRANCH already open — the force-push above updated it"
            exit 0
          fi

          gh pr create --base main --head "$BRANCH" \
            --title "feat(lessons): intake batch $(date -u +%Y-%m-%d)" \
            --label auto-merge-lesson \
            --body "$(printf '%s\n\n' \
              'Converted by `scripts/convert_intake_batch.py` from the open `mcp-intake` queue.' \
              '```' "$(cat /tmp/batch-report.txt)" '```' \
              '**Auto-merge**: this PR carries the derived corpus files, which `lesson-gate.yml` requires in any PR that adds lessons; `Auto-Merge Lessons` accepts them because `scripts/lesson_pr_mergeable.py` names the generator-owned paths, and the gate has already re-run those generators.' \
              '**After merge**: `update-lessons.yml` posts the receipt on every cited intake and closes it.')"
          echo "opened $BRANCH"

      - name: Report what could not be converted
        if: steps.changed.outputs.any == 'false'
        run: echo "::notice::Nothing convertible this run — see the summary for the skip histogram."
