# CodeQL advanced setup — applies .github/codeql/codeql-config.yml
# (excludes the documented py/clear-text-logging-sensitive-data false
# positive on scripts/check_worker_secrets.py, uses security-extended).
# Enabling this workflow replaces the repository's default setup.
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'   # weekly Sunday 06:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      # No autobuild: python/javascript are interpreted languages — the
      # Python package pulls heavy deps (torch) that pip-installing would
      # slow or break the scan for no analysis benefit.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        with:
          category: "/language:${{ matrix.language }}"
