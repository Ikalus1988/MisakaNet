# CodeQL advanced setup — applies .github/codeql/codeql-config.yml
# (excludes the documented py/clear-text-logging-sensitive-data false
# positive on scripts/check_worker_secrets.py, uses security-extended).
# Enabling this workflow replaces the repository's default setup.
name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 0'   # weekly Sunday 06:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # This was `360`, which is GitHub's default and therefore no bound at all — a hung analysis
    # held its runner for six hours. There is no completed run of this job in the retrievable
    # window to measure against, so 120 is a judgement rather than a derived number: it keeps the
    # intent of not killing a slow security scan while cutting a hang at two hours instead of six.
    # If an analysis is ever seen to need longer, raise it with the run that showed it.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      # No autobuild: python/javascript are interpreted languages — the
      # Python package pulls heavy deps (torch) that pip-installing would
      # slow or break the scan for no analysis benefit.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          category: "/language:${{ matrix.language }}"
