name: MCP first-byte
# Time-to-first-byte against the live MCP endpoint, judged structurally (see scripts/bench_ttfb.py).
#
# Why this is not a per-PR check: every run makes ~25 HTTPS requests to production, and a runner's
# network varies by region and time of day, so a per-PR assertion would be noise in the way of review.
# It runs daily, on demand, and on the one class of PR that can regress it — a change to the worker's
# response path or to the probe's own thresholds.
#
# The assertions are relative on purpose: "first byte before last byte", "SSE not slower than JSON",
# "the endpoint answers". A fixed fast call (`tools/list`) is measured first as a network baseline; if
# that baseline is slow or flaky the whole run is **inconclusive**, never a failure — a bad link must
# not be allowed to convict the code. That guard is the difference between a check people read and one
# they mute.
#
# The second half of the run asks the other axis (#5245): does the body that arrives still match the
# length the server announced? `scripts/probe_mcp_body.py` answers that, with the same inconclusive
# guard — a body cut short by a dropping link and a body cut short by the worker are the same bytes to
# a client, so the probe reports the count and lets the reader judge instead of guessing.

on:
  schedule:
    # 06:20 UTC — after the nightly index rebuild (≤15 min after 06:00 syncs) and before the heartbeat.
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      samples:
        description: 'Samples per path'
        required: false
        default: '10'
  pull_request:
    paths:
      - 'workers/register-proxy-sw.js'
      - 'scripts/bench_ttfb.py'
      - 'scripts/probe_mcp_body.py'
      - '.github/workflows/ttfb.yml'

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.11'

      - name: Measure first-byte vs total
        id: measure
        env:
          SAMPLES: ${{ github.event.inputs.samples || '10' }}
        run: |
          set -o pipefail
          # The script's own exit code is the verdict (1 = fail, 0 = pass/inconclusive). It writes the
          # table to stdout so the summary and the log are the same artefact.
          python3 scripts/bench_ttfb.py --samples "$SAMPLES" --json-out ttfb-report.json \
            | tee ttfb-report.md

      - name: Measure body integrity
        id: body
        env:
          SAMPLES: ${{ github.event.inputs.samples || '10' }}
        run: |
          set -o pipefail
          # Same contract as the step above: the script's exit code is the verdict
          # (1 = a body stopped before its announced end, 0 = pass or inconclusive).
          python3 scripts/probe_mcp_body.py --samples "$SAMPLES" --check \
            --json-out body-report.json | tee body-report.md

      - name: Verdict in the job summary
        if: always()
        run: |
          {
            echo "### MCP first-byte vs total"
            echo ""
            if [ -f ttfb-report.md ]; then cat ttfb-report.md; else echo "(no report was produced)"; fi
            echo ""
            echo "### MCP body integrity"
            echo ""
            if [ -f body-report.md ]; then cat body-report.md; else echo "(no report was produced)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ttfb-report
          path: |
            ttfb-report.md
            ttfb-report.json
            body-report.md
            body-report.json
          if-no-files-found: warn

      - name: Calibration note on failures
        if: failure()
        run: |
          echo "::error::the live endpoint failed the streaming or body-integrity assertions — read the tables above."
          echo "If the baseline row is slow or mostly failing, this is the runner's link, not the code:"
          echo "re-run before changing anything. A non-zero 'short' column is different: it means a body"
          echo "stopped before the announced end, which is #5245 (either the worker or the link — the"
          echo "'answered' column tells you which)."
