name: 御坂网络注册

# A registration issue is welcomed and closed — and this job writes **nothing**: no counter, no
# commit, no push. It used to assign the next node number by incrementing `data/counter.json` and
# pushing to `main`, which failed twice over (issue #2106):
#
#   1. The ruleset on `main` (23826057, `bypass_actors: []`) requires three status checks on any
#      commit that lands there, and GitHub enforces them on a direct push too. Three registration
#      runs died on 2026-09-22 (35749203103 / 35761772072 / 35764549504), and the welcome comment
#      and the close were skipped with them.
#   2. `data/counter.json` is a **mirror** of the worker's KV counter, not a source. The file said
#      11047 while KV said 11777 on 2026-09-23, so the number the site displayed as "已分配
#      Misaka11048" was ~730 nodes behind the id the user's own `misakanet_register` call returned.
#
# Moving the write behind a pull request would have been worse than the push: ten minutes of
# required checks paid by the person registering, and two registrations in flight reading the same
# counter and handing out the same number. The number is allocated by the worker (KV
# `node_counter`), which is the path MCP and email registration already use; `sync-node-counter.yml`
# mirrors KV back into the repository.
#
# What is left here is the part only this job can do: tell a person, where they already are, how to
# register and what to expect. `scripts/register_issue.py` does it, and it is unit-tested — including
# the two things that were wrong in the copy (a read quota that no longer exists, and a node number
# nobody had allocated).

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: '要欢迎并关闭的 issue 编号（自动触发失败时的手工兜底）'
        required: true
        type: string

# `issues: write` and nothing else. No `contents`, so this job *cannot* write the repository even
# if someone later adds a step that tries to — the cheapest possible form of the guarantee this
# file is about. It also needs no secret: the run comments as `github-actions[bot]`.
permissions:
  issues: write

# Serialised per issue: a `reopened` and a manual dispatch can overlap, and two runs posting the
# welcome would produce two comments (the marker makes the second one an edit, but not if they
# race).
concurrency:
  group: register-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  register:
    # The label is the mechanical signal — `.github/ISSUE_TEMPLATE/register.yml` and the worker's
    # `/api/register` both set `labels: [registration]`. The title prefixes are the legacy shapes
    # (`join: name`, `[JOIN] …`), matched as prefixes.
    #
    # The guard used to be `contains(title, 'register')`, and on 2026-09-22 that fired this job on
    # three unrelated issues of mine — "docs(site): registration copy still frames registration as
    # the way in", "fix(api): `client_id` is a credential in practice — the register reuse path …",
    # "[Intake] agent loses token after 24h silent period; misakanet_register …" — each of which
    # then went red at the push step and looked like a broken registration path.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.title != null &&
       (contains(github.event.issue.labels.*.name, 'registration') ||
        startsWith(github.event.issue.title, 'join') ||
        startsWith(github.event.issue.title, 'Join') ||
        startsWith(github.event.issue.title, '[join]') ||
        startsWith(github.event.issue.title, '[JOIN]') ||
        startsWith(github.event.issue.title, '[Join]')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The script is the only reason for a checkout — there is no Python to install (3.12 is on the
      # image) and no `data/counter.json` to read any more.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Welcome the issue, label it, close it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: python3 scripts/register_issue.py --issue "$ISSUE_NUMBER"
