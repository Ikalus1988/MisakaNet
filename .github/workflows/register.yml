name: 御坂网络注册

on:
  issues:
    types: [opened, reopened]
  # 手动触发兜底（Worker 不通时用）
  workflow_dispatch:
    inputs:
      node_name:
        description: '节点名称（可选，留空自动分配）'
        required: false
        type: string

# 串行化：同一时间只处理一个注册请求，避免 counter.json 竞态
concurrency:
  group: register-node
  cancel-in-progress: false

jobs:
  register:
    # 处理 "join"、"register" 相关 Issue 或 workflow_dispatch 手动触发
    # 支持中英文：join / Join / register / Register / 加入 / 注册 / Registration
    # 还处理邮件注册 Worker 创建的 Issue（email-register: 前缀）
    # 排除 "[Onboarding]" 聚合入口（如 #1258 "always open" 指引 issue）——
    # 此类 issue 标题历史含 "Register"，reopen 会误触发注册-关闭循环（2026-09-08 复现）。
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.title != null &&
       !startsWith(github.event.issue.title, '[Onboarding]') &&
       (contains(github.event.issue.title, 'join') ||
        contains(github.event.issue.title, 'Join') ||
        contains(github.event.issue.title, 'register') ||
        contains(github.event.issue.title, 'Register') ||
        contains(github.event.issue.title, '加入') ||
        contains(github.event.issue.title, '注册') ||
        contains(github.event.issue.title, 'Registration') ||
        contains(github.event.issue.title, 'email-register')))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pillow

      - name: Extract node ID (for email-register) or assign new
        id: assign
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Check if this is an email-register issue (already assigned by Worker)
          EMAIL_NODE=$(echo "$ISSUE_TITLE" | grep -oP 'Misaka\d{5}' || true)
          if [ -n "$EMAIL_NODE" ]; then
            echo "NODE_ALREADY_ASSIGNED=true" >> "$GITHUB_OUTPUT"
            echo "USER=$EMAIL_NODE" >> "$GITHUB_OUTPUT"
            echo "NEXT=$(echo $EMAIL_NODE | grep -oP '\d{5}')" >> "$GITHUB_OUTPUT"
            echo "Already assigned: $EMAIL_NODE (from email Worker)"
            exit 0
          fi

          # Regular registration: assign new number
          REGISTERED=false
          ATTEMPT=0
          while [ $ATTEMPT -lt 5 ]; do
            ATTEMPT=$((ATTEMPT + 1))
            # 读取当前 counter（concurrency group 保证串行，不会读到过期值）
            current=$(python3 -c "import json; print(json.load(open('data/counter.json'))['current'])")
            next=$((current + 1))
            user="Misaka$(printf '%05d' $next)"

            # Update counter.json
            python3 -c "
          import json
          with open('data/counter.json') as f:
              c = json.load(f)
          c['current'] = $next
          c['updated'] = '$(date -u +%Y-%m-%dT%H:%M:%SZ)'
          json.dump(c, open('data/counter.json','w'), indent=2)
          "

            # Commit and push (fail-safe if another run pushed first)
            git config user.name "misakanet-bot"
            git config user.email "bot@misakanet.dev"
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Ikalus1988/MisakaNet.git
            git add --force data/counter.json
            git commit -m "register: ${user}" || true

            if git push --force-with-lease; then
              echo "NEXT=$next" >> $GITHUB_OUTPUT
              echo "USER=$user" >> $GITHUB_OUTPUT
              echo "Assigned $user (attempt $ATTEMPT)"
              REGISTERED=true
              break
            else
              echo "Push conflict (attempt $ATTEMPT/5), retrying..."
              sleep 2
            fi
          done
          if [ "$REGISTERED" != "true" ]; then
            echo "FATAL: Could not assign node number after 5 attempts"
            exit 1
          fi

      - name: Post welcome message with entry test
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          NODE_ALREADY_ASSIGNED: ${{ steps.assign.outputs.NODE_ALREADY_ASSIGNED }}
          NEXT: ${{ steps.assign.outputs.NEXT }}
          USER: ${{ steps.assign.outputs.USER }}
        with:
          script: |
            const alreadyAssigned = process.env.NODE_ALREADY_ASSIGNED === 'true';
            const num = parseInt(process.env.NEXT);
            if (!num || isNaN(num)) {
              core.setFailed('No node number assigned — previous step failed');
              return;
            }
            const user = process.env.USER;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                `🧠 **欢迎加入御坂网络，${user}！**`,
                '',
                `你是第 **${num - 10000}** 位接入者。`,
                `你的节点代号：**${user}**`,
                alreadyAssigned ? `（注册方式：邮件）` : '',
                '',
                '',
                '---',
                '',
                '## ⚡ 第一步：30 秒接入测试（推荐：远程 MCP，无需 clone / 无需下载）',
                '',
                '不用下载任何文件 —— 一次 HTTP 调用就能检索全网失败课程：',
                '',
                '```bash',
                'curl -sS https://misakanet.org/mcp \\',
                "  -H 'Content-Type: application/json' \\",
                "  -H 'Accept: application/json' \\",
                "  -H 'MCP-Protocol-Version: 2025-06-18' \\",
                "  -H 'Origin: https://misakanet.org' \\",
                '  -d \'{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"misakanet_search",',
                '        "arguments":{"query":"pip install timeout or SSL error","top":3}}}\'',
                '```',
                '',
                '让 Agent 用检索结果作答，格式如下：',
                '',
                '```',
                '📋 御坂网络检索结论',
                '  命中 {N} 条相关知识',
                '  可复用的内容：{标题列表}',
                '  最有用的知识摘要：{简要说明}',
                '```',
                '',
                '### 少踩坑的三条（都是实测过的）',
                '',
                '- **配额**：匿名 5 次读取/天（按 IP，`misakanet_search` + `misakanet_get_lesson` 合并计数）。**共享出口 IP（公司 NAT、CI runner）很容易一上来就用满** —— 如果第一次调用就返回 `Rate limit`，先拿 token（免账号、一次调用）：',
                '',
                '  ```bash',
                '  curl -sS https://misakanet.org/mcp \\',
                "    -H 'Content-Type: application/json' \\",
                "    -H 'MCP-Protocol-Version: 2025-06-18' \\",
                "    -H 'Origin: https://misakanet.org' \\",
                '    -d \'{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"misakanet_register",',
                '          "arguments":{"agent_type":"<你的节点名>"}}}\'',
                '  ```',
                '',
                '  把返回的 `token` 放进后续请求的 `Authorization: Bearer mcp_...` 头即可不限次（30 天过期，重注册即可）。',
                "- **`Origin` 头**：可以不带（缺省放行）；但**带错值会 403 `invalid Origin`**（MCP 规范的防 DNS rebinding）。照上面写就对了。",
                "- **Agent 客户端偏好流式**时，把 `-H 'Accept: application/json'` 换成 `-H 'Accept: application/json, text/event-stream'`，并在 curl 上加 `-N`：服务端会以 `event: message` 分块返回，内容与普通 JSON 完全一致。",
                '',
                '### 贡献：第一次提交也不需要账号',
                '',
                '检索无果就是知识盲区，直接匿名报料（自动开 issue，进人工 triage）：',
                '',
                '```bash',
                'curl -sS https://misakanet.org/mcp \\',
                "  -H 'Content-Type: application/json' \\",
                "  -H 'MCP-Protocol-Version: 2025-06-18' \\",
                "  -H 'Origin: https://misakanet.org' \\",
                '  -d \'{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"misakanet_submit_intake",',
                '        "arguments":{"problem":"<你的失败与修复>","source":"<你的节点名>"}}}\'',
                '```',
                '',
                '<details><summary>离线 / 无网络时的替代路径</summary>',
                '',
                '下载索引（约 1.1 MB）后自行检索 —— 慢一些，但不需要任何出网调用：',
                '',
                '```',
                'https://raw.githubusercontent.com/Ikalus1988/MisakaNet/main/data/lessons.json',
                '```',
                '</details>',
                '',
                '> 完成上述任一路径后，你就正式接入御坂网络了。',
                '> 从此你的 Agent 会用群体记忆执行任务 —— 而它踩过的坑，也会变成别人的捷径。',
                '',                `> —— ${user}，接入时间 ${new Date().toISOString().slice(0,10)}`,
              ].join('\n')
            });

      - name: Close issue + mark registered
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['registered']
            });
            await github.rest.issues.update({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed'
            });
