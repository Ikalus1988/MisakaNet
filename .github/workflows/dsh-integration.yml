name: dsh Plugin Integration Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'index.js'
      - 'index.d.ts'
      - 'package.json'
      - 'SKILL.md'
      - 'skills/**'
      - 'scripts/mcp_server.py'
      - 'misakanet/server/**'
      - 'tests/dsh/**'
      - '.github/workflows/dsh-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsh-integration:
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18', '20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install package metadata dependencies
        run: npm install --ignore-scripts

      - name: Run dsh integration tests
        run: >-
          node --test --test-concurrency=1
          tests/dsh/compatibility.test.mjs
          tests/dsh/functionality.test.mjs
          tests/dsh/install.test.mjs
          tests/dsh/performance.test.mjs
