name: Intake Bot Demo

on:
  workflow_dispatch:
    inputs:
      error:
        description: 'Test error text'
        required: false
        default: 'ModuleNotFoundError: No module named requests'
      mode:
        description: 'Operation mode'
        required: false
        default: 'suggest-only'
        type: choice
        options:
          - suggest-only
          - suggest-and-intake
      pr-number:
        description: 'PR to comment on (testing aid; empty = the PR associated with the failing run)'
        required: false
        default: ''

  workflow_run:
    # NOT `["*"]`. A wildcard here creates a run of *this* workflow whenever any other workflow
    # completes: 21,126 runs by 2026-09-17, of which 98.1% were skipped by the job-level `if`
    # below. The demo exists to react to a *failing CI run*, so it names the workflow that is this
    # repository's CI; widening it later is a one-line change.
    workflows: ["Cross-Platform Tests"]
    types: [completed]

jobs:
  intake-demo:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The action reads the failing job's log through the API (`.../actions/jobs/{id}/logs`), which
      # needs Actions: read. Declaring `permissions:` at all sets every scope left out to `none`, and
      # without this one the fetch 403s, the warning is swallowed, and the bot "skips" — green, with
      # nothing posted. Same failure shape as #1825, different cause. The `error:` input above masks
      # it on the dispatch path, which is exactly why it went unnoticed: the demo's manual trigger
      # always passes text, and its workflow_run path never does.
      actions: read
      pull-requests: write
      # Both, not just pull-requests: the comment step calls the "create an issue comment" endpoint,
      # which is documented as Issues: write — a PR *is* an issue for that endpoint.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Run intake bot
        # `./` resolves to the repository-root action.yml — the same entry point external callers
        # reach as `Ikalus1988/MisakaNet@v1`. Dogfooding one entry point is the point; the demo used
        # to exercise .github/actions/misaka-intake-bot, a path no `owner/repo@ref` can reference.
        uses: ./
        id: intake
        with:
          mode: ${{ inputs.mode || 'suggest-only' }}
          error: ${{ inputs.error || '' }}
          comment-on-pr: 'true'
          pr-number: ${{ inputs.pr-number || '' }}
