name: PR Genius Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  checks: read
  contents: read
  # `write`, not `read`: the last step posts the analysis as a PR comment through
  # `POST /repos/{owner}/{repo}/issues/{n}/comments`, and on a pull request that requires
  # `pull-requests: write`. With `read`, every run answered `HTTP Error 403: Forbidden` — measured
  # in 11 of 11 job logs (e.g. run 35205310232) — while the check stayed green, because
  # scripts/pr_genius_report.py treated delivery as advisory and only wrote to stderr. The four
  # workflows in this repo that do post PR comments all grant `pull-requests: write`.
  pull-requests: write
  issues: write  # same endpoint for repository issues

jobs:
  pr-genius:
    if: |
      !github.event.pull_request.draft &&
      !startsWith(github.head_ref, 'bot/') &&
      !contains(github.event.pull_request.labels.*.name, 'docs-only')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The action moved in v1.9.x, and that is what the dependabot bump could not express.
      #
      # Dependabot proposed `db0ff6ed…` (tag v1.9.1) while keeping this line's path, and the job then failed
      # on every run — including on the bump PR itself:
      #
      #   ##[error]Can't find 'action.yml', 'action.yaml' or 'Dockerfile' for action
      #   'zsxh1990/pr-genius/.github/actions/pr-genius-check@db0ff6ed…'.
      #
      # Measured upstream through the contents API: at v1.9.1 the subdirectory `.github/actions/pr-genius-check`
      # holds only `post_comment.py`, and the action's manifest is at the **repository root** instead — where
      # `action.yml` declares the same inputs this step passes (`title`, `repo`, `body`). So the correct bump is a
      # **repoint plus the new SHA**, which is a thing a reviewer does and dependabot cannot: it only moves the
      # SHA. (This repository closed two of these proposals — #2400 and #2407 — before noticing the move; the
      # earlier comment here said "do not merge until the manifest is back at this path", which was the wrong
      # conclusion from the right measurement.)
      #
      # If this fails again with the same error: curl the manifest at the pinned SHA
      # (`contents/.github/actions/pr-genius-check/action.yml?ref=<sha>`) *and* at the root
      # (`contents/action.yml?ref=<sha>`), and repoint the path to wherever it lives. Do not ignore the bump —
      # a pinned action whose path is stale stops being updated at all.
      - uses: zsxh1990/pr-genius@db0ff6ed2af9d24b9a82495ac27d22ff6e26d196  # v1.9.1
        id: pr-genius
        continue-on-error: true  # advisory only: never block merge on tool failure
        with:
          title: ${{ github.event.pull_request.title }}
          repo: ${{ github.repository }}
          body: ${{ github.event.pull_request.body }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      # pr_genius_report.py imports yaml and treats it as an optional
      # dependency: without it, `.pr-genius.yaml` falls back to a hand-rolled
      # parser that drops every list (rules.path_rules, rules.custom_patterns
      # and rules.issue_link.patterns are lost), so CI ran with a degraded
      # rule set that no one could see. setup-python is required before this
      # install — ubuntu-latest's system python is externally managed.
      - name: Install dependencies
        run: python3 -m pip install -q pyyaml

      - name: Output enhanced PR Genius result
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIER: ${{ steps.pr-genius.outputs.tier }}
        run: python3 scripts/pr_genius_report.py --event "$GITHUB_EVENT_PATH" --risk "$TIER"
