name: PR Genius Check

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-genius:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: zsxh1990/pr-genius/.github/actions/pr-genius-check@main
        id: pr-genius
        with:
          title: ${{ github.event.pull_request.title }}
          repo: ${{ github.repository }}
          body: ${{ github.event.pull_request.body }}

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const tier = '${{ steps.pr-genius.outputs.tier }}';
            const emoji = tier === 'high_risk' ? '🔴' : tier === 'medium_risk' ? '🟡' : '🟢';
            const result = '${{ steps.pr-genius.outputs.result }}';
            
            let parsed = {};
            try { parsed = JSON.parse(result); } catch(e) {}
            
            const checklist = (parsed.checklist || [])
              .map(c => `- **[${c.priority}]** ${c.action}: ${c.hint || ''}`)
              .join('\n');
            
            const body = [
              `## ${emoji} PR Genius Analysis`,
              '',
              `**Risk Level:** ${tier}`,
              '',
              checklist ? `### Checklist\n${checklist}` : '',
              '',
              '---',
              '*Powered by [PR Genius](https://github.com/zsxh1990/pr-genius)*'
            ].filter(Boolean).join('\n');
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
