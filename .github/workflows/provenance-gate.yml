name: Provenance Gate

on:
  pull_request:
    paths:
      - 'lessons/**'
      - 'scripts/check_provenance.py'
      - 'tests/test_check_provenance.py'
      - 'data/provenance-baseline.json'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  provenance:
    name: provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Set up job
        run: echo "Set up job"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests for the gate
        run: |
          python -m pytest tests/test_check_provenance.py -v

      - name: Get changed lesson files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
            echo "No PR — will sweep the whole corpus."
          else
            git fetch origin "${{ github.event.pull_request.base.ref }}"
            echo "changed=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD -- lessons/)" >> "$GITHUB_OUTPUT"
            echo "${{ steps.changed.outputs.changed }}" | tr ' ' '\n' | while read f; do echo "  changed: $f"; done
          fi

      - name: Classify added vs modified lesson files
        id: classify
        run: |
          if [ "${{ steps.changed.outputs.all }}" = "true" ]; then
            echo "added_list=$(find lessons -type f -name '*.md' | sort | jq -R -s 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
            echo "modified_list=[]" >> "$GITHUB_OUTPUT"
          else
            echo "added_list=$(echo '${{ steps.changed.outputs.changed }}' | tr ' ' '\n' | while read f; do git log --follow --diff-filter=A -1 --format='%H' -- "$f" 2>/dev/null | head -1; done | xargs -I{} git diff-tree --no-commit-id --name-only -r {} 2>/dev/null | grep '^lessons/' | sort | jq -R -s 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
            echo "modified_list=$(echo '${{ steps.changed.outputs.changed }}' | tr ' ' '\n' | while read f; do git log --follow -1 --format='%H' -- "$f" 2>/dev/null | head -1; done | xargs -I{} git diff-tree --no-commit-id --name-only -r {} 2>/dev/null | grep '^lessons/' | sort -u | jq -R -s 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"
          fi
          echo "  added: ${{ steps.classify.outputs.added_list }}"
          echo "  modified: ${{ steps.classify.outputs.modified_list }}"

      - name: Check provenance (tier 1 — every changed lesson)
        id: tier1
        run: |
          python scripts/check_provenance.py \
            --baseline data/provenance-baseline.json \
            --check "$(echo '${{ steps.changed.outputs.changed }}' | tr ' ' '\n' | grep '^lessons/' | sort -u | tr '\n' ' ')" \
            --report-json /tmp/tier1.json || true
          echo "summary=$(cat /tmp/tier1.json | jq -c .)" >> "$GITHUB_OUTPUT"
          cat /tmp/tier1.json

      - name: Check provenance (tier 2 — newly added lessons must justify a high evidence level)
        id: tier2
        if: steps.tier1.outputs.summary != ''
        run: |
          ADDED=$(echo '${{ steps.classify.outputs.added_list }}' | jq -r '.[]' 2>/dev/null)
          if [ -n "$ADDED" ]; then
            python scripts/check_provenance.py \
              --baseline data/provenance-baseline.json \
              --tier high \
              --check "$ADDED" \
              --report-json /tmp/tier2.json || true
            echo "summary=$(cat /tmp/tier2.json | jq -c .)" >> "$GITHUB_OUTPUT"
            cat /tmp/tier2.json
          else
            echo "No added lessons to check at tier 2."
            echo "summary={}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sweep the whole corpus (scheduled / manual)
        id: sweep
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.tier1.outputs.summary == ''
        run: |
          ALL_LESSONS=$(find lessons -type f -name '*.md' | sort | tr '\n' ' ')
          python scripts/check_provenance.py \
            --baseline data/provenance-baseline.json \
            --check "$ALL_LESSONS" \
            --report-json /tmp/sweep.json || true
          echo "summary=$(cat /tmp/sweep.json | jq -c .)" >> "$GITHUB_OUTPUT"
          cat /tmp/sweep.json

      - name: Comment the result on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let body = '## Provenance Gate ✅\n\nAll provenance checks passed.';
            try {
              const t1 = JSON.parse(fs.readFileSync('/tmp/tier1.json', 'utf8'));
              const keys = Object.keys(t1);
              if (keys.length > 0) {
                body = '## Provenance Gate ⚠️\n\nFound provenance issues in:\n';
                for (const k of keys) {
                  body += `- \`${k}\`\n`;
                }
              }
            } catch(e) {}
            try {
              const t2 = JSON.parse(fs.readFileSync('/tmp/tier2.json', 'utf8'));
              const keys = Object.keys(t2);
              if (keys.length > 0) {
                body += '\n### Tier 2 (new lessons, high evidence required)\n';
                for (const k of keys) {
                  body += `- \`${k}\`\n`;
                }
              }
            } catch(e) {}
            try {
              const sw = JSON.parse(fs.readFileSync('/tmp/sweep.json', 'utf8'));
              const keys = Object.keys(sw);
              if (keys.length > 0) {
                body += '\n### Sweep (full corpus)\n';
                for (const k of keys) {
                  body += `- \`${k}\`\n`;
                }
              }
            } catch(e) {}
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
