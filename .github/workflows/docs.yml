name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('requirements-docs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-

      - name: Install dependencies
        run: |
          pip install -r requirements-docs.txt

      # Every public lesson count (README/ARCHITECTURE/<meta description>/…)
      # must equal data/lessons.json. PRs are covered by
      # tests/test_lesson_count_ssot.py under pytest; direct pushes to main are
      # not, and that is exactly how the site's <meta description> sat at "435"
      # while the corpus held 378 (handoff 2026-09-12). Zero-dependency check.
      - name: Verify public lesson counts
        if: github.event_name == 'push'
        run: python3 scripts/sync_lesson_count.py --check --quiet

      # Same idea for the generated lesson/topic pages: they are derived from
      # data/lessons.json, so a hand-edit (or a lesson whose page was never
      # regenerated) fails here instead of living on the site.
      - name: Verify generated pages
        if: github.event_name == 'push'
        run: python3 scripts/build_lesson_pages.py --check --quiet

      - name: Build documentation
        run: mkdocs build

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
