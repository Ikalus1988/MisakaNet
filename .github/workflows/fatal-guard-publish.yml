name: Publish @misaka-net/fatal-guard

on:
  push:
    tags:
      - "fatal-guard-v*"
  workflow_dispatch:      # allow a manual publish of the current version

#  * **Authentication, best first** (2026-09-30, the migration `misakanet-publish.yml` made): this job asks
#    for `id-token: write`, so npm CLI (>= 11.5.1 on Node >= 22.14) can exchange a GitHub OIDC token for a
#    short-lived publish credential — nothing long-lived to rotate. One-time entry on npmjs.com (package ->
#    Settings -> Trusted Publisher -> GitHub Actions): user `Ikalus1988`, repository `MisakaNet`, **workflow
#    filename `fatal-guard-publish.yml`**, environment `release` (this job declares it; leaving the field empty also works), and
#    **allow direct `npm publish`** — the staged-only default would reject this workflow's command. Until the
#    entry exists the token keeps working: npm prefers OIDC when it is available, then falls back.
permissions:
  contents: read
  id-token: write      # npm trusted publishing (OIDC)

jobs:
  publish:
    # Secrets live in the `release` environment, not at repository level: they are publish and
    # deploy credentials, and environment secrets can carry protection rules — a branch policy today,
    # and "required reviewers" as soon as it is switched on, which is what stops a workflow that has
    # been edited on a branch from using them without a person approving the run.
    environment: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fatal-guard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "24"   # trusted publishing: npm CLI >= 11.5.1 needs Node >= 22.14
          registry-url: "https://registry.npmjs.org"

      - name: Verify zero dependencies
        run: |
          DEPS=$(node -e "const p=require('./package.json');console.log(p.dependencies?Object.keys(p.dependencies).length:0)")
          echo "dependencies: $DEPS"
          [ "$DEPS" = "0" ] || { echo "FAIL: expected 0 dependencies"; exit 1; }

      - name: Read the version to publish
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      # Idempotent by design (2026-09-30, matching `misakanet-publish.yml`): a re-run after a successful
      # publish used to fail with a bare npm conflict, so "run it again to be sure" was impossible and a
      # retried event looked like a broken release. A version already on the registry is a *done* state.
      - name: Skip when npm already has this version
        id: npm_state
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PKG: "@misaka-net/fatal-guard"
        run: |
          set -euo pipefail
          ALREADY=false
          FOUND=$(npm view "$PKG@$VERSION" version 2>/tmp/npm-view.err || true)
          if [ "$(printf '%s' "$FOUND" | tr -d '[:space:]')" = "$VERSION" ]; then
            ALREADY=true
            echo "$PKG@$VERSION is already on npm - nothing to publish."
            echo "### $PKG@$VERSION is already on npm" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "npm does not report $PKG@$VERSION as published - publishing it"
            if [ -s /tmp/npm-view.err ]; then sed 's/^/    npm view: /' /tmp/npm-view.err | head -3; fi
          fi
          echo "already=$ALREADY" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        if: steps.npm_state.outputs.already != 'true'
        run: |
          # Trusted publishing first; the token is the transitional fallback. With neither, say so by name
          # instead of letting npm emit a bare 401 (2026-09-30).
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::Neither trusted publishing (no OIDC token request URL) nor NPM_TOKEN is available."
            echo "::error::Configure a trusted publisher for workflow fatal-guard-publish.yml on npmjs.com,"
            echo "::error::or the transitional NPM_TOKEN secret."
            exit 1
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC available: npm will authenticate with trusted publishing (no long-lived token)."
            echo "node $(node --version) / npm $(npm --version)"
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
