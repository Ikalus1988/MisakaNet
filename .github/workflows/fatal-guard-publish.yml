name: Publish @misaka-net/fatal-guard

on:
  push:
    tags:
      - "fatal-guard-v*"

permissions:
  contents: read

jobs:
  publish:
    # Secrets live in the `release` environment, not at repository level: they are publish and
    # deploy credentials, and environment secrets can carry protection rules — a branch policy today,
    # and "required reviewers" as soon as it is switched on, which is what stops a workflow that has
    # been edited on a branch from using them without a person approving the run.
    environment: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/fatal-guard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify zero dependencies
        run: |
          DEPS=$(node -e "const p=require('./package.json');console.log(p.dependencies?Object.keys(p.dependencies).length:0)")
          echo "dependencies: $DEPS"
          [ "$DEPS" = "0" ] || { echo "FAIL: expected 0 dependencies"; exit 1; }

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
