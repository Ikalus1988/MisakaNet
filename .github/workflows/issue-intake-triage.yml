name: MCP Intake Triage

on:
  issues:
    # 'labeled' is deliberately excluded: triage itself applies labels, and an
    # issue created with pre-set labels fired 'opened' + N×'labeled'
    # concurrently, racing the alreadyCommented guard and posting duplicate
    # triage comments (observed on #1396, 2026-08-30). Re-triage stays
    # available via workflow_dispatch and the 'edited'/'reopened' events.
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing intake issue number to triage"
        required: true
        type: string

jobs:
  triage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'intake') ||
      contains(github.event.issue.labels.*.name, 'mcp-intake') ||
      startsWith(github.event.issue.title, '[Intake]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    env:
      ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # `require()` resolves against the workspace, so the classifier module has to be here.
          # The step needs nothing else from the tree — no history, no submodules.
          persist-credentials: false

      # The classifier is `scripts/intake_triage_classifier.cjs`, not inline text. It used to be a
      # `script:` string, which meant the only way to test it was to read this YAML, extract the
      # string and evaluate it — two code-scanning alerts (#386/#387) and a test that could not see
      # the file it was judging. Requiring the file gives the scanner real code to analyse and the
      # test the same function the workflow runs.
      - name: Classify MCP intake issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const classifyIntake = require('./scripts/intake_triage_classifier.cjs');
            await classifyIntake({ github, core, context });
