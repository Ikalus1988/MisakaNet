name: Leaderboard Watch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write   # the snapshot lands through the auto-merging PR, not a push to main

# Two pushes within ~a minute start two runs that both recompute the same snapshot and force-push
# it to the same `bot/leaderboard-watch` branch, so one run's snapshot would overwrite the other's
# mid-flight. Serialize instead of racing (cancel-in-progress: false so a queued run still runs
# and picks up the newest main).
concurrency:
  group: leaderboard-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          # `persist-credentials: false`, because `land_change.py` supplies its own: it pushes
          # `https://x-access-token:<PAT>@…`, and the token `actions/checkout` stored takes precedence
          # over the URL — so the branch went out as `github-actions[bot]` and every run on its pull
          # request came back `action_required`: held, never executed, with nothing able to satisfy the
          # required checks, so the self-merging PR could not merge. Measured 2026-09-25: 39 held runs on
          # `bot/release-version-sync` and 24 on `bot/build-feed`, with the version-sync PR stuck.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Compute and compare leaderboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/leaderboard_watch.py 2>&1

      - name: Land the snapshot through a pull request that merges itself
        # Was `git push` — refused by the ruleset on `main`, which requires three status checks on
        # every commit that lands there and exempts no actor. This job fires on every push to main
        # and only writes when the snapshot moved, so its failure was invisible until the day it
        # had something to write. See docs/maintainer/automation-lands-via-pr.md.
        #
        # The `[skip ci]` marker this commit used to carry is gone, deliberately: GitHub honours it
        # in a pull request title, which would suppress the *pull request's* own runs — the three
        # required checks would never report and the auto-merge would wait forever.
        # `land_change.py` refuses such a title for that reason. The post-merge run this no longer
        # suppresses is cheap and idempotent: it recomputes the same snapshot, finds the file
        # unchanged and exits 0 without opening anything.
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          if [ ! -f data/leaderboard.json ]; then
            echo "no snapshot produced; nothing to land"
            exit 0
          fi
          python3 scripts/ci/land_change.py \
            --branch bot/leaderboard-watch \
            --title "chore: update leaderboard snapshot" \
            --paths data/leaderboard.json data/leaderboard_meta.json \
            --note "leaderboard_watch.py writes both files, so both are named here."
