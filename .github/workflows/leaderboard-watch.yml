name: Leaderboard Watch

on:
  schedule:
    # Daily at 03:17 UTC (off-peak, avoids :00/:30 crowding)
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: leaderboard-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Compute and compare leaderboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/leaderboard_watch.py 2>&1

      # No land_change.py step — state is written to D1 via Worker API (#1919).
      # The repo no longer accumulates snapshot commits.
