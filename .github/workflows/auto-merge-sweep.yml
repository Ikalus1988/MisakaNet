name: Auto-Merge Sweep

# `Auto-Merge Lessons` decides once per event: when the label lands, when the branch moves, when a
# draft becomes ready. A check finishing is **not** one of those events, so a PR that was `wait` (checks
# still running) is never asked again — measured 2026-11-19 on the first intake batch PR (#5349):
# labelled with `auto-merge-lesson`, green twenty minutes later, never looked at again (issue #5350).
#
# This workflow is the "ask again" half, and it is deliberately the dumbest possible version of it:
# every half hour, take the PRs that are labelled and clean, and dispatch the real workflow at each.
# The decision, the payload shape and the merge itself stay where they were — one implementation, one
# set of tests (`scripts/lesson_pr_mergeable.py`), rather than a second sweeper that could disagree.
#
# Why a schedule rather than a `check_suite` trigger: `check_suite` payloads carry `pull_requests`,
# but GitHub does not deliver check-suite events for runs from forks, and this channel is opt-in for
# outside contributions too. Thirty minutes is indistinguishable from three for a queue that moves in
# days, and it does not depend on event semantics that already have a gap.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: write      # dispatch the deciding workflow
  pull-requests: read
  contents: read

concurrency:
  group: auto-merge-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find labelled, clean pull requests
        id: find
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # **Do not filter on `mergeStateStatus` from the list endpoint.** It is a *cached* field:
          # every merge into the default branch invalidates the cached mergeability of every open pull
          # request, and it reads `UNKNOWN` until GitHub recomputes it — on access, lazily. Measured
          # 2026-11-20: #5416 was `CLEAN` at 09:49Z (one candidate, dispatched), then `UNKNOWN` in
          # `gh pr list`/`mergeStateStatus` right after the next few merges landed, and this step
          # reported `candidates: 0` while `GET /pulls/5416` still answered `mergeable: true`,
          # `mergeable_state: clean`. A candidate filter that silently drops the very pull requests it
          # exists for is worse than no filter: the run is green.
          #
          # So: list by the facts GitHub always answers (label, draft), then ask the **single-PR**
          # endpoint, which computes mergeability rather than reading a cache — retrying while it says
          # `unknown`, because the first read is what triggers the computation.
          gh pr list --repo "$REPO" --state open --label auto-merge-lesson --limit 100 \
            --json number,isDraft \
            --jq '.[] | select(.isDraft == false) | .number' > /tmp/labelled.txt

          : > /tmp/candidates.txt
          while read -r pr; do
            [ -z "$pr" ] && continue
            state=""
            for attempt in 1 2 3 4; do
              state=$(gh api "repos/$REPO/pulls/$pr" --jq '.mergeable_state // "unknown"' 2>/dev/null || echo unknown)
              [ "$state" = "unknown" ] || break
              sleep 3
            done
            echo "#$pr mergeable_state=$state"
            [ "$state" = "clean" ] && echo "$pr" >> /tmp/candidates.txt
          done < /tmp/labelled.txt

          count=$(wc -l < /tmp/candidates.txt | tr -d ' ')
          echo "candidates: $count"
          tr '\n' ' ' < /tmp/candidates.txt; echo
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Re-ask the deciding workflow
        if: steps.find.outputs.count != '0'
        env:
          # `SHELDON_PAT` cannot dispatch: measured 2026-11-19T18:51Z, on the first real candidate
          # (#5349), `POST /actions/workflows/{id}/dispatches` answered
          # `403 Resource not accessible by personal access token`. The first run of this workflow
          # (16:30Z) passed only vacuously — it found zero candidates, and the loop below only goes
          # red when *every* dispatch fails, so `0 failed / 0 total` looked like success.
          #
          # `github.token` is the right identity here: this workflow's `permissions:` block already
          # grants `actions: write`, and `workflow_dispatch` is one of the two events a
          # `GITHUB_TOKEN` *can* raise (the recursion guard exempts it, unlike `push`). If the
          # dispatch ever stops raising runs, this step is the place to look first — it is the only
          # event in the funnel that has to travel through a token.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          failed=0
          while read -r pr; do
            [ -z "$pr" ] && continue
            if gh workflow run auto-merge-lessons.yml --repo "$REPO" -f pr="$pr"; then
              echo "dispatched auto-merge-lessons for #$pr"
            else
              echo "::warning::could not dispatch for #$pr"
              failed=$((failed + 1))
            fi
          done < /tmp/candidates.txt
          # A dispatch failure is worth a red run only if it happened for every candidate; a single
          # 403/rate-limit blip must not paint the sweep red for thirty minutes.
          total=$(wc -l < /tmp/candidates.txt | tr -d ' ')
          if [ "$failed" -ne 0 ] && [ "$failed" -eq "$total" ]; then
            echo "::error::every dispatch failed ($failed/$total)"
            exit 1
          fi
