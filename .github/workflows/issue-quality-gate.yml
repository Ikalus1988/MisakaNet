name: Issue Quality Gate

on:
  issues:
    types: [opened, edited]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const issueNum = context.issue.number;
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNum,
            });
            const body = issue.body || '';
            const title = issue.title || '';

            console.log(`=== Issue Quality Gate: #${issueNum} ===`);

            let HAS_AC = false;
            let HAS_CHECKBOX = false;

            if (/acceptance criteria|AC|验收标准|MANDATORY/i.test(body)) {
              HAS_AC = true;
              console.log('  AC section found');
            }

            if (/\[ \]|\[x\]|\[X\]/i.test(body)) {
              HAS_CHECKBOX = true;
              console.log('  Checkbox list found');
            }

            let labels = [];
            // Intakes are *reports*, not specs: requiring acceptance criteria from a
            // reporter marks every report as incomplete work and fills the tracker with
            // phantom "missing AC" (found 2026-09-13: five of six needs-ac issues were
            // intakes, including a salvage digest the workflow itself opened). The AC
            // requirement stays for tasks and bounties, where someone will implement.
            const isIntake = (issue.labels || []).some((l) =>
              // `question-digest` is opened by scripts/question_autopilot.py: a report of the open
              // question backlog, with no acceptance criteria to hold. Registering it here is the
              // agreement that keeps it out of `needs-ac` — the same fix as `salvage-digest`.
              ['intake', 'mcp-intake', 'salvage-digest', 'question-digest']
                .includes(typeof l === 'string' ? l : l.name));
            const satisfied = HAS_AC && HAS_CHECKBOX;
            if (isIntake) {
              console.log('  intake: AC not required for reports');
            } else if (!satisfied) {
              labels.push('needs-ac');
            } else {
              labels.push('ready');
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNum,
                labels: labels,
              });
              console.log(`Labels applied: ${labels.join(', ')}`);
            }

            // `ready` and `needs-ac` are mutually exclusive by definition, but this
            // gate only ever *added* labels — so an issue that gained an acceptance
            // criteria section kept `needs-ac` sitting next to `ready` forever
            // (found 2026-09-12 after writing AC into 22 intake issues: the tracker
            // kept showing them as "missing AC" work). Clear the stale one.
            const stale = satisfied ? 'needs-ac' : 'ready';
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNum,
                name: stale,
              });
              console.log(`Removed stale label: ${stale}`);
            } catch (e) {
              if (e.status !== 404) throw e;
            }
