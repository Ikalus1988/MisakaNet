name: Auto-close Low-Quality Intake Issues

on:
  issues:
    types: [opened]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    name: Cleanup low-quality issues
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intake queue cleaner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python anti_spam_bot.py
