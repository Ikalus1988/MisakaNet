name: Auto-Merge Docs PRs

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only run on PRs that are:
    # 1. From external contributors (not from Ikalus1988 or zsxh1990)
    # 2. Docs-only (no code changes)
    # 3. Labeled 'good first issue' or 'area:docs'
    # 4. Not draft
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'Ikalus1988' &&
      github.event.pull_request.user.login != 'zsxh1990' &&
      (
        contains(github.event.pull_request.labels.*.name, 'good first issue') ||
        contains(github.event.pull_request.labels.*.name, 'area:docs')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check if docs-only
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const docsOnly = files.data.every(f =>
              f.filename.endsWith('.md') ||
              f.filename.endsWith('.txt') ||
              f.filename.startsWith('docs/') ||
              f.filename === 'CONTRIBUTING.md' ||
              f.filename === 'README.md' ||
              f.filename === 'JOIN.md' ||
              f.filename === 'CHANGELOG.md'
            );

            // `lessons/` is deliberately NOT docs-only. Lesson content is read and
            // acted on by agents, so auto-merging an unreviewed lesson is a
            // poisoning vector — the same reason pr-checks.yml refuses to
            // auto-merge any PR that touches lessons/. A lesson PR must wait for a
            // human, so it must not take this path (2026-09-13: this list used to
            // include lessons/, and the Enable auto-merge step then failed on
            // every external lesson PR, adding a red check nobody could act on).

            core.setOutput('docs-only', docsOnly);
            core.info(`Docs-only: ${docsOnly} (${files.data.length} files)`);

      - name: Enable auto-merge
        if: steps.check.outputs.docs-only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"

          # Enabling auto-merge is a convenience, not a gate: if it cannot be
          # enabled (fork PR, branch protection, pending required checks) the run
          # must say so and stay green, otherwise every such PR carries a red
          # check that no contributor can act on.
          if gh pr merge "$PR_NUM" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto \
            --delete-branch; then
            echo "Auto-merge enabled for PR #$PR_NUM (docs-only)"
          else
            echo "::warning::Could not enable auto-merge for PR #$PR_NUM — a maintainer will merge it manually once the required checks pass."
          fi
