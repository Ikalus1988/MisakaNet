name: Auto-Merge Docs PRs

on:
  # `pull_request_target`, not `pull_request`, and that is the difference between a channel that works
  # for external contributors and one that does not.
  #
  # A `pull_request` run from a fork is created in the `action_required` state and **does not execute**
  # until a maintainer approves it (first-time contributors). #1801's head commit carries exactly that
  # for eight workflows, `Auto-Merge Docs PRs` among them: a suite that exists, reads
  # `action_required`, and never ran a single step. The population this gate exists for — external
  # contributors' docs PRs — is the population whose runs are held.
  #
  # Safety of `pull_request_target` here is a property of what the workflow does, so state it: it never
  # checks out the PR, never runs any file from it, and its only writes are a label-driven merge of an
  # already-reviewed PR. The `github-script` steps call the REST API with values GitHub supplies. If a
  # future edit adds `actions/checkout` of the PR head or executes anything from the diff, this trigger
  # becomes the classic vulnerability — that is the line not to cross.
  pull_request_target:
    # `labeled` is load-bearing, not decoration. Every other label this gate could key on arrives
    # *after* the PR opens: `.github/labeler.yml` adds `area:docs` a few seconds later, and the shape
    # guard adds `docs-only` on its own run. With only `opened`/`synchronize`/`ready_for_review`, a PR
    # that became eligible later was never looked at again — which is why this channel produced
    # nothing since it was written, while two legitimately docs-only external PRs (#1842, #1801) sat
    # unmerged. The maintainer's own opt-in label arrives through this event too.
    types: [opened, synchronize, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only run on PRs that are:
    # 1. From external contributors (not from Ikalus1988 or zsxh1990)
    # 2. Docs-only by the rule below (no lessons, no machine-readable surfaces)
    # 3. Carrying the maintainer's opt-in label `auto-merge-eligible`
    # 4. Not draft, and not asking for a human (`needs-human-review`) or lesson review (`lessons-only`)
    #
    # On 3: the entry condition is a *human* action on purpose. The labels this used to key on are
    # applied automatically — `.github/labeler.yml` gives `area:docs` to every `**/*.md`, so every
    # lesson PR carries it (#1746, #1750: `area:docs` + `area:lessons` + `lessons-only` +
    # `needs-human-review`) — and an automatic entry condition plus merging to `main` means external
    # text reaching the published site with nobody having read it. `auto-merge-eligible`'s own
    # description is "Docs-only PR, eligible for auto-merge when CI passes", it is applied by hand, and
    # it mirrors the lesson channel's opt-in (`auto-merge-lesson`).
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'Ikalus1988' &&
      github.event.pull_request.user.login != 'zsxh1990' &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge-eligible') &&
      !contains(github.event.pull_request.labels.*.name, 'lessons-only') &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human-review')
    runs-on: ubuntu-latest
    steps:
      - name: Check if docs-only
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // ── docs-only rule (kept in one place; see tests/test_auto_merge_docs.py) ──
            //
            // `lessons/` is deliberately NOT docs-only. Lesson content is read and acted on by
            // agents, so auto-merging an unreviewed lesson is a poisoning vector — the same reason
            // pr-checks.yml refuses to auto-merge any PR that touches lessons/.
            //
            // This used to be `f.filename.endsWith('.md') || f.filename.endsWith('.txt') || …`, which
            // made **any** `.md` anywhere docs-only, lessons included — the exact opposite of the
            // comment sitting under it. That hole was armed rather than theoretical: `.github/labeler.yml`
            // gives `area:docs` to every `**/*.md`, so external lesson PRs satisfy the job's label
            // condition (#1746, #1750, and the five around them), and any of them that pushes an update
            // (`synchronize`) or comes out of draft (`ready_for_review`) after the label lands reaches
            // the Enable auto-merge step with `docs-only: true`. The only thing that stopped them was
            // `needs-dco` — a check about commit trailers, not about review (found 2026-09-19).
            //
            // Two exclusions beyond "not a lesson", because "docs" here means *prose a human reads*:
            // `docs/.well-known/**` are discovery cards other agents fetch and parse, and
            // `docs/index.html` is the site itself (version badge, counts, claims). Both are machines'
            // input or the page's frame; neither should change without a person deciding.
            const isDocsFile = (path) =>
              !path.startsWith('lessons/') &&
              !path.startsWith('docs/.well-known/') &&
              path !== 'docs/index.html' &&
              (path.startsWith('docs/') ||
               ['CONTRIBUTING.md', 'README.md', 'JOIN.md', 'CHANGELOG.md'].includes(path));
            // ── end docs-only rule ──

            const docsOnly = files.data.length > 0 && files.data.every(f => isDocsFile(f.filename));

            core.setOutput('docs-only', docsOnly);
            core.info(`Docs-only: ${docsOnly} (${files.data.length} files)`);

      - name: Enable auto-merge
        if: steps.check.outputs.docs-only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"

          # Enabling auto-merge is a convenience, not a gate: if it cannot be
          # enabled (fork PR, branch protection, pending required checks) the run
          # must say so and stay green, otherwise every such PR carries a red
          # check that no contributor can act on.
          if gh pr merge "$PR_NUM" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto \
            --delete-branch; then
            echo "Auto-merge enabled for PR #$PR_NUM (docs-only)"
          else
            echo "::warning::Could not enable auto-merge for PR #$PR_NUM — a maintainer will merge it manually once the required checks pass."
          fi
