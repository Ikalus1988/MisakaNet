name: Auto-Merge Docs PRs

on:
  # `pull_request_target`, not `pull_request`, and that is the difference between a channel that works
  # for external contributors and one that does not.
  #
  # A `pull_request` run from a fork is created in the `action_required` state and **does not execute**
  # until a maintainer approves it (first-time contributors). #1801's head commit carries exactly that
  # for eight workflows, `Auto-Merge Docs PRs` among them: a suite that exists, reads
  # `action_required`, and never ran a single step. The population this gate exists for — external
  # contributors' docs PRs — is the population whose runs are held.
  #
  # Safety of `pull_request_target` here is a property of what the workflow does, so state it: it never
  # checks out the PR, never runs any file from it, and its only writes are a label-driven merge of an
  # already-reviewed PR. The `github-script` steps call the REST API with values GitHub supplies. If a
  # future edit adds `actions/checkout` of the PR head or executes anything from the diff, this trigger
  # becomes the classic vulnerability — that is the line not to cross.
  pull_request_target:
    # `labeled` is load-bearing, not decoration. Every other label this gate could key on arrives
    # *after* the PR opens: `.github/labeler.yml` adds `area:docs` a few seconds later, and the shape
    # guard adds `docs-only` on its own run. With only `opened`/`synchronize`/`ready_for_review`, a PR
    # that became eligible later was never looked at again — which is why this channel produced
    # nothing since it was written, while two legitimately docs-only external PRs (#1842, #1801) sat
    # unmerged. The maintainer's own opt-in label arrives through this event too.
    # `edited` and `unlabeled` are here because eligibility can change without a push:
    #   * `edited` — retargeting the base branch. On 2026-09-19 #1801 was opened against a stale
    #     feature branch; retargeting it to `main` changed which workflow file it even evaluated,
    #     and the gate would not look again until someone re-applied the label by hand.
    #   * `unlabeled` — a maintainer removing `needs-human-review` (or `lessons-only`) is a decision
    #     that the PR may proceed; without this the gate only ever sees the refusal, never its
    #     withdrawal.
    types: [opened, synchronize, ready_for_review, labeled, unlabeled, edited]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only run on PRs that are:
    # 1. From external contributors (not from Ikalus1988 or zsxh1990)
    # 2. Docs-only by the rule below (no lessons, no machine-readable surfaces)
    # 3. Carrying the maintainer's opt-in label `auto-merge-eligible`
    # 4. Not draft, and not asking for a human (`needs-human-review`) or lesson review (`lessons-only`)
    #
    # On 3: the entry condition is a *human* action on purpose. The labels this used to key on are
    # applied automatically — `.github/labeler.yml` gives `area:docs` to every `**/*.md`, so every
    # lesson PR carries it (#1746, #1750: `area:docs` + `area:lessons` + `lessons-only` +
    # `needs-human-review`) — and an automatic entry condition plus merging to `main` means external
    # text reaching the published site with nobody having read it. `auto-merge-eligible`'s own
    # description is "Docs-only PR, eligible for auto-merge when CI passes", it is applied by hand, and
    # it mirrors the lesson channel's opt-in (`auto-merge-lesson`).
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'Ikalus1988' &&
      github.event.pull_request.user.login != 'zsxh1990' &&
      contains(github.event.pull_request.labels.*.name, 'auto-merge-eligible') &&
      !contains(github.event.pull_request.labels.*.name, 'lessons-only') &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human-review')
    runs-on: ubuntu-latest
    steps:
      - name: Check if docs-only
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const pr = context.payload.pull_request;
            // **Paginated on purpose, and this is the whole rule's soundness.** `pulls.listFiles`
            // returns 30 files by default and the list is ordered by filename, where `docs/…` sorts
            // before `lessons/…`. A single `listFiles` call therefore answers "are the first 30 files
            // docs-only?", and a PR with 30 docs files plus one lesson file would have been called
            // `docs-only: true` and auto-merged — the exact poisoning vector this gate exists to
            // close (unreviewed lesson content is read and executed by agents, and the workflow runs
            // on `pull_request_target`, so a fork PR reaches it without approval). Truncation here is
            // not a display detail; it is the difference between "all files" and "some files".
            const files = { data: await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            }) };

            // ── docs-only rule (kept in one place; see tests/test_auto_merge_docs.py) ──
            //
            // `lessons/` is deliberately NOT docs-only. Lesson content is read and acted on by
            // agents, so auto-merging an unreviewed lesson is a poisoning vector — the same reason
            // pr-checks.yml refuses to auto-merge any PR that touches lessons/.
            //
            // This used to be `f.filename.endsWith('.md') || f.filename.endsWith('.txt') || …`, which
            // made **any** `.md` anywhere docs-only, lessons included — the exact opposite of the
            // comment sitting under it. That hole was armed rather than theoretical: `.github/labeler.yml`
            // gives `area:docs` to every `**/*.md`, so external lesson PRs satisfy the job's label
            // condition (#1746, #1750, and the five around them), and any of them that pushes an update
            // (`synchronize`) or comes out of draft (`ready_for_review`) after the label lands reaches
            // the Enable auto-merge step with `docs-only: true`. The only thing that stopped them was
            // `needs-dco` — a check about commit trailers, not about review (found 2026-09-19).
            //
            // Two exclusions beyond "not a lesson", because "docs" here means *prose a human reads*:
            // `docs/.well-known/**` are discovery cards other agents fetch and parse, and
            // `docs/index.html` is the site itself (version badge, counts, claims). Both are machines'
            // input or the page's frame; neither should change without a person deciding.
            const isDocsFile = (path) =>
              !path.startsWith('lessons/') &&
              !path.startsWith('docs/.well-known/') &&
              path !== 'docs/index.html' &&
              (path.startsWith('docs/') ||
               ['CONTRIBUTING.md', 'README.md', 'JOIN.md', 'CHANGELOG.md'].includes(path));
            // ── end docs-only rule ──

            const docsOnly = files.data.length > 0 && files.data.every(f => isDocsFile(f.filename));

            core.setOutput('docs-only', docsOnly);
            // Named, so the refusal comment can say *which* file broke the rule instead of only that
            // something did. Capped: a PR that breaks the rule in forty files does not need forty lines.
            core.setOutput('offenders', files.data.filter(f => !isDocsFile(f.filename))
              .map(f => f.filename).slice(0, 20).join('\n'));
            core.info(`Docs-only: ${docsOnly} (${files.data.length} files)`);

      # A judgement nobody can see did not happen. Until 2026-09-21 this workflow had **no** comment
      # step at all (the lesson channel has three), so a refusal existed only as one `core.info` line
      # inside a green run: #1801 was given the maintainer's opt-in label four times on 2026-09-19, the
      # gate ran and refused it (`Docs-only: false (3 files)`), and from the author's side nothing ever
      # happened — the PR sat there labelled and untouched for three days.
      - name: Report the refusal on the pull request
        if: steps.check.outputs.docs-only != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          OFFENDERS: ${{ steps.check.outputs.offenders }}
        with:
          script: |
            const marker = '<!-- auto-merge-docs -->';
            const offenders = (process.env.OFFENDERS || '').split('\n').filter(Boolean);
            const listed = offenders.length
              ? offenders.map(f => `- \`${f}\``).join('\n')
              : '- (the file list came back empty)';
            const body = [
              marker,
              '### ⏭️ Auto-merge skipped: this PR is not docs-only',
              '',
              'The `auto-merge-eligible` label is on, so this gate looked at the PR — and stopped here,',
              'because the docs-only rule was not satisfied. A PR qualifies only when **every** file is',
              'under `docs/` (or is one of `CONTRIBUTING.md`, `README.md`, `JOIN.md`, `CHANGELOG.md`).',
              '`lessons/**`, `docs/.well-known/**` and `docs/index.html` are never auto-merged: lesson',
              'content is executed by agents, and those two paths are filed as machine input and the',
              'site frame.',
              '',
              'Files that broke the rule:',
              '',
              listed,
              '',
              '**What to do.** Either split the non-docs files into a separate PR, or — if the PR is',
              'docs-only after all, because the list above looks wrong — remove and re-apply the',
              '`auto-merge-eligible` label. That re-label is not busywork: this gate only re-evaluates on',
              '`labeled`, `unlabeled`, `edited`, `synchronize` and `ready_for_review`, so a corrected PR',
              'that is pushed *after* the label was applied does get looked at again, while one that was',
              'already pushed does not.',
              '',
              `_Posted by [the docs auto-merge gate](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/main/.github/workflows/auto-merge-docs.yml); this comment is updated in place, not stacked._`,
            ].join('\n');

            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100,
            });
            const previous = comments.find(c => (c.body || '').includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body,
              });
              core.info(`Updated the refusal comment on #${issue_number}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body,
              });
              core.info(`Posted the refusal comment on #${issue_number}`);
            }

      # The refusal comment is upserted, so a PR that becomes docs-only later would otherwise merge
      # carrying a comment that says it was refused. The two steps are one state machine, and leaving
      # the other half out is how a comment becomes a lie that outlives the state it described.
      - name: Withdraw an earlier refusal
        if: steps.check.outputs.docs-only == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const marker = '<!-- auto-merge-docs -->';
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100,
            });
            const previous = comments.find(c => (c.body || '').includes(marker));
            if (!previous) return;
            await github.rest.issues.deleteComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id,
            });
            core.info(`Withdrew the earlier refusal comment on #${issue_number} — the PR is docs-only now`);

      - name: Enable auto-merge
        if: steps.check.outputs.docs-only == 'true'
        env:
          # `SHELDON_PAT`, not `GITHUB_TOKEN`, and this is not a preference.
          #
          # A merge performed with `GITHUB_TOKEN` produces a push that **starts no workflows**, so the
          # whole post-merge chain silently does not run for PRs merged here: measured on 2026-09-21,
          # the merge commit of #1969 (this gate, GITHUB_TOKEN) has **0** push-triggered runs, while
          # #1965 (merged with the PAT) and #1962 have 5 each — `Release Please`, `Leaderboard Watch`,
          # `Build Live Feed`, `Update Badge Counts`, `Deploy Documentation` and the rest all keyed on
          # `push`. The repository has paid for this lesson twice already (`auto-sync-prs.yml`, and
          # `lessons/contrib/ci-github-token-push-does-not-trigger-workflows.md`); this was the third
          # place.
          #
          # It does **not** need the `workflow` scope: GitHub refuses a PAT-without-`workflow` only for
          # PRs that modify `.github/workflows/`, and by the rule above this gate merges only docs
          # (see the docs-only check: nothing outside `docs/` plus four root files ever gets here).
          # Do not widen this to `workflow` "just in case" — that would let this channel merge a change
          # to CI itself.
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"

          # Enabling auto-merge is a convenience, not a gate: if it cannot be
          # enabled (fork PR, branch protection, pending required checks) the run
          # must say so and stay green, otherwise every such PR carries a red
          # check that no contributor can act on.
          if gh pr merge "$PR_NUM" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto \
            --delete-branch; then
            echo "Auto-merge enabled for PR #$PR_NUM (docs-only)"
          else
            echo "::warning::Could not enable auto-merge for PR #$PR_NUM — a maintainer will merge it manually once the required checks pass."
          fi
