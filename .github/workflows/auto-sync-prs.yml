name: Auto-Sync PR Branches
# Six-hourly + on demand, **not** on every push to main (changed 2026-10-01).
#
# It used to run on `push: branches: [main]`, which meant every main push re-headed every open PR. Three
# measured costs, all on 2026-10-01:
#
#   * each sync re-runs the whole cross-platform matrix (30+ checks) on that PR — 42 runs were queued
#     repo-wide at the point this was measured;
#   * the push resets GitHub's `mergeable` computation, so a PR that was about to merge goes back to
#     `mergeable_state: unknown` and auto-merge stalls — the release PR's head moved three times in about
#     twenty minutes, and #2584 had to be merged through the API because a sync had re-headed it seconds
#     before;
#   * the value it buys is optional: `main`'s ruleset sets
#     `strict_required_status_checks_policy: false`, so a PR does **not** need to be up to date with main
#     to merge. Syncing is about avoiding conflicts, and six hours is enough for that.
#
# The per-PR guard below (skip a PR that can already merge) is the other half: a mergeable PR must not be
# pushed to at all, whatever the schedule says.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          # No persisted credentials, because this job pushes with its own token and the two do not
          # coexist: `actions/checkout` writes `http.https://github.com/.extraheader` into the local
          # git config with `GITHUB_TOKEN`, and a later `git -c http.extraheader=…` *appends* a second
          # Authorization header rather than replacing it — the server used the checkout's, so the
          # push was authenticated by the bot while the workflow believed it was using the PAT
          # (measured 2026-09-19: the runs created by the sync carried `actor=github-actions[bot]`).
          persist-credentials: false

      - name: List open PRs targeting main
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pulls \
            --jq '[.[] | select(.base.ref == "main" and .state == "open") | {number, headRef: .head.ref, headRepo: .head.repo.full_name, mergeable: .mergeable}]' \
            > open_prs.json
          echo "count=$(jq length open_prs.json)" >> $GITHUB_OUTPUT
          echo "Found $(jq length open_prs.json) open PR(s)"

      - name: Merge main into each same-repo PR
        env:
          # A PAT, not GITHUB_TOKEN, and that is the whole point of this step.
          #
          # GitHub deliberately suppresses workflow runs for pushes made with the built-in token, so a
          # sync performed with it updates the branch and triggers **nothing**: the PR's new head has
          # zero check runs, GitHub reports "unstable / expected — waiting for status", and no workflow
          # will ever re-run on it. PR #1870 sat in exactly that state on 2026-09-19 until a human
          # pushed an empty commit to shake CI loose.
          #
          # `SHELDON_PAT` (classic with `repo`, or fine-grained with Contents: read-and-write) makes the
          # push an ordinary user push, so `pull_request: synchronize` fires and the checks run.
          # `actions: write` is NOT needed: nothing here dispatches a workflow.
          SYNC_TOKEN: ${{ secrets.SHELDON_PAT }}
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::warning::SHELDON_PAT is empty — skipping the sync. Syncing with GITHUB_TOKEN would update these branches without triggering any CI, which is worse than not syncing: it leaves every synced PR 'unstable' with nothing to re-run. Fix the secret and re-run this workflow."
            exit 0
          fi
          # The token travels in a git config header rather than in a remote URL: a token in a URL
          # shows up in error output, and secret scanners (rightly) flag the pattern.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)"
          git config user.name "misakanet-sync-bot"
          git config user.email "bot@misakanet.dev"
          : > "$RUNNER_TEMP/synced.txt"
          COUNT=$(jq length open_prs.json)
          for i in $(seq 0 $((COUNT - 1))); do
            PR=$(jq ".[$i]" open_prs.json)
            NUM=$(echo "$PR" | jq -r '.number')
            HEAD_REF=$(echo "$PR" | jq -r '.headRef')
            HEAD_REPO=$(echo "$PR" | jq -r '.headRepo')
            MERGEABLE=$(echo "$PR" | jq -r '.mergeable')

            echo "--- PR #$NUM ($HEAD_REF) ---"

            # Skip fork PRs (cannot push to fork branches)
            if [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
              echo "  SKIP: fork PR — cannot push to $HEAD_REPO"
              continue
            fi

            # A PR that can already merge does not need main merged into it, and pushing to it is
            # actively harmful: the sync re-runs the whole matrix and resets GitHub's mergeability
            # computation, which is how a green PR ends up sitting unmergeable at the finish line
            # (measured 2026-10-01: #2584 had to be merged through the API for exactly this reason).
            if [ "$MERGEABLE" = "true" ]; then
              echo "  SKIP: already mergeable — a sync would only reset its checks and its mergeability"
              continue
            fi

            # Skip conflicting PRs
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "  SKIP: has merge conflicts"
              gh pr comment "$NUM" --repo ${{ github.repository }} \
                --body "⚠️ **Auto-sync skipped** — this PR has merge conflicts with main. Please resolve them manually."
              continue
            fi

            # Attempt merge
            git fetch origin "$HEAD_REF"
            if git checkout "$HEAD_REF" 2>/dev/null; then
              # `--signoff`: the merge commit this job creates lands on someone else's branch, and
              # this repository's DCO gate requires a `Signed-off-by:` on every commit — so a sync
              # without it turns the contributor's PR red for a commit they did not write. Measured on
              # #1879 (2026-09-19): the synced head's `DCO Check` failed, on a merge commit authored by
              # this job.
              if git merge --signoff origin/main --no-edit 2>&1; then
                # `--force-with-lease`-free by design: this is a merge commit on top of the branch,
                # so a fast-forward. With no persisted credentials in the checkout, this header is the
                # only Authorization the push carries.
                git -c http.extraheader="$AUTH_HEADER" push origin "HEAD:$HEAD_REF"
                echo "$NUM:$(git rev-parse HEAD)" >> "$RUNNER_TEMP/synced.txt"
                echo "  ✅ Merged main into #$NUM"
              else
                git merge --abort 2>/dev/null
                echo "  ❌ Merge failed for #$NUM (may have conflicts now)"
                gh pr comment "$NUM" --repo ${{ github.repository }} \
                  --body "⚠️ **Auto-sync failed** — main could not be automatically merged into this branch. Please rebase manually."
              fi
            else
              echo "  ❌ Could not checkout $HEAD_REF"
            fi

            # Return to main for next iteration
            git checkout main 2>/dev/null
          done

      # Read it back: "the push succeeded" is not the claim. The claim is "the PR's checks run again",
      # and that is exactly what silently stopped happening.
      #
      # The first version of this check asked "are there any check runs on the new head?" and passed on
      # a head whose fourteen Actions runs were **all held as `action_required`** — because Cloudflare
      # Workers Builds publishes a check run for the site without using workflow events. One green check
      # from an app is not CI. So this counts the two things the claim is actually about: runs that came
      # from `github-actions`, and runs that are waiting for approval instead of running.
      - name: Verify the synced heads actually have CI
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for entry in $(cat "$RUNNER_TEMP/synced.txt" 2>/dev/null || true); do
            NUM="${entry%%:*}"; SHA="${entry##*:}"
            for attempt in 1 2 3 4 5 6; do
              # `--paginate` (2026-10-04): one page of 100 check-runs is not all of them, and on a
              # commit like `80540341` (187 of them) 87 names are past page 1 — an undercount here
              # reads as "CI is not running" and the sync proceeds onto a PR whose checks have not
              # finished. The same command with `--paginate` is already used in
              # `auto-merge-lessons.yml`, so this follows an existing convention.
              #
              # `--jq` runs *per page* under `--paginate`, so the old `[...] | length` would print one
              # count per page and concatenate them ("10050") instead of totalling them. Emitting the
              # matching names one per line and counting the lines sums correctly.
              ACTIONS=$( { gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --paginate \
                --jq '.check_runs[] | select(.app.slug == "github-actions") | .name' 2>/dev/null || true; } \
                | wc -l | tr -d ' ')
              HELD=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&status=action_required" \
                --jq '.total_count' 2>/dev/null || echo 0)
              if [ "$ACTIONS" -gt 0 ]; then
                echo "PR #$NUM: $ACTIONS GitHub Actions check run(s) on ${SHA:0:7} — CI is running"
                [ "$HELD" -gt 0 ] && echo "::warning::PR #$NUM also has $HELD run(s) held as action_required — some workflows did not start (approve them: gh api repos/$REPO/actions/runs/<id>/approve -X POST)"
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                ACTOR=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0].triggering_actor.login' 2>/dev/null || echo unknown)
                echo "::warning::PR #$NUM has no GitHub Actions check runs on the synced head ${SHA:0:7} ($HELD run(s) held as action_required; triggered by '$ACTOR'). If that actor is a bot, the push was authenticated by GITHUB_TOKEN rather than the PAT — check that the checkout does not persist credentials. An app check run (Cloudflare/Codecov) does not count."
              fi
              sleep 10
            done
          done

  # ── Arm the lesson auto-merge channel (the flow half of the #2760 fix) ────────────────────
  #
  # `docs/maintainer/auto-merge-lessons.md` documents an **opt-in** channel: a lesson PR carrying
  # `auto-merge-lesson` is evaluated by `scripts/lesson_pr_mergeable.py` and squash-merged once
  # every mechanical condition holds. Nothing applied the label, so lesson PRs piled up at
  # `auto-merge-lessons = skipping` and a human merged each one by hand.
  #
  # The label cannot be applied when the PR is opened: that channel fires on `labeled`,
  # `synchronize` and `ready_for_review` — deliberately not `opened` — and its `check_suite`
  # fallback was removed on 2026-10-02 as a fan-out. Its own documentation states the consequence
  # (docs/maintainer/auto-merge-lessons.md §1): a PR armed *before* its checks finish waits
  # forever, because nothing re-triggers the channel when they later go green. So arming has to
  # happen after the conditions hold, and the only event left that can carry "now they hold" is a
  # clock — this sweep. `scripts/arm_auto_merge_lesson_prs.py` asks the channel's own judge
  # (imported, not copied) whether the PR would merge the moment it carried the label, and applies
  # the label only when the answer is yes.
  #
  # Why a second **job** rather than one more step in `sync`:
  #
  #   * **trust** — the sync job checks out contributor branches (`git checkout "$HEAD_REF"`).
  #     Running a repository script in that working tree would execute whatever copy of it the PR
  #     carries, with `pull-requests: write` in hand. This job gets a fresh `actions/checkout` of
  #     the default branch, so the script that decides is the one on `main` (`auto-merge-lessons.yml`
  #     states the same rule for the same reason).
  #   * **ordering** — arming first and then re-heading the branch would race the channel: the
  #     `labeled` event can be evaluated against a head the sync is about to replace.
  #
  # Scope, and why this is not a policy change for contributors: only PRs whose head branch lives
  # in **this** repository are considered. A branch in this repository cannot be created without
  # write access, so the set is exactly the authors who could have pushed or merged directly; an
  # external contributor's fork PR stays opt-in by hand. `wip`, `do-not-merge`, drafts, a review
  # requesting changes, and any file outside `lessons/` are refused by the shared judge.
  arm-lesson-auto-merge:
    needs: sync
    # `always()` because arming is independent of the branch sync: a sync that could not run must
    # not also leave the channel unarmed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout the trusted decision scripts (default branch, never a PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Arm every lesson PR whose mechanical conditions already hold
        env:
          # A **PAT**, never GITHUB_TOKEN. GitHub suppresses workflow runs for events caused by
          # the built-in token, so a `GITHUB_TOKEN`-applied label starts no `pull_request: labeled`
          # run and the label does nothing at all — the same trap that cost this repository three
          # times on the push path (`scripts/ci/land_change.py` documents it). A label that looks
          # applied and wakes nothing is worse than no label: it is indistinguishable from "the
          # channel looked and decided not to merge".
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::SHELDON_PAT is empty — skipping the arming sweep. Arming with GITHUB_TOKEN would add a label that triggers no workflow run, i.e. a label that does nothing; fix the secret and re-run this workflow."
            exit 0
          fi
          # One run, `--apply`, which prints the decision for every candidate *and* then acts —
          # including the "nothing to arm" line, because a sweep that only speaks when it writes
          # is the shape whose silent runs look healthy.
          python3 scripts/arm_auto_merge_lesson_prs.py --repo "$REPO" --apply
