name: Auto-Sync PR Branches
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: List open PRs targeting main
        id: prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pulls \
            --jq '[.[] | select(.base.ref == "main" and .state == "open") | {number, headRef: .head.ref, headRepo: .head.repo.full_name, mergeable: .mergeable}]' \
            > open_prs.json
          echo "count=$(jq length open_prs.json)" >> $GITHUB_OUTPUT
          echo "Found $(jq length open_prs.json) open PR(s)"

      - name: Merge main into each same-repo PR
        env:
          # A PAT, not GITHUB_TOKEN, and that is the whole point of this step.
          #
          # GitHub deliberately suppresses workflow runs for pushes made with the built-in token, so a
          # sync performed with it updates the branch and triggers **nothing**: the PR's new head has
          # zero check runs, GitHub reports "unstable / expected — waiting for status", and no workflow
          # will ever re-run on it. PR #1870 sat in exactly that state on 2026-09-19 until a human
          # pushed an empty commit to shake CI loose.
          #
          # `SHELDON_PAT` (classic with `repo`, or fine-grained with Contents: read-and-write) makes the
          # push an ordinary user push, so `pull_request: synchronize` fires and the checks run.
          # `actions: write` is NOT needed: nothing here dispatches a workflow.
          SYNC_TOKEN: ${{ secrets.SHELDON_PAT }}
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::warning::SHELDON_PAT is empty — skipping the sync. Syncing with GITHUB_TOKEN would update these branches without triggering any CI, which is worse than not syncing: it leaves every synced PR 'unstable' with nothing to re-run. Fix the secret and re-run this workflow."
            exit 0
          fi
          # The token travels in a git config header rather than in a remote URL: a token in a URL
          # shows up in error output, and secret scanners (rightly) flag the pattern.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)"
          git config user.name "misakanet-sync-bot"
          git config user.email "bot@misakanet.dev"
          : > "$RUNNER_TEMP/synced.txt"
          COUNT=$(jq length open_prs.json)
          for i in $(seq 0 $((COUNT - 1))); do
            PR=$(jq ".[$i]" open_prs.json)
            NUM=$(echo "$PR" | jq -r '.number')
            HEAD_REF=$(echo "$PR" | jq -r '.headRef')
            HEAD_REPO=$(echo "$PR" | jq -r '.headRepo')
            MERGEABLE=$(echo "$PR" | jq -r '.mergeable')

            echo "--- PR #$NUM ($HEAD_REF) ---"

            # Skip fork PRs (cannot push to fork branches)
            if [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
              echo "  SKIP: fork PR — cannot push to $HEAD_REPO"
              continue
            fi

            # Skip conflicting PRs
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "  SKIP: has merge conflicts"
              gh pr comment "$NUM" --repo ${{ github.repository }} \
                --body "⚠️ **Auto-sync skipped** — this PR has merge conflicts with main. Please resolve them manually."
              continue
            fi

            # Attempt merge
            git fetch origin "$HEAD_REF"
            if git checkout "$HEAD_REF" 2>/dev/null; then
              if git merge origin/main --no-edit 2>&1; then
                git -c http.extraheader="$AUTH_HEADER" push origin "HEAD:$HEAD_REF"
                echo "$NUM:$(git rev-parse HEAD)" >> "$RUNNER_TEMP/synced.txt"
                echo "  ✅ Merged main into #$NUM"
              else
                git merge --abort 2>/dev/null
                echo "  ❌ Merge failed for #$NUM (may have conflicts now)"
                gh pr comment "$NUM" --repo ${{ github.repository }} \
                  --body "⚠️ **Auto-sync failed** — main could not be automatically merged into this branch. Please rebase manually."
              fi
            else
              echo "  ❌ Could not checkout $HEAD_REF"
            fi

            # Return to main for next iteration
            git checkout main 2>/dev/null
          done

      # Read it back: "the push succeeded" is not the claim. The claim is "the PR's checks run again",
      # and that is exactly what silently stopped happening.
      #
      # The first version of this check asked "are there any check runs on the new head?" and passed on
      # a head whose fourteen Actions runs were **all held as `action_required`** — because Cloudflare
      # Workers Builds publishes a check run for the site without using workflow events. One green check
      # from an app is not CI. So this counts the two things the claim is actually about: runs that came
      # from `github-actions`, and runs that are waiting for approval instead of running.
      - name: Verify the synced heads actually have CI
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for entry in $(cat "$RUNNER_TEMP/synced.txt" 2>/dev/null || true); do
            NUM="${entry%%:*}"; SHA="${entry##*:}"
            for attempt in 1 2 3 4 5 6; do
              ACTIONS=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
                --jq '[.check_runs[] | select(.app.slug == "github-actions")] | length' 2>/dev/null || echo 0)
              HELD=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&status=action_required" \
                --jq '.total_count' 2>/dev/null || echo 0)
              if [ "$ACTIONS" -gt 0 ]; then
                echo "PR #$NUM: $ACTIONS GitHub Actions check run(s) on ${SHA:0:7} — CI is running"
                [ "$HELD" -gt 0 ] && echo "::warning::PR #$NUM also has $HELD run(s) held as action_required — some workflows did not start (approve them: gh api repos/$REPO/actions/runs/<id>/approve -X POST)"
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "::warning::PR #$NUM has no GitHub Actions check runs on the synced head ${SHA:0:7} ($HELD run(s) held as action_required). The push did not produce working CI: either the token cannot trigger workflows (a GITHUB_TOKEN-equivalent never can) or its owner's pushes are held for approval. An app check run (Cloudflare/Codecov) does not count."
              fi
              sleep 10
            done
          done
