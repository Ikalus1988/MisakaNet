name: Guarded Repository

# HOL Guard "Guarded Repository" scan — the provenance workflow that HOL's registry
# verifier recognises as a *continuous scanner CI*. Without it, the HOL plugin listing
# reports "Continuous scanner CI not detected" and reduces its trust score by 10%.
#
# It does more than satisfy a dashboard:
#   * runs the open-source HOL Guard scanner (prompt-injection, risky-tool, secret-access
#     and publishability findings) over lessons/ + scripts/ + workers/, uploading SARIF to
#     GitHub code scanning, and
#   * asks GitHub to sign a provenance attestation for the scan evidence, so the scan is
#     verifiable rather than self-asserted.
#
# Evidence sent to the HOL verifier is coarse metadata only (repo, commit SHA, run id,
# scanner version/profile, score/grade, max severity, finding count, SARIF digest) — no
# source, prompts, paths or credentials.
#
# Policy notes:
#   * profile: default (not strict-security) until we have seen a first scan result.
#   * fail_on_severity: critical — a critical finding should fail the run.
#   * Triggered on main pushes, weekly, and manually — NOT on every PR, so contributor
#     PRs are not gated on a third-party scanner.
#
# The reusable workflow is HOL-owned and version-pinned; the verifier validates
# job_workflow_ref/job_workflow_sha before counting the scan as continuous.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write

jobs:
  guarded-repository:
    uses: hashgraph-online/hol-guard/.github/workflows/guarded-repository.yml@05fa4760df8401b9710bf098adb4fbb2dc4ff389  # v3.0.189
    with:
      profile: default
      fail_on_severity: critical
      upload_sarif: true
      visibility: public

  # Reconcile every listed automation against the artifact it exists to produce
  # (`scripts/automation_output_audit.py`). Three automations ran for months while producing
  # nothing — PR-Genius posted no comment on any PR, the intake-bot demo ran 21k times for a
  # handful of outputs, and `arch-review.yml` never ran at all — because no check ever looked at
  # the ratio of runs to output.
  #
  # Weekly, not per-push: this is a nudge, and a nudge that fires on every commit is noise. It
  # fails the run when an automation runs ≥20 times in the window and produces nothing, or when a
  # scheduled workflow older than 45 days has never run once (45 > the longest schedule here, so a
  # new monthly cron is not called dead before its first slot arrives).
  automation-output-audit:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Reconcile automations against their output
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/automation_output_audit.py --window-days 30
