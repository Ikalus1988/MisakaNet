name: 知识引用追踪

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing usage issue number to trace citations"
        required: true
        type: string

jobs:
  cite-lesson:
    # Run for issues with 'usage' label, or manual trigger via workflow_dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'usage'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    env:
      ISSUE_NUMBER: ${{ github.event.inputs.issue_number || github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Parse usage report and cite lessons
        id: cite
        uses: ./.github/actions/retry/
        env:
          ISSUE_JSON: ${{ toJson(github.event.issue) }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          run: |
            python3 << 'PYEOF'
            import json
            import re
            import os
            import sys
            import subprocess
            from datetime import datetime

            issue_num = os.environ.get('ISSUE_NUMBER', '').strip()
            issue = json.loads(os.environ.get('ISSUE_JSON', '{}') or '{}')

            # Fallback to gh CLI if ISSUE_JSON lacks details (e.g. on workflow_dispatch)
            if not issue or not issue.get('body'):
                if issue_num:
                    try:
                        res = subprocess.run(
                            ['gh', 'issue', 'view', str(issue_num), '--repo', os.environ.get('GITHUB_REPOSITORY', ''), '--json', 'title,body,author,number,url'],
                            capture_output=True, text=True, check=True
                        )
                        raw_data = json.loads(res.stdout)
                        issue = {
                            'number': raw_data.get('number', issue_num),
                            'title': raw_data.get('title', ''),
                            'body': raw_data.get('body', ''),
                            'html_url': raw_data.get('url', ''),
                            'user': {'login': raw_data.get('author', {}).get('login', '?')}
                        }
                    except Exception as e:
                        print(f"Error fetching issue #{issue_num} via gh: {e}")
                        sys.exit(1)

            body = issue.get('body', '')
            node = issue.get('title', '?').replace('usage:', '').strip()
            user = issue.get('user', {}).get('login', '?')
            issue_url = issue.get('html_url', '')
            issue_num = issue.get('number', issue_num or 0)
            date = datetime.utcnow().strftime('%Y-%m-%d')

            # Parse used section
            used_section = ''
            in_used = False
            for line in body.split('\n'):
                if 'used' in line.lower() or '本次使用' in line:
                    in_used = True
                    continue
                if in_used:
                    if line.strip().startswith('- '):
                        used_section += line + '\n'
                    elif line.strip() == '':
                        break

            # Extract lesson IDs
            lesson_ids = re.findall(r'([a-z0-9-]+)', used_section)
            if not lesson_ids:
                print("No lesson IDs found")
                sys.exit(0)

            # Load lessons
            lessons = []
            try:
                with open('data/lessons.json') as f:
                    lessons = json.load(f)
            except:
                print("Could not load lessons.json")
                sys.exit(0)

            # Find cited lessons
            cited = []
            for lesson in lessons:
                lid = lesson.get('id', '')
                if any(oid in lid for oid in lesson_ids):
                    cited.append(lesson)

            if not cited:
                print("No matching lessons found")
                sys.exit(0)

            # Create citation comment
            lines = [f"📚 **引用追踪 — {node}**", '', f"**贡献者:** @{user}", f"**日期:** {date}", '', '## 引用的知识', '']
            for c in cited:
                lines.append(f"- **{c.get('id', '?')}**: {c.get('title', '?')}")
                lines.append(f"  Domain: {c.get('domain', '?')} | Tags: {', '.join(c.get('tags', []))}")

            lines.extend(['', '---', '> 自动引用追踪 by cite-lesson'])
            print('\n'.join(lines))
            PYEOF
          max_attempts: 3
          backoff: exponential
          backoff_base_seconds: 5

      - name: Commit citation update
        id: commit
        uses: ./.github/actions/retry/
        with:
          run: |
            git config user.name "misakanet-bot"
            git config user.email "bot@misakanet.dev"
            git add -A
            git diff --cached --quiet || git commit -m "cite: update references for issue #${{ github.event.inputs.issue_number || github.event.issue.number }}"
            git push
          max_attempts: 3
          backoff: exponential
          backoff_base_seconds: 5
          retry_on_exit_code: "1"
