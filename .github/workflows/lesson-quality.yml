name: Lesson Quality Score

# Runs on PRs that touch lessons/ directory
on:
  pull_request:
    paths:
      - 'lessons/**'
      - 'scripts/quality_scorer.py'
      - 'scripts/lesson_lint.py'

permissions:
  pull-requests: write
  contents: read

jobs:
  lint-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Run lesson lint
        id: lint
        run: |
          # `2>&1` is gone on purpose. This file is JSON and the counts below parse it, so folding
          # stderr into it corrupts the parse — and the old `|| echo "0"` on every count then
          # turned that corruption into "High: 0": a lint that had crashed reported a clean corpus
          # (#2940). The same shape as a credential scanner reporting "no secrets found" about a
          # file it never opened (#2971).
          #
          # `|| lint_status=$?` instead of letting the shell abort, so the counts and the summary
          # are still published when there is something to report. The failure is raised below.
          lint_status=0
          python scripts/lesson_lint.py --lessons-dir lessons --fail-on high --json > lint-output.json || lint_status=$?

          # Deliberately unguarded: an unreadable count file is not a count of zero. This raises,
          # and under `bash -e` that fails the step — which is the entire point of this change.
          python - lint-output.json >> "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import pathlib
          import sys

          issues = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          counts = {
              name: sum(1 for issue in issues if issue.get("severity") == name)
              for name in ("high", "medium", "low")
          }
          for name, value in counts.items():
              print(f"{name}={value}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Lesson Lint Report\n")
              summary.write(" | ".join(f"{k.capitalize()}: {v}" for k, v in counts.items()) + "\n\n")
              summary.write("Run locally: `python scripts/lesson_lint.py --lessons-dir lessons -v`\n")
          PY

          # The exit this job had never taken. `--fail-on high` was already being passed, and its
          # answer was discarded twice: by `|| true` here and by the job-level `continue-on-error`
          # that sat above these steps. `grep -n 'exit 1'` over the whole workflow returned nothing.
          #
          # Measured before making it blocking: `lesson_lint.py --fail-on high --json` over the
          # shipped corpus reports zero issues and exits 0, and exits 1 with JSON on stdout when
          # pointed at a lesson with no frontmatter. The threshold this now enforces is the one
          # the workflow already asked for.
          exit "$lint_status"

  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install misakanet-core

      - name: Get changed lesson files
        id: changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            lessons/**/*.md

      - name: Run quality scorer
        if: steps.changed.outputs.any_changed == 'true'
        id: quality
        env:
          # Data, not script text. `${{ }}` is substituted before bash parses, and bash
          # runs `$(…)` inside double quotes *and* inside an unquoted `for` word — a file
          # named `lessons/core/$(id).md` executes `id` on the runner. Same defect class
          # as `lesson-gate.yml`, found by `tests/test_workflow_script_injection.py`.
          ALL_CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          SCORES=""
          PASS=true
          THRESHOLD=0.5

          # Split without pathname expansion: a lesson path is never a glob, and letting
          # one expand against the filesystem would read files the PR never mentioned.
          IFS=$'\n' read -r -d '' -a CHANGED_FILES <<< "$ALL_CHANGED_FILES" || true
          for file in "${CHANGED_FILES[@]}"; do
            if [[ "$file" == lessons/*.md ]]; then
              SCORE=$(python3 scripts/quality_scorer.py "$file" --json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('total_score') if d.get('total_score') is not None else (d.get('lessons') or [{}])[0].get('total_score') or (d.get('lessons') or [{}])[0].get('score',0)/100)" 2>/dev/null || echo "0")
              SCORES="$SCORES\n$file: $SCORE"
              if (( $(echo "$SCORE < $THRESHOLD" | bc -l) )); then
                PASS=false
              fi
            fi
          done

          echo "scores=$SCORES" >> $GITHUB_OUTPUT
          echo "pass=$PASS" >> $GITHUB_OUTPUT
          {
            echo "### Lesson quality"
            echo "pass=$PASS threshold=$THRESHOLD"
            echo '```'
            echo -e "$SCORES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        # Fork PRs often get HttpError: Resource not accessible by integration
        # when commenting. Scores still ran; don't fail the check for that.
        if: steps.changed.outputs.any_changed == 'true'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const scores = `${{ steps.quality.outputs.scores }}`;
            const pass = `${{ steps.quality.outputs.pass }}` === 'true';

            const marker = '<!-- misakanet-lesson-quality -->';

            // Find existing comment
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const existing = comments.find(c => c.body.includes(marker));

            const status = pass ? '✅ PASS' : '⚠️ BELOW THRESHOLD';
            const body = `${marker}
            ## Lesson Quality Report

            ${status} (threshold: 0.5)

            ${scores || 'No lessons changed.'}

            _Reported by lesson-quality workflow_
            `;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
