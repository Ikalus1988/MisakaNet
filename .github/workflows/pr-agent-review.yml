name: PR-Agent Code Review

on:
  pull_request:
    # No `synchronize` (removed 2026-11-03, #2972). PR-Agent does not review a synchronize event:
    # it logs `Skipping action: synchronize` and exits 0, so the check reported **success** for a
    # push it never looked at. Measured on one unchanged fork PR (zsxh1990/MisakaNet, 2026-11-03):
    #
    #   02:20 opened       -> failure  (the fork gets no OPENAI_KEY, so the model call 401s)
    #   02:23 synchronize  -> success  (skipped before the model call — no review either way)
    #   02:35 synchronize  -> success
    #
    # Same code, three colours, and none of them meant "reviewed". Re-request a review after a push
    # with a `/review` comment: that path runs on the base repository, which is also the only way a
    # fork PR can be reviewed at all.
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-agent:
    # The slash commands below cost a paid model call, and the job carries `pull-requests: write`
    # plus `issues: write`. Unbound, that is an unbounded spend and a six-hour runner hold on a
    # comment any account can post — the same exposure `fix-dco.yml` closes. The association gate
    # goes on the `issue_comment` branch only: on `pull_request` there is no comment author, and
    # the event already carries its own author (see `pr-welcome.yml`).
    #
    # The fork guard is the other half of the same honesty problem (#2972): a `pull_request` run
    # from a fork receives no secrets, so the model call fails with "OPENAI_KEY not set" and the
    # check goes red for a reason that has nothing to do with the code. Skipping is the truthful
    # colour — and the `/review` path above still works for fork PRs, because it runs here with the
    # secret available to a maintainer's comment.
    if: |
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft &&
       !contains(github.event.pull_request.labels.*.name, 'docs-only') &&
       !startsWith(github.head_ref, 'bot/') &&
       !startsWith(github.event.pull_request.title, 'chore(main): release')) ||
      (github.event_name == 'issue_comment' &&
       (contains(github.event.comment.body, '/review') ||
        contains(github.event.comment.body, '/describe') ||
        contains(github.event.comment.body, '/improve') ||
        contains(github.event.comment.body, '/ask')) &&
       contains(fromJSON('["MEMBER", "OWNER", "COLLABORATOR"]'),
                github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: PR-Agent Review
        uses: Codium-ai/pr-agent@efdde4afe14aa401a3889012c7f3e9ef3081a430  # v0.49.0
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          OPENAI_API_BASE: "https://api.minimax.chat/v1"
          OPENAI_MODEL: "openai/minimax-M3"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
