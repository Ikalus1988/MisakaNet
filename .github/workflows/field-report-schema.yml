name: Field Report Schema Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/field-reports/**'
  push:
    branches: [main]
    paths:
      - 'docs/field-reports/**'
  workflow_dispatch:

# NOTE: This workflow gates on diff-only for PRs and pushes to avoid
# surfacing stale/legacy violations from unrelated authors in every PR.
# Full-coverage scans run on schedule (see below) and file issues instead.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run field report check
        run: |
          BASE="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || '' }}"
          if [ -n "$BASE" ]; then
            python scripts/check_field_reports.py --base "$BASE"
          else
            python scripts/check_field_reports.py
          fi
