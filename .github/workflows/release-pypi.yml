name: Release to PyPI

on:
  push:
    tags:
      # Release tags only — `v<major>.<minor>.<patch>`, not "anything starting with v". The intake
      # bot's action tag is `v1` (GitHub Marketplace publishes an action from a tag, see action.yml),
      # and under the previous `v*` filter that tag fired this workflow: a wasted build plus an
      # approval request on the `pypi` environment that could only end in "file already exists".
      #
      # This trigger is inert for release-please's own tags anyway — it pushes with GITHUB_TOKEN and
      # a GITHUB_TOKEN push never triggers a workflow, which is why release-please.yml dispatches
      # this workflow explicitly, exactly once. The tag filter stays as the manual escape hatch.
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.28.0). Builds from current main."
        required: false
        type: string

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Generate and Update CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG="${{ github.ref_name }}"
          # workflow_dispatch carries the version as input; tag pushes use the tag name
          VERSION_INPUT="${{ github.event.inputs.version || '' }}"
          if [ -n "$VERSION_INPUT" ]; then
            CURRENT_TAG="v$VERSION_INPUT"
          fi
          # `--match` keeps "the previous release" meaning the previous *release*: the nearest
          # reachable tag can be the action's `v1` (see the tag filter above), and `sed 's/v//'`
          # would then hand gen_changelog a range that is not a version at all.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "${CURRENT_TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            SINCE=$(echo "$PREV_TAG" | sed 's/v//')
            python3 scripts/gen_changelog.py --since "$SINCE" --version "$CURRENT_TAG" --output CHANGELOG.md
          else
            python3 scripts/gen_changelog.py --version "$CURRENT_TAG" --output CHANGELOG.md
          fi

  build:
    runs-on: ubuntu-latest
    needs: changelog
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
