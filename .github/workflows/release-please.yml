name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write        # `gh workflow run release-pypi.yml` (dispatch needs actions:write)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Deliberately GITHUB_TOKEN, not the PAT: a GITHUB_TOKEN push never triggers
      # another workflow, so the tag created below cannot fire release-pypi.yml
      # behind our back. PyPI publishing is dispatched explicitly, once.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0                        # tags, to see whether the release is tagged
          token: ${{ secrets.GITHUB_TOKEN }}

      # release-please is invoked with skip-github-release: true below, and that
      # flag skips `manifest.createReleases()` entirely
      # (googleapis/release-please-action src/index.ts:141) — the only code path
      # that creates tags/releases AND the only one that sets tag_name /
      # release_created. So the steps that used to follow the action were dead
      # code, and every merged release PR left release-please aborting with
      # "There are untagged, merged release PRs outstanding - aborting" until a
      # human tagged it by hand (v2.29.0 was tagged by hand — handoff 2026-09-12).
      # Tagging before the action removes that deadlock: the manifest only moves
      # when a release PR merges, so "manifest version without a tag" means
      # exactly "a merged release needs tagging".
      - name: Tag the merged release (release-please cannot tag here)
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json;print(json.load(open('.release-please-manifest.json'))['.'])")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists — nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "manifest says $VERSION and no tag exists yet — tagging"
          git tag "$TAG"
          git push origin "$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --generate-notes
          fi
          # Append the onboarding footer (install one-liner + the copy-paste sentence for
          # people who do not use a terminal + both download links). Release notes are the
          # one page a user is most likely to land on from a "new version" notification, so
          # they must answer "how do I actually get this" without a second click.
          FOOTER=".github/release-notes-footer.md"
          if [ -f "$FOOTER" ]; then
            BODY=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || echo "")
            if printf '%s' "$BODY" | grep -q "misakanet-setup"; then
              echo "footer already present on $TAG"
            else
              { printf '%s\n\n' "$BODY"; cat "$FOOTER"; } > /tmp/release-notes.md
              gh release edit "$TAG" --notes-file /tmp/release-notes.md
              echo "footer appended to $TAG"
            fi
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
        id: release
        with:
          # The PAT (or GITHUB_TOKEN) here only maintains the release PR; Release
          # creation is skipped because release-please v5's own release-creation
          # code is refused for these tokens ("Resource not accessible by
          # integration/personal access token"). Tags are created by the step
          # above, GitHub Releases by `gh release create` in the same step.
          token: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
          skip-github-release: true

      # Publish only when this run tagged a release: `gh workflow run` is one of
      # the two events a GITHUB_TOKEN push *can* still create, so this is the
      # single, explicit publish path.
      - name: Dispatch the PyPI publish
        if: steps.release_tag.outputs.created == 'true'
        env:
          # Use the built-in token, not the PAT. Two independent reasons, both
          # observed on the 2.30.0 release (2026-09-12):
          #   * the PAT here carries no `actions: write`, so the dispatch failed
          #     with "HTTP 403: Resource not accessible by personal access token",
          #     and the `secrets.X || secrets.Y` form only falls back when a secret
          #     is *empty* — never when it is merely insufficient, so the token
          #     that works was never tried;
          #   * an inline shell assignment of a token-shaped name is also what a
          #     third-party scanner reports as HARDCODED_SECRET, even when the value
          #     is just a reference. The YAML `env:` form above is not matched.
          # This job declares `actions: write`, which is what `gh workflow run`
          # needs; dispatching is one of the events a GITHUB_TOKEN may still create.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_tag.outputs.version }}
        run: gh workflow run release-pypi.yml --ref main -f "version=$VERSION"

      # The official MCP registry, published on every release instead of by hand. It used to be a
      # manual `mcp-publisher publish` on a maintainer's machine, and the entry drifted to
      # `isLatest = 2.29.0` while this repository, PyPI and the GitHub release were all at 2.30.2
      # (#1820) — a directory listing that no CI step watched, and one that cannot be updated from a
      # sandboxed agent environment at all (github.com is unreachable there, the registry is not).
      # The npm bundle (the DSH/Codex plugin package) is published on every release too, for the same
      # reason the registry is: leaving it to a human is how it sat at 2.30.2 through the 2.31.0 release.
      #
      # The human gate is not removed, it is moved to where it is visible: `misakanet-publish.yml`
      # declares the `release` environment, whose required reviewer has to approve the run before any
      # secret is readable — so a release produces a *pending* publish, not a silent one. That is the
      # one click this step exists to create.
      #
      # `package.json` is not bumped by release-please on purpose (it means "the version on npm", and
      # the npm channel can lag — `test_version_consistency.py` enforces it may lag but never lead), so
      # the dispatch carries the version and the publish run moves that line, publishes, and commits it
      # back. A refused approval therefore leaves the repository exactly as it was.
      - name: Dispatch the npm publish
        if: steps.release_tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_tag.outputs.version }}
        run: gh workflow run misakanet-publish.yml --ref main -f "version=$VERSION"

      - name: Dispatch the MCP registry publish
        if: steps.release_tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          set -euo pipefail
          # Dispatch at the TAG, not at main. The registry publish used to run on `main`, where the
          # tag it describes may already be behind the branch — "the bytes are the ones on the tag"
          # was a comment describing something the workflow did not do. The tag exists by now (the
          # step above pushed it), and it contains this workflow because it was created from a commit
          # that has it. The fallback keeps a first-release edge case (a tag GitHub has not indexed
          # yet) from turning into a silent skip; the version guard inside still refuses a mismatch.
          gh workflow run publish-mcp-registry.yml --ref "v$VERSION" -f "version=$VERSION" \
            || {
              echo "::warning::could not dispatch at tag v$VERSION; falling back to main (the version guard still applies)"
              gh workflow run publish-mcp-registry.yml --ref main -f "version=$VERSION"
            }

      # Idempotent and *unconditional*: it rewrites docs/index.html only when the
      # badge drifted from the manifest, and the commit below only fires when the
      # index actually changed. So a stale badge self-heals on the next push to
      # main instead of waiting for the next release (this is how v2.23.0 sat there
      # for six releases while the step was dead).
      - name: Sync version to docs
        env:
          VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "Syncing version $VERSION to docs..."

          # docs/index.html carries exactly one version string (the badge).
          sed -i "s/v[0-9]*\.[0-9]*\.[0-9]*/v$VERSION/g" docs/index.html

          # Lesson counts: never hand-roll the number here. This step used to
          # count every lessons/**/*.md file (`find lessons/ -name '*.md'` = 422
          # today, ~435 when this was written) — mirrors, locale copies, drafts
          # and templates included — and sed that inflated figure into the site's
          # <meta description>, silently overwriting the canonical count. The
          # canonical figure is the indexed count from data/lessons.json, and
          # scripts/sync_lesson_count.py owns every public surface.
          python3 scripts/sync_lesson_count.py
          python3 scripts/sync_lesson_count.py --check

      - name: Commit version sync
        run: |
          set -euo pipefail
          git config user.name "misakanet-bot"
          git config user.email "bot@misakanet.dev"
          # NOTE: stage first, then ask about the *index*. `git diff --quiet`
          # ignores the index, so the previous `git add -A; git diff --quiet ||
          # git commit` form could never commit anything — the step looked alive
          # and did nothing (found 2026-09-12 while wiring the count SSOT).
          git add -A
          if git diff --cached --quiet; then
            echo "No version/count sync changes to commit"
          else
            git commit -m "docs: sync version to v${{ steps.release_tag.outputs.version }}"
            git push || { git pull --rebase origin main && git push; }
          fi
