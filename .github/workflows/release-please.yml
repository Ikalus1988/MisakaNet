name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write        # `gh workflow run release-pypi.yml` (dispatch needs actions:write)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Deliberately GITHUB_TOKEN, not the PAT: a GITHUB_TOKEN push never triggers
      # another workflow, so the tag created below cannot fire release-pypi.yml
      # behind our back. PyPI publishing is dispatched explicitly, once.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0                        # tags, to see whether the release is tagged
          token: ${{ secrets.GITHUB_TOKEN }}
          # No persisted credentials, because every push below supplies its own: `actions/checkout`
          # writes GITHUB_TOKEN into `http.https://github.com/.extraheader` *and* into a credentials file
          # reached through `includeIf`, and a push that also carries a PAT then has two identities to
          # choose from. Measured 2026-09-25 on the 2.35.0 release PR: the changelog repair's push — PAT in
          # its URL, checkout credentials still present — was attributed to `github-actions[bot]`, so all
          # 13 runs on the repaired head came back `action_required` (held, never executed), the required
          # `DCO / Signed-off-by` among them. Unsetting the header alone was not enough. This is the same
          # setting, for the same reason, as `auto-sync-prs.yml`.
          persist-credentials: false

      # release-please is invoked with skip-github-release: true below, and that
      # flag skips `manifest.createReleases()` entirely
      # (googleapis/release-please-action src/index.ts:141) — the only code path
      # that creates tags/releases AND the only one that sets tag_name /
      # release_created. So the steps that used to follow the action were dead
      # code, and every merged release PR left release-please aborting with
      # "There are untagged, merged release PRs outstanding - aborting" until a
      # human tagged it by hand (v2.29.0 was tagged by hand — handoff 2026-09-12).
      # Tagging before the action removes that deadlock: the manifest only moves
      # when a release PR merges, so "manifest version without a tag" means
      # exactly "a merged release needs tagging".
      - name: Tag the merged release (release-please cannot tag here)
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
          # Tags are pushed as the *built-in* token, supplied here as a header because the checkout no
          # longer persists one. Deliberate, and the reason is in the comment above the checkout: a
          # GITHUB_TOKEN push never triggers another workflow, so tagging here cannot fire
          # release-pypi.yml behind our back — publishing stays a single explicit dispatch below.
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)"
          VERSION=$(python3 -c "import json;print(json.load(open('.release-please-manifest.json'))['.'])")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists — nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "manifest says $VERSION and no tag exists yet — tagging"
          git tag "$TAG"
          git -c http.extraheader="$AUTH_HEADER" push origin "$TAG"
          # The Marketplace action is *this repository*, so its `v1` alias has to follow the releases:
          # `uses: Ikalus1988/MisakaNet@v1` should get the newest one, while `@$TAG` (e.g. `@v2.34.0`)
          # pins an exact version for anyone who needs that. Decided 2026-09-23 — the tag has to show
          # that the version changed. `v1` moves rather than a `v2` appearing because the action's
          # input/output contract has not changed, and a new major would break every existing `uses:`
          # line for nothing. Tag pushes are not covered by the branch ruleset (it targets
          # `refs/heads/main`), so this is allowed where a push to `main` is not.
          git tag -f v1
          git -c http.extraheader="$AUTH_HEADER" push -f origin v1
          echo "moved v1 to $TAG ($(git rev-parse --short HEAD))"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" --generate-notes
          fi
          # Append the onboarding footer (install one-liner + the copy-paste sentence for
          # people who do not use a terminal + both download links). Release notes are the
          # one page a user is most likely to land on from a "new version" notification, so
          # they must answer "how do I actually get this" without a second click.
          FOOTER=".github/release-notes-footer.md"
          if [ -f "$FOOTER" ]; then
            BODY=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || echo "")
            if printf '%s' "$BODY" | grep -q "misakanet-setup"; then
              echo "footer already present on $TAG"
            else
              { printf '%s\n\n' "$BODY"; cat "$FOOTER"; } > /tmp/release-notes.md
              gh release edit "$TAG" --notes-file /tmp/release-notes.md
              echo "footer appended to $TAG"
            fi
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"

      # release-please's own release-creation code is skipped in this workflow (see the note on the
      # action below: v5 refuses it for these tokens), and that code is also what moves the release PR
      # from `autorelease: pending` to `autorelease: tagged`. Tagging the commit — the step above — is
      # only half of the bookkeeping, and the half that was missing: release-please decides whether a
      # merged release PR is "outstanding" by its **label**, not by the tag, so every run since the
      # 2.31.0 release aborted with
      #
      #   ⚠ There are untagged, merged release PRs outstanding - aborting
      #
      # and no new release PR was being proposed. The next release was blocked until a human relabelled
      # #1862 by hand — exactly how the 2.30.0 deadlock (#1631) was cleared before it, i.e. the same
      # manual step was needed two releases in a row.
      #
      # Unconditional on purpose, for two reasons: on the release run itself `created` is true and the
      # label must move; and on a run where the tag already exists but the label is still pending (the
      # state this repository was in on 2026-09-20) nothing else would ever repair it. Idempotent: no
      # pending label, nothing happens.
      - name: Mark the merged release PR as tagged
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
                 --label "autorelease: pending" --limit 5 \
                 --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "no merged release PR is waiting to be marked tagged"
            exit 0
          fi
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" \
            --remove-label "autorelease: pending" --add-label "autorelease: tagged"
          echo "release PR #$PR marked autorelease: tagged"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5
        id: release
        with:
          # The PAT (or GITHUB_TOKEN) here only maintains the release PR; Release
          # creation is skipped because release-please v5's own release-creation
          # code is refused for these tokens ("Resource not accessible by
          # integration/personal access token"). Tags are created by the step
          # above, GitHub Releases by `gh release create` in the same step.
          token: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
          skip-github-release: true

      # Publish only when this run tagged a release: `gh workflow run` is one of
      # the two events a GITHUB_TOKEN push *can* still create, so this is the
      # single, explicit publish path.
      # The release-please action leaves the workspace on the release PR's branch (it rewrites that branch
      # in place). Every step after this one assumes `main`: `Sync version to docs` rewrites
      # `docs/index.html`, and the lander stages with `git add -A` and pushes **HEAD** — which is how the
      # 2026-09-25 PR #2210 came to be titled "docs: sync version to v2.34.0" while carrying the entire
      # 2.35.0 bump (release commit + changelog repair + docs change, all on `bot/release-version-sync`).
      # `land_change.py` refuses to land from a moved checkout as well, so this is the fix and that is the
      # net under it.
      - name: Return the checkout to main
        run: git checkout --force main

      # `release-please` regenerates the release PR's changelog from the commit range on **every** push to
      # `main`, so a repair made by hand is undone by the next push. The repair therefore belongs here, in
      # the same run, right after the action that regenerates it.
      #
      # Measured 2026-09-25 on the open 2.35.0 release PR: 137 bullet lines, 104 distinct entries, **33 of
      # them listed twice** — because a PR that reached `main` through a merge commit whose message also
      # carried the PR title looks conventional twice (the branch commit and the merge commit it merged).
      # `tests/test_changelog_shape.py` refuses to release in that state and is right to: the notes are the
      # one page a user reads to decide whether to upgrade, and a change listed twice reads as two changes.
      # The *cause* is fixed (every merge path squashes — pinned by `test_every_merge_path_squashes`), but
      # the damage from the merges that already happened stays in the range until the release carrying it is
      # tagged, so this step has to keep running.
      - name: Drop the duplicate entries in the pending release section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # reads only
          # A PAT, not GITHUB_TOKEN, for the push: a bot push creates *held* runs on the release PR
          # (`action_required`), and `DCO / Signed-off-by` is a required check — the release PR would then
          # be unmergeable for a reason nobody can see. Same lesson as `fix-dco.yml` (#2204).
          PUSH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          set -euo pipefail

          BRANCH=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
                     --json headRefName \
                     --jq '[.[] | select(.headRefName | startswith("release-please--")) | .headRefName][0] // empty')
          if [ -z "$BRANCH" ]; then
            echo "no open release PR — nothing to repair"
            exit 0
          fi

          # The tool comes from `main` (this checkout), the file from the release branch: the branch is only
          # ever `main` plus the release commit, but it can lag `main` by minutes, and a repair tool that
          # exists only on the branch it is repairing would fail on the first run.
          cp scripts/dedupe_release_entries.py "$RUNNER_TEMP/dedupe_release_entries.py"
          git fetch --quiet origin "$BRANCH"
          # A *worktree*, not `git checkout`: the shared workspace must stay on `main` for the steps below
          # (see "Return the checkout to main"). Repairing in place left it on the release branch, and the
          # lander then built `bot/release-version-sync` from that HEAD — three commits, and a pull request
          # whose title described one of them (measured 2026-09-25, PR #2210).
          WORKTREE="$RUNNER_TEMP/release-repair"
          git worktree add --force --detach "$WORKTREE" "origin/$BRANCH" >/dev/null

          # The path is explicit, and that is not cosmetic: this runs a *copy* of the script from outside
          # the checkout, so its `__file__`-relative default (`<repo>/CHANGELOG.md`) resolves to
          # `/home/runner/work/CHANGELOG.md` and the first run of this step died on
          # `FileNotFoundError: '/home/runner/work/CHANGELOG.md'` (measured 2026-09-25, run 36105826072).
          if python3 "$RUNNER_TEMP/dedupe_release_entries.py" --check "$WORKTREE/CHANGELOG.md"; then
            {
              echo "### Release changelog"
              echo
              echo "No duplicate entries in the newest release section — nothing to repair."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 "$RUNNER_TEMP/dedupe_release_entries.py" "$WORKTREE/CHANGELOG.md" | tee -a "$GITHUB_STEP_SUMMARY"
          git -C "$WORKTREE" config user.name "misakanet-bot"
          git -C "$WORKTREE" config user.email "bot@misakanet.dev"
          git -C "$WORKTREE" add CHANGELOG.md
          if git -C "$WORKTREE" diff --cached --quiet; then
            echo "the script reported duplicates but the file did not change — not pushing"
            exit 0
          fi
          git -C "$WORKTREE" commit -s -m "chore(changelog): drop the duplicate entries in the pending release section"
          # The checkout persisted `GITHUB_TOKEN` into `http.https://github.com/.extraheader`. A push then
          # carries **both** Authorization headers and the server uses the checkout's, so this push — which
          # is meant to be the PAT, i.e. an ordinary user push — was attributed to `github-actions[bot]`:
          # measured 2026-09-25 on the 2.35.0 release PR, all 22 runs on the repaired head came back
          # `action_required` (held, never executed), including the required `DCO / Signed-off-by`. The
          # duplicates were fixed and the PR became unmergeable for a new reason, which is what this line
          # prevents. `auto-sync-prs.yml` documents the same trap for its own PAT push.
          # Belt and braces with `persist-credentials: false` on the checkout: if that setting is ever
          # flipped back, the checkout's header would be *appended* to this one and the server would use
          # the checkout's — which is how the push above was attributed to the bot.
          git config --unset-all "http.https://github.com/.extraheader" || true
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -C "$WORKTREE" -c http.extraheader="$AUTH_HEADER" push origin "HEAD:refs/heads/$BRANCH"
          git worktree remove --force "$WORKTREE"
          echo "repaired $BRANCH; its checks will run on the new head" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch the PyPI publish
        if: steps.release_tag.outputs.created == 'true'
        env:
          # Use the built-in token, not the PAT. Two independent reasons, both
          # observed on the 2.30.0 release (2026-09-12):
          #   * the PAT here carries no `actions: write`, so the dispatch failed
          #     with "HTTP 403: Resource not accessible by personal access token",
          #     and the `secrets.X || secrets.Y` form only falls back when a secret
          #     is *empty* — never when it is merely insufficient, so the token
          #     that works was never tried;
          #   * an inline shell assignment of a token-shaped name is also what a
          #     third-party scanner reports as HARDCODED_SECRET, even when the value
          #     is just a reference. The YAML `env:` form above is not matched.
          # This job declares `actions: write`, which is what `gh workflow run`
          # needs; dispatching is one of the events a GITHUB_TOKEN may still create.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_tag.outputs.version }}
        run: gh workflow run release-pypi.yml --ref main -f "version=$VERSION"

      # The official MCP registry, published on every release instead of by hand. It used to be a
      # manual `mcp-publisher publish` on a maintainer's machine, and the entry drifted to
      # `isLatest = 2.29.0` while this repository, PyPI and the GitHub release were all at 2.30.2
      # (#1820) — a directory listing that no CI step watched, and one that cannot be updated from a
      # sandboxed agent environment at all (github.com is unreachable there, the registry is not).
      # The npm bundle (the DSH/Codex plugin package) is published on every release too, for the same
      # reason the registry is: leaving it to a human is how it sat at 2.30.2 through the 2.31.0 release.
      #
      # The human gate is not removed, it is moved to where it is visible: `misakanet-publish.yml`
      # declares the `release` environment, whose required reviewer has to approve the run before any
      # secret is readable — so a release produces a *pending* publish, not a silent one. That is the
      # one click this step exists to create.
      #
      # `package.json` is not bumped by release-please on purpose (it means "the version on npm", and
      # the npm channel can lag — `test_version_consistency.py` enforces it may lag but never lead), so
      # the dispatch carries the version and the publish run moves that line, publishes, and commits it
      # back. A refused approval therefore leaves the repository exactly as it was.
      - name: Dispatch the npm publish
        if: steps.release_tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_tag.outputs.version }}
        run: gh workflow run misakanet-publish.yml --ref main -f "version=$VERSION"

      - name: Dispatch the MCP registry publish
        if: steps.release_tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          set -euo pipefail
          # Dispatch at the TAG, not at main. The registry publish used to run on `main`, where the
          # tag it describes may already be behind the branch — "the bytes are the ones on the tag"
          # was a comment describing something the workflow did not do. The tag exists by now (the
          # step above pushed it), and it contains this workflow because it was created from a commit
          # that has it. The fallback keeps a first-release edge case (a tag GitHub has not indexed
          # yet) from turning into a silent skip; the version guard inside still refuses a mismatch.
          gh workflow run publish-mcp-registry.yml --ref "v$VERSION" -f "version=$VERSION" \
            || {
              echo "::warning::could not dispatch at tag v$VERSION; falling back to main (the version guard still applies)"
              gh workflow run publish-mcp-registry.yml --ref main -f "version=$VERSION"
            }

      # Idempotent and *unconditional*: it rewrites docs/index.html only when the
      # badge drifted from the manifest, and the commit below only fires when the
      # index actually changed. So a stale badge self-heals on the next push to
      # main instead of waiting for the next release (this is how v2.23.0 sat there
      # for six releases while the step was dead).
      - name: Sync version to docs
        env:
          VERSION: ${{ steps.release_tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "Syncing version $VERSION to docs..."

          # docs/index.html carries exactly one version string (the badge).
          sed -i "s/v[0-9]*\.[0-9]*\.[0-9]*/v$VERSION/g" docs/index.html

          # Lesson counts: never hand-roll the number here. This step used to
          # count every lessons/**/*.md file (`find lessons/ -name '*.md'` = 422
          # today, ~435 when this was written) — mirrors, locale copies, drafts
          # and templates included — and sed that inflated figure into the site's
          # <meta description>, silently overwriting the canonical count. The
          # canonical figure is the indexed count from data/lessons.json, and
          # scripts/sync_lesson_count.py owns every public surface.
          python3 scripts/sync_lesson_count.py
          python3 scripts/sync_lesson_count.py --check

      - name: Land the version sync through a pull request that merges itself
        # Was `git push` — refused by the ruleset on `main`. This one is worth its own note because
        # of *when* it runs: a release has just been cut, and the failure used to leave
        # `docs/index.html` advertising the previous version while the release page advertised the
        # new one (v2.23.0 sat there for six releases the last time this step was dead). A pull
        # request that merges itself keeps the badge honest without a human watching the tail of a
        # release run.
        #
        # The staging order the old step needed is now the lander's: it stages first and asks about
        # the *index* (`git diff --cached`), because `git diff --quiet` ignores the index — the
        # form that once made this step look alive while committing nothing (2026-09-12).
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          python3 scripts/ci/land_change.py \
            --branch bot/release-version-sync \
            --title "docs: sync version to v${{ steps.release_tag.outputs.version }}" \
            --note "The site version badge and every managed lesson count, synced after cutting v${{ steps.release_tag.outputs.version }}."
