name: Deploy Freshness

# Is production running the commit that `main` says it should? Once a day, without a deploy.
#
# #2779. On 2026-10-03 the API worker turned out to be three days and five merged PRs behind,
# and nothing was red for any of it: `deploy-worker.yml` needs manual approval on the `release`
# environment, and `concurrency.cancel-in-progress: true` cancels the run that was waiting for
# it every time a newer push arrives. Every check that would have caught it ran *after* a
# successful deploy — post-deploy verification can only tell you a deploy landed wrong, never
# that one never happened. That gap is why a human noticed, via a symptom (the home page's
# 7-day activity chart had stopped updating) rather than a signal.
#
# The check itself is `scripts/doctor.py --deploy-freshness`, which compares the commit SHA the
# worker reports in `/api/health` against this checkout's HEAD. A version number cannot do this:
# release-please only bumps it on a release, so `fix:`/`feat:` commits leave production and main
# reporting the same version indefinitely — the state that made the freeze invisible.
#
# Two triggers, because one was measured not to be enough. The cron below is the backstop, not the
# instrument: this repository already recorded that GitHub drops scheduled events under load
# ("measured 2026-09-29: this workflow ran once in ~9 hours against `17,47`, five consecutive slots
# with no run created at all", `approval-watch.yml`'s header). That is why `approval-watch.yml` also
# listens on `workflow_run`. This file originally did not, and the consequence was measurable: as of
# 2026-10-04T06:00Z it had produced exactly **one** run ever — a manual `workflow_dispatch` from a
# PR branch — and its first daily slot (04:53Z) had passed with nothing. So the safety net for the
# very freeze it was written for had never once run on its own, and the guard below
# (`tests/test_deploy_freshness.py::test_the_freshness_probe_does_not_depend_on_the_scheduler_alone`)
# could not see that, because asserting a cron *string* is not asserting a cron *firing*.
#
# The `workflow_run` trigger is the one that actually closes the gap, and it closes it in minutes
# rather than a day. `types: [completed]` fires on every outcome of a deploy run, and the freeze is
# precisely the outcomes that deploy nothing: a run cancelled by `cancel-in-progress` when the next
# push arrives is a `completed` event, so the probe runs and finds production behind *while the
# staleness is minutes old*, instead of a human noticing three days later through a symptom.
on:
  schedule:
    # Daily at 04:53 UTC — off the hour, and clear of the corpus sync (~03:00), the weekly D1
    # backup (Mon 04:10) and the Monday gate audits (06:17 / 06:43), so a slow probe never
    # queues behind them.
    - cron: '53 4 * * *'
  workflow_run:
    # The name GitHub matches on, which is `name:` in `deploy-worker.yml` — not the filename.
    # `tests/test_deploy_freshness.py` resolves it against that file rather than trusting the
    # string here, because a typo in this list is a silent no-op: `workflow_run` simply never
    # fires, which is the same failure this trigger exists to remove.
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  # The verdict has to leave this run, and a red run is not a place anyone reads. See the
  # reporting step at the bottom for the measurement that made this a permission.
  issues: write

concurrency:
  group: deploy-freshness
  cancel-in-progress: false

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # `github.token`, not `SHELDON_PAT`. The PAT exists here for steps that must *trigger further
      # workflow runs*, which commenting on an issue is not, and it has silently dropped issue
      # writes twice (`update-lessons.yml`, 313 receipts over three green days, #1528; `d1-cost.yml`,
      # two consecutive days of `addComment` denial, #5850). The job already grants `issues: write`.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Pinned to the default branch, spelled out rather than left to the event.
          #
          # This job's whole question is "is production running **main's** commit", so `main` is the
          # only correct checkout on all three triggers. Two of the three already got that right by
          # accident — `schedule` and `workflow_run` both default to the default branch — and the
          # third does not: `workflow_dispatch` can be fired from any ref, so a manual dispatch from
          # a PR branch compared production against that PR's commit and reported a staleness that
          # was not a staleness. Naming the ref is also what lets code scanning see that the code
          # running here is not the code of the run that triggered it (alerts #325 / #326).
          #
          # `|| 'main'` because a `schedule` event's payload does not always carry
          # `repository.default_branch`, and a freshness probe that no-ops on its own backstop
          # trigger is the exact failure this workflow exists to prevent.
          ref: ${{ github.event.repository.default_branch || 'main' }}
          # Full history on purpose. The check reports "N commits behind", and `git rev-list
          # <live>..<head>` cannot count commits the clone does not have — the default depth-1
          # checkout would turn every answer into "behind by an unknown number".
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          # Stdlib only, matching the suite's floor rather than the script's.
          python-version: "3.11"

      - name: A deploy succeeded, so there is nothing to re-measure
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: |
          echo "Deploy run ${{ github.event.workflow_run.head_sha }} succeeded; its own"
          echo "post-deploy probe already read the deployed SHA back, so freshness was"
          echo "verified by the workflow that performed the deploy. Deliberately not re-measured"
          echo "against main here — see the note on the next step for why that would mislead."

      # Three attempts, then a verdict. One request is a measurement; three in a row is a claim
      # about the service. A TLS handshake to misakanet.org drops often enough on a real
      # connection that one dropped handshake is weather, not an outage — and a probe that
      # reddens on weather is a probe people mute.
      #
      # Skipped when a deploy run *succeeded*, and that skip is deliberate. `deploy-worker.yml`
      # already runs `--post-deploy --deploy-freshness` after its own deploy, against its own SHA,
      # so a success has already been verified by the thing that performed it. Re-measuring here
      # would compare production against whatever `main` has become by now, and a push landing in
      # the seconds between "deploy succeeded" and "this job checks out" would report production
      # behind by a commit it is not behind by in any meaningful sense — a red for a reason that is
      # not a defect, which is the fastest way to teach people to ignore this workflow. Every
      # outcome that deploys *nothing* (cancelled, failed) still runs the probe, and those are the
      # ones #2779 is about.
      - name: Is production running main's commit?
        id: freshness
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'success'
        run: |
          set -euo pipefail

          ATTEMPTS=3
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if python3 scripts/doctor.py --deploy-freshness; then
              echo "verdict=fresh" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::the freshness probe failed (attempt $attempt/$ATTEMPTS)"
            [ "$attempt" = "$ATTEMPTS" ] || sleep 10
          done

          echo "verdict=stale" >> "$GITHUB_OUTPUT"
          echo "::error title=Production is stale::https://misakanet.org is not running main's commit. Every deploy-time check passed because they all run after a successful deploy — a deploy that never happens is invisible to all of them. Check deploy-worker.yml: the run is most likely sitting in the release environment awaiting approval, with earlier runs cancelled by concurrency.cancel-in-progress. See #2779."
          exit 1

      # Why this step exists at all (#5627). The probe below was written in October and has been
      # firing since: on 2026-11-25T09:22 it caught production 7 commits behind, minutes after the
      # deploy that would have updated it was cancelled. On 2026-11-26T14:32 it caught the same
      # drift again. **Both runs were red and both went unread** — a red scheduled run is exactly as
      # quiet as a green one, because nobody opens the Actions tab to check whether something they
      # have not been told about happened.
      #
      # So the verdict gets a reader: one issue, reopened while the condition holds and closed after,
      # the same shape `d1-cost.yml` uses. The measurement is unchanged; only who hears about it is.
      #
      # It deliberately does **not** speak when the probe did not run. The `success` shortcut above
      # is a skip, not a measurement, and closing an issue because nothing was measured is the exact
      # defect `check_deploy_freshness` refuses to commit ("claiming to be fresh when nothing was
      # measured").
      # Runs on every outcome **including `skipped`**, which is the case that broke it.
      #
      # When `workflow_run` fires after a *successful* deploy, the probe above is deliberately skipped
      # (the deploy verified its own SHA). `steps.freshness.outcome` is then `skipped`, and the first
      # version of this condition — `success || failure` — excluded exactly that. The consequence was
      # measured 2026-11-28: #5917 was opened at 02:03 by a stale probe, two later runs at 02:23 and
      # 03:16 both reported `success` **by skipping**, and the issue stayed open. An issue that only
      # closes when a *separate* probe happens to run is an issue that hangs on until the next cron.
      #
      # The verdict is empty on a skip, and the `elif` below only closes an issue when the answer is
      # positively `fresh` — so a skipped run still closes nothing on its own. That is why the step
      # must also *measure* when it has no verdict: see the guard after the `elif`.
      - name: Say so where somebody is already looking
        if: always() && !cancelled()
        env:
          VERDICT: ${{ steps.freshness.outputs.verdict }}
        run: |
          set -euo pipefail
          TITLE="[deploy-freshness] production is not running main's commit"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 50 \
                     --search '"[deploy-freshness]" in:title' --json number,state \
                     --jq '[.[] | select(.state == "OPEN")] | .[0].number // empty')

          if [ "${VERDICT:-}" = "stale" ]; then
            RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            BODY=$(printf '%s\n' \
              "Production is not running main's commit, and every gate is green for it." \
              "" \
              "Run: $RUN_URL" \
              "" \
              "The usual cause is a deploy that never happened: deploy-worker.yml waits on the" \
              "release environment, and concurrency.cancel-in-progress cancels the waiting" \
              "run whenever a newer push arrives. A red scheduled run and a green one are equally" \
              "quiet, which is why this issue exists." \
              "" \
              "Check with scripts/doctor.py --deploy-freshness and approve the pending" \
              "run if there is one. This issue closes itself on the next green probe.")
            if [ -n "$EXISTING" ]; then
              gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
              gh issue reopen "$EXISTING" --repo "$GITHUB_REPOSITORY" || true
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            fi
          elif [ -z "${VERDICT:-}" ] && [ -n "$EXISTING" ]; then
            # No verdict means the probe was skipped (a successful deploy verified its own SHA), and
            # there is an open issue to settle. Measure here rather than leaving it to the next cron:
            # an issue that hangs until a separate probe happens to run is the same "nobody is told"
            # failure this workflow exists to remove, one layer down.
            #
            # One attempt, not three: this follows work that already succeeded, and the probe's own
            # retry budget exists to tell weather from an outage. A dropped handshake here leaves the
            # issue open for the next run, which is the safe side.
            if python3 scripts/doctor.py --deploy-freshness; then
              VERDICT=fresh
            else
              echo "the skipped probe left production unverified; leaving any open issue as it is."
            fi
          fi

          if [ "${VERDICT:-}" = "fresh" ] && [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" \
              --body "Production is running main's commit again - closing."
            gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
