name: Intake Bot Benchmark

on:
  push:
    # Any branch, but never a tag: `paths` alone does not filter tag pushes (#1934).
    branches: ['**']
    paths:
      - 'scripts/intake_bot.py'
      - 'scripts/intake_benchmark.py'
      - 'scripts/gen_intake_benchmark.py'
      - 'tests/benchmarks/**'
      - 'tests/test_intake_bot_50.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
      - name: Run intake-bot decision benchmark (offline)
        run: |
          pip install -q pytest
          python3 scripts/intake_benchmark.py --check
          python3 -m pytest tests/test_intake_bot_50.py -q
