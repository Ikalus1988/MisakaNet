name: Sync Question Answers

# PRD ⑤ §9: close the answer-delivery loop — copies answered/pending question
# intakes from GitHub issues into the D1 `questions` table (durable state that
# the worker's re-submission pull and search FAQ merge read from).
# Script: scripts/sync_answered_questions.py

on:
  schedule:
    - cron: '20 7 * * *'  # Daily 07:20 UTC
  issues:
    types: [labeled, closed]
  workflow_dispatch:
    inputs:
      issue:
        description: "Specific issue number to sync"
        required: false
        type: string

concurrency:
  group: sync-question-answers-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read
  # `issues: write` is required and was missing until 2026-11-02. The backfill step below calls
  # `gh issue edit --add-label answered`, and with only `contents: read` every one of those calls
  # returned 403 — the step exited 1, and because the sync is the *next* step it never ran at all.
  # Measured on run 41315405837: "9 closed question issue(s) carry an answer but no `answered` label /
  # labelled 0/9; failed: [3574, 3923, 3924, 3925, 3926, 4050, 4090, 4091, 4092]". So the daily cron
  # had been red since the backfill landed (2026-10-28) and answered questions were not reaching D1 —
  # a producer that had stopped producing while its run history said only "red, unclear".
  issues: write

jobs:
  sync:
    # Credential: the `automation` environment holds `CF_API_TOKEN` — a Cloudflare token scoped to
    # D1:Edit only (`misakanet-automation-d1`, expires 2027-03-01), not the deployment token. The
    # distinction is the point: this job also fires from `issues` events and the daily cron, so the
    # credential it carries can touch the `questions` table and nothing else.
    #
    # `automation` has no required reviewers on purpose. An approval gate here would be worse than
    # useless: an `issues`-triggered run that waits for a person is an answer that never reaches D1.
    # It is branch-restricted to `main` instead, so only the reviewed default branch can reach the
    # credential.
    # See docs/maintainer/credentials-and-environments.md.
    environment: automation
    # Trigger on:
    # 1. Scheduled daily cron
    # 2. Manual workflow_dispatch
    # 3. 'labeled' event when label is 'answered'
    # 4. 'closed' event when issue has 'answered' label
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'answered') ||
      (github.event_name == 'issues' && github.event.action == 'closed' && contains(github.event.issue.labels.*.name, 'answered'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 6b92325b505f2b76aec49e9fe4195d31
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"

      # The label is the only entry point to the sync below, and nothing adds it when a question is
      # closed with an answer in its thread. Measured 2026-10-28: 42 of 79 closed question issues had
      # an answer and no label, i.e. were permanently unsearchable, and no mechanism would ever have
      # noticed. Running the backfill first means the backlog cannot re-form; it uses the sync's own
      # `extract_answer`, so the two cannot disagree about what an answer is.
      - name: Backfill `answered` on closed questions that already have an answer
        if: github.event_name != 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/backfill_answered_labels.py --apply

      - name: Sync single question answer to D1
        if: github.event_name == 'issues' || (github.event_name == 'workflow_dispatch' && inputs.issue != '')
        run: |
          ISSUE_NUM="${{ github.event.issue.number || inputs.issue }}"
          python3 scripts/sync_answered_questions.py --issue "$ISSUE_NUM"

      - name: Sync all question answers to D1 (batch/cron)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.issue == '' || inputs.issue == null))
        run: python3 scripts/sync_answered_questions.py
