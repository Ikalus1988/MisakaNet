name: PR Shape Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  audit-shape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Area labels (by file path)
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7
        with:
          repo-token: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

      # ── the tested half of this guard ────────────────────────────────────────────────────────────
      #
      # The JS block below reports shapes it can see in the file list. Three defects from #2066 and the
      # 2026-09-26/27 triage need more than a file list (a base/head `pyproject.toml` comparison, the
      # body of the *claimed* issue), and they are the ones that cost the most review time: three
      # template-only bounty PRs, a root `ai_solution.py` answering a different issue than the one it
      # claimed, `solutions/issue_2283_solution.ts`, and a `pyproject.toml` rewrite that dropped
      # `[build-system]` and `[project]`. They live in `scripts/pr_shape_guard.py` as pure functions so
      # they can be tested (`tests/test_pr_shape_guard.py`) instead of argued about.
      #
      # Checkout is the **base** (the default for `pull_request_target`): the PR's code is never
      # executed, only its file *names* and texts are passed in as data.
      - name: Check out the trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Shape predicates (pure, tested)
        id: predicates
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > /tmp/changed-files.txt || : > /tmp/changed-files.txt
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.title + "\n" + (.body // "")' \
            > /tmp/pr-text.txt || : > /tmp/pr-text.txt
          # The base's file is on HEAD (this checkout is the base); the PR's must come from the PR ref.
          # Fetching a ref and reading one blob is *data*: `pull_request_target` never executes the PR's
          # code, which is why the comparison is safe here and why the script itself takes texts.
          git show "${BASE_SHA}:pyproject.toml" > /tmp/base-pyproject.toml 2>/dev/null || true
          git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}" >/dev/null 2>&1 || true
          git show "refs/remotes/origin/pr-${PR_NUMBER}:pyproject.toml" > /tmp/head-pyproject.toml 2>/dev/null || true
          # Bodies of the issues this PR claims, so "a question bounty with no lesson" is decidable.
          python3 - <<'PYEOF' > /tmp/issue-bodies.json
          import json, os, re, subprocess
          text = open('/tmp/pr-text.txt', encoding='utf-8', errors='replace').read() if os.path.exists('/tmp/pr-text.txt') else ''
          numbers = sorted({int(n) for n in re.findall(r'#(\d{1,6})', text)})[:20]
          out = {}
          for n in numbers:
              try:
                  # `if .pull_request then ""` — `/issues/N` answers for pull requests too, and a released
                  # PR body listing numbers would otherwise be read as "this issue is a bounty".
                  body = subprocess.run(['gh', 'api', f"repos/{os.environ['REPOSITORY']}/issues/{n}", '--jq', 'if .pull_request then "" else (.body // "") end'],
                                        capture_output=True, text=True, timeout=30).stdout
              except Exception:
                  body = ''
              if body:
                  out[str(n)] = body
          print(json.dumps(out))
          PYEOF
          python3 scripts/pr_shape_guard.py --changed-files /tmp/changed-files.txt \
            --pr-body /tmp/pr-text.txt --base-pyproject /tmp/base-pyproject.toml \
            --head-pyproject /tmp/head-pyproject.toml --issue-bodies /tmp/issue-bodies.json \
            > findings.json || echo '[]' > findings.json

      - name: Shape guard + auto-label
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          github-token: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- misakanet-pr-shape-guard -->';
            const pr = context.payload.pull_request;

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }
            );

            const names = files.map(f => f.filename);
            const failures = [];

            // The predicates step (`scripts/pr_shape_guard.py`) writes its findings as JSON; merge them
            // in so one comment and one check report everything. A missing or unreadable file must never
            // be a failure of its own — the guard reports shapes, it does not police itself.
            try {
              const extra = JSON.parse(require('fs').readFileSync('findings.json', 'utf8'));
              if (Array.isArray(extra)) failures.push(...extra);
            } catch (e) {
              core.info(`shape predicates produced no findings file: ${e.message}`);
            }

            // ═══════════════════════════════════════════
            // SHAPE CHECKS (failures block merge)
            // ═══════════════════════════════════════════

            for (const f of files) {
              const name = f.filename;

              // Rule 1: generated temp/patch filenames
              if (name.includes(' ---') || name.endsWith('---')) {
                failures.push(`**文件名污染**: \`${name}\` 看起来是生成器残留文件名。`);
              }

              // Rule 2: destructive README rewrite
              if (name === 'README.md' && f.deletions > 120) {
                failures.push(`**破坏性 README 修改**: README.md 删除了 ${f.deletions} 行，疑似替换全文而非小改。`);
              }

              // Rule 3: source file contains pasted markdown/diff
              // Skip test files — they legitimately contain markdown test data
              const isTestFile = /^tests?\//.test(name) || /test[_]?/.test(name.split('/').pop());
              if (/\.(py|js|ts|go)$/.test(name) && f.patch && !isTestFile) {
                const added = f.patch
                  .split('\n')
                  .filter(line => line.startsWith('+') && !line.startsWith('+++'))
                  .map(line => line.slice(1));

                if (added.some(line =>
                  line.startsWith('```') ||
                  line.startsWith('diff --git') ||
                  line.startsWith('@@ ') ||
                  line.includes('# Change this line:')
                )) {
                  failures.push(`**Diff/Markdown 泄露**: \`${name}\` 中疑似粘贴了 patch 或 markdown 代码块。`);
                }
              }

              // Rule 4: large deletion in core search file
              if (name === 'search_knowledge.py' && f.deletions > 100) {
                failures.push(`**核心文件高风险删除**: \`search_knowledge.py\` 删除了 ${f.deletions} 行，需要人工 review。`);
              }

              // Rule 5: generated cache / build artifacts
              const cachePatterns = [/__pycache__\//, /\.pyc$/, /\.pytest_cache\//, /\.egg-info\//];
              if (cachePatterns.some(p => p.test(name))) {
                failures.push(`**缓存/构建产物泄露**: \`${name}\` 是自动生成的缓存文件，提交前请清理。`);
              }
            }

            // Rule 6: docs-only title but code changed
            //
            // The claim is made in the **title** — what the rule has always said it checks, and what
            // a reviewer reads first. Matching `title + body` made it fire on prose: PR #1807 (a CI
            // fix whose description explains that PR-Genius skips *non-draft, non-docs-only* PRs)
            // was failed with 范围越权 for merely *mentioning* the phrase while changing
            // scripts/pr_genius_report.py. A guard that fails honest PRs for describing CI
            // behaviour is a guard people learn to ignore.
            const title = pr.title.toLowerCase();
            const claimsDocsOnly = title.includes('docs:') || title.includes('docs-only') || title.includes('[docs]');
            const codeChanged = files.some(f => /\.(py|js|ts|go)$/.test(f.filename));
            if (claimsDocsOnly && codeChanged) {
              failures.push('**范围越权**: PR 声明为 docs-only/docs，但实际修改了代码文件。');
            }

            // Post shape guard comment if failures
            if (failures.length > 0) {
              const body = `${marker}
            ### ⚠️ PR Shape Guard detected unsafe patch patterns

            Hi @${pr.user.login}, thanks for the contribution. This PR is not ready for review because its patch shape looks unsafe.

            **Detected issues:**

            ${failures.map(x => `- ${x}`).join('\n')}

            ---

            **How to fix:**

            Please recreate or rebase the PR from \`main\` with a clean, minimal patch:

            - edit the intended file directly
            - do not create files like \`README.md ---\`
            - do not paste markdown diff blocks into source files
            - do not replace the whole README or core source file
            - keep one issue per PR

            Thanks — happy to review a corrected PR.
            `;

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  per_page: 100,
                }
              );

              const old = comments.find(c => c.body && c.body.includes(marker));

              if (old) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: old.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body,
                });
              }
            }

            // ═══════════════════════════════════════════
            // AUTO-LABEL (scope / risk / shape / quality)
            // ═══════════════════════════════════════════

            const toAdd = [];
            const toRemove = [];

            // ── Gate 1: Scope (order matters: lessons > tests > docs) ──
            const isLessons = names.every(n => n.startsWith('lessons/'));
            const isTests = names.every(n => /test|spec|fixture/.test(n));
            const isDocs = names.every(n => n.startsWith('docs/') || n.endsWith('.md') && !n.startsWith('lessons/'));

            if (isLessons && names.length > 0) {
              toAdd.push('lessons-only');
              toAdd.push('needs-human-review');
            } else if (isTests && names.length > 0) {
              toAdd.push('tests-only');
            } else if (isDocs && names.length > 0) {
              toAdd.push('docs-only');
            }

            // ── Gate 2: Risk ──
            const touchesWorkflow = names.some(n => n.startsWith('.github/workflows/'));
            const touchesCore = names.some(n => ['search_knowledge.py', 'misaka-protocol.json'].includes(n));
            const largeDeletion = files.some(f => f.deletions > 100);
            const touchesGenerated = names.some(n =>
              n.startsWith('data/') || n.startsWith('docs/data/') ||
              n === 'lessons/_index.json' || n === 'lessons.json'
            );

            if (touchesCore || largeDeletion) toAdd.push('risk:high');
            if (touchesWorkflow) toAdd.push('workflow-change');
            if (touchesGenerated) toAdd.push('generated-file');

            // ── Gate 3: Shape (mutual exclusion, highest priority wins) ──
            const isGenerated = names.some(n => n.includes(' ---') || n.endsWith('---'));
            const isDestructive = files.some(f => f.filename === 'README.md' && f.deletions > 120);
            const hasShapeRisk = failures.length > 0;

            // Priority: destructive-rewrite > generated-file > shape-risk > shape-safe
            if (isDestructive) {
              toAdd.push('destructive-rewrite');
              toRemove.push('shape-safe', 'shape-risk', 'generated-file');
            } else if (isGenerated) {
              toAdd.push('generated-file');
              toRemove.push('shape-safe', 'shape-risk', 'destructive-rewrite');
            } else if (hasShapeRisk) {
              toAdd.push('shape-risk');
              toRemove.push('shape-safe', 'generated-file', 'destructive-rewrite');
            } else {
              toAdd.push('shape-safe');
              toRemove.push('shape-risk', 'generated-file', 'destructive-rewrite');
            }

            // ── Gate 4: DCO / rebase (based on commit metadata) ──
            // Merge commits (2+ parents) don't require sign-off — aligned with
            // dco-audit (--no-merges). Re-evaluated on every push so the label
            // auto-clears once all commits are signed (issue #1498).
            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number, per_page: 100 }
            );
            const hasDCO = commits
              .filter(c => (c.parents || []).length <= 1)
              .every(c => c.commit.message.includes('Signed-off-by:'));
            if (!hasDCO) {
              toAdd.push('needs-dco');
            } else {
              toRemove.push('needs-dco');
            }

            // ── Apply labels ──
            const existing = pr.labels.map(l => l.name);
            const uniqueAdd = [...new Set(toAdd)].filter(l => !existing.includes(l));
            const uniqueRemove = [...new Set(toRemove)].filter(l => existing.includes(l));

            if (uniqueAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: uniqueAdd,
              });
            }

            for (const label of uniqueRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label,
                });
              } catch (e) { /* label may not exist on this PR */ }
            }

            if (failures.length > 0) {
              core.setFailed('PR Shape Guard failed.');
            }
