name: Workers AI Lesson Benchmark (weekly)

on:
  schedule:
    # Weekly: Monday 02:00 UTC (Sun night US / Mon morning Asia — high-traffic window)
    - cron: '0 2 * * 1'
  workflow_dispatch:          # manual trigger
    inputs:
      scenarios:
        description: 'Number of scenarios (leave empty for full scan)'
        required: false
      models:
        description: 'Comma-separated model ids (default: free llama/qwen set)'
        required: false

permissions:
  contents: write
  pull-requests: write   # the report lands through the auto-merging PR, not a push to main

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'

      - name: Run lesson benchmark (with vs without lesson context)
        env:
          AI_GATEWAY_ID: misakanet-bench
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
        run: |
          SCEN="${{ github.event.inputs.scenarios || '' }}"
          # Free-tier only (2026-08-30): llama-3.3-70b billed $0.11 past the
          # 10k neurons/day allocation. 3b full + 8b strong stay inside the
          # free pool; --neuron-budget hard-stops before any billing.
          ARGS="--all --compare --strong-subset 40 --concurrency 5 \
            --full-model @cf/meta/llama-3.2-3b-instruct \
            --strong-model @cf/meta/llama-3.1-8b-instruct-fp8-fast \
            --neuron-budget 10000"
          [ -n "$SCEN" ] && ARGS="--scenarios $SCEN --compare --strong-subset 40 --concurrency 5 \
            --full-model @cf/meta/llama-3.2-3b-instruct \
            --strong-model @cf/meta/llama-3.1-8b-instruct-fp8-fast \
            --neuron-budget 10000"
          python3 scripts/benchmark_workers_ai.py $ARGS \
            --output docs/benchmarks/latest.json

      - name: Land the report through a pull request that merges itself
        # Was `git push || { … git push || echo "push skipped"; }` — a push that the ruleset on
        # `main` refuses, wrapped in a fallback that turned the refusal into a log line and a green
        # job. The report is a weekly artifact; losing it quietly is exactly how the previous
        # weeks' tables ended up as the only evidence that the benchmark still runs.
        #
        # The `[skip ci]` marker the old commit message carried is dropped: GitHub honours it in a
        # pull request title, which would suppress the required checks this PR needs and leave the
        # auto-merge waiting forever. `land_change.py` refuses such a title rather than stripping
        # it silently.
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          mkdir -p docs/benchmarks
          TS=$(date -u +%Y-%m-%d)
          cp docs/benchmarks/latest.json "docs/benchmarks/benchmark-$TS.json" 2>/dev/null || true
          python3 scripts/ci/land_change.py \
            --branch bot/benchmark-workers-ai \
            --title "chore(benchmark): weekly Workers AI lesson benchmark report [$TS]" \
            --paths docs/benchmarks \
            --note "Free-tier models only; the neuron budget is enforced by scripts/benchmark_workers_ai.py."
