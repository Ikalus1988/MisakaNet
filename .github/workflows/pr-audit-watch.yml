name: PR audit watch

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  open-intake-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Collect open intake issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --state open --label intake --limit 1000 --json number,createdAt > /tmp/open-intakes.json
      - name: Find courses satisfying open intakes
        run: python -m intake_audit.audit --open-intakes /tmp/open-intakes.json --courses-root . --output open-intake-audit.md
      - name: Publish audit to workflow summary
        run: cat open-intake-audit.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: open-intake-audit
          path: open-intake-audit.md
