name: Monthly Architecture Review

on:
  schedule:
    - cron: "0 2 1 * *"  # 1st of month, 2am UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write
  issues: write

jobs:
  arch-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Full history for analysis

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run architecture review
        id: review
        run: |
          python scripts/arch_review.py --json > arch-report.json
          echo "## Architecture Review — $(date +%Y-%m-%d)" > report.md
          echo "" >> report.md
          python scripts/arch_review.py >> report.md
          echo "" >> report.md
          echo "---" >> report.md
          echo "### Review Questions" >> report.md
          python scripts/arch_review.py --questions >> report.md

      - name: Create issue
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710  # v6
        with:
          title: "Monthly Architecture Review — ${{ github.run_id }}"
          content-filepath: report.md
          labels: |
            architecture
            automated

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: arch-report
          path: arch-report.json
