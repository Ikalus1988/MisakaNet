name: Deploy Cloudflare Worker

on:
  push:
    paths:
      - "workers/register-proxy-sw.js"
      # The config is part of the deployed artifact. Without this entry a compatibility-date,
      # binding or cron change merged to main never reached production — measured 2026-09-24:
      # `workers/wrangler.toml` still said `compatibility_date = "2024-01-01"`, and fixing it alone
      # would have deployed nothing. `tests/test_worker_compat_dates.py` fails if this list stops
      # covering both the entry point and the config it is built from.
      - "workers/wrangler.toml"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A Worker deploy is idempotent: it publishes the commit it checked out, and the newest commit is
# always the one you want live. Without this, every push that touches the worker queues a *separate*
# run in the `release` environment's approval list, and they pile up — measured 2026-09-21: four
# waiting runs, the oldest 22 hours old, with production reporting `serverInfo.version 2.31.0` while
# `main` said 2.33.0. Approving the wrong one would have deployed a 22-hour-old worker. With
# `cancel-in-progress`, the newest run supersedes the one still waiting for approval.
#
# Deliberately NOT applied to the *publish* workflows (npm/PyPI/registry): those are not idempotent
# per workflow, and two waiting runs are two different versions that must **both** run. Cancelling by
# workflow group there would silently drop a release. They need a reaper that cancels a waiting run
# only when that version is already published.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    # Secrets live in the `release` environment, not at repository level: they are publish and
    # deploy credentials, and environment secrets can carry protection rules. A branch policy is in
    # place today; once "required reviewers" is switched on, **this job waits for an approval on every
    # push to main that touches the worker**. That is deliberate — a Worker deploy is production
    # infrastructure — but it is a change in pace, so it is stated here rather than discovered.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Pre-flight — no placeholder ids in deployed config (audit T1.5)
        run: |
          set -euo pipefail
          python3 scripts/doctor.py --kv-only workers/wrangler.toml

      - name: Deploy Worker with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail

          cd workers
          npx wrangler deploy --config wrangler.toml

      - name: Post-deploy — the deployed endpoint answers the MCP handshake (#1822)
        run: |
          set -euo pipefail

          # `--kv-only` above returns before `CHECKS`, so `check_remote_endpoint` — the only check that
          # talks to the deployed service, and the one whose bar took an argument to get right (see the
          # 405 note in scripts/doctor.py) — had **no call site anywhere in CI**. A check nobody runs is
          # a comment. This is its call site, at the one moment its answer is both fresh and worth
          # reacting to: the deploy has just happened, and the question is whether what landed speaks MCP.
          #
          # Retried, because a Worker deploy propagates over a few seconds and because this probe's
          # expensive failure mode is "red on a healthy service" — measured while writing this: three
          # consecutive probes of misakanet.org from one machine returned HTTP 200, a connection
          # timeout, and HTTP 200 again. The retry is the difference between a signal and a coin flip.
          # Every attempt prints doctor's own message, so a human can still tell a timeout (HTTP 000)
          # from a service that answered wrongly (405, or a 200 whose body has no serverInfo).
          ATTEMPTS=5
          for attempt in $(seq 1 "$ATTEMPTS"); do
            if python3 scripts/doctor.py --remote-only; then
              exit 0
            fi
            echo "::warning::the MCP handshake probe failed (attempt $attempt/$ATTEMPTS)"
            [ "$attempt" = "$ATTEMPTS" ] || sleep 10
          done

          echo "::error::the worker deployed but https://misakanet.org/mcp did not complete an MCP handshake in $ATTEMPTS attempts — the deploy is not verified"
          exit 1

      - name: Reconcile the keepalive schedule with the config
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ACCOUNT_ID: 6b92325b505f2b76aec49e9fe4195d31
          WORKER_NAME: misakanet-register-proxy
        run: |
          set -euo pipefail

          # The keepalive cadence lives in `workers/wrangler.toml` under `[triggers] crons` — one
          # source of truth. This step used to PUT a hardcoded `*/5 * * * *` after every deploy,
          # which silently undid the config: the config had been moved to `*/15` precisely to cut
          # the 522 noise the loopback probe generates (see the comment there), and every deploy put
          # `*/5` back. Measured 2026-09-24: production ran `*/5` while main said `*/15`, so the
          # mitigation never survived a deploy. Read the config, apply it, read it back, and fail
          # when the two disagree.
          CONFIGURED=$(python3 -c '
          import tomllib
          crons = tomllib.load(open("workers/wrangler.toml", "rb"))["triggers"]["crons"]
          print(",".join(sorted(crons)))
          ')
          echo "workers/wrangler.toml asks for: $CONFIGURED"

          python3 -c '
          import json, sys
          print(json.dumps([{"cron": c} for c in sys.argv[1].split(",")]))
          ' "$CONFIGURED" > /tmp/schedules.json

          curl -fsS -X PUT \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/schedules.json \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules" > /dev/null

          curl -fsS -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/workers/scripts/$WORKER_NAME/schedules" \
            > /tmp/live-schedules.json

          LIVE=$(python3 -c '
          import json
          result = json.load(open("/tmp/live-schedules.json")).get("result")
          if isinstance(result, dict):
              result = result.get("schedules")
          # An unrecognised shape prints nothing, which the check below reports as a warning rather
          # than pretending the schedule matched.
          print(",".join(sorted(s["cron"] for s in result if isinstance(s, dict) and "cron" in s))
                if isinstance(result, list) else "")
          ')
          echo "live on Cloudflare:               $LIVE"

          if [ -z "$LIVE" ]; then
            echo "::warning::could not read the live schedule back (unexpected API shape) — see /tmp/live-schedules.json"
          elif [ "$LIVE" != "$CONFIGURED" ]; then
            echo "::error::the live keepalive schedule ($LIVE) does not match workers/wrangler.toml ($CONFIGURED)"
            exit 1
          fi
