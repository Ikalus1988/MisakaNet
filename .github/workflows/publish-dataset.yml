name: Publish dataset to R2

# The repository produces a citable dataset (651 lessons + 267 benchmark queries + four run
# artifacts) and has never published it anywhere but inside a git checkout. `build_dataset_bundle.py`
# assembles it; this workflow is what makes it a URL.
#
# Why CI and not a local script: publishing needs write credentials, and the only copy of them this
# account keeps is in a protected environment. A maintainer's laptop holding a write-capable
# Cloudflare token to upload 3 MB of JSON would be a worse trade than a workflow.
#
# Why not on every lesson commit: `data/okf/lessons.jsonl` is regenerated daily by `update-lessons.yml`,
# so a push trigger on that path publishes a new version every day even when nobody changed a lesson.
# That is why the version label is the date: daily versions are the point (a citation can pin one),
# and the upload is ~3 MB. If that ever becomes noise, switch the trigger to `workflow_dispatch` plus
# release tags — the version label is the only thing that has to move with it.
#
# **It became noise, and this is that switch (2026-11-15).** Measured over two days: eight runs, one
# per corpus push — and because the job sits behind `release`, each one is a **click**. A lesson pull
# request merges, and a person is asked to approve a 3 MB upload of a file the merge already
# regenerated. The reviewer is not reviewing intent here either: the trigger is `push` to `main`, so
# the code is what somebody already merged; the approval only says "yes, this is main".
#
# A daily schedule is the right cadence for one more reason written above: `data/okf/lessons.jsonl` is
# already regenerated daily, and the version label is the date. So one run a day publishes exactly one
# dated version, and the dataset lags at most a day.
#
# **Which is why this job moved to `automation` (2026-11-15), and not merely to a cron.** A cron behind
# `release` is two failures at once: it waits for a click every day, and on the day nobody clicks it
# publishes nothing — which is the `automation`-environment rule `heartbeat.yml` states in its own
# header ("a cron job that needs a click is not a cron job"). The first draft of this change kept
# `release` and dropped the clicks from N to 1; `test_secret_scoping` was right to reject that, and the
# rejection is the reason the credential moved instead of the rule.
#
# **No new permission was needed, and that is the part worth reading.** `automation`'s token
# (`misakanet-automation-d1`) already carried `Workers R2 Storage:Edit` when this change was written
# (confirmed by the owner, 2026-11-15). Every workflow header that said "D1:Edit only" was describing
# its own job's need as if it were the token's scope, so this job is the first to *use* a permission the
# environment has had since 2026-09-19.
#
# Those headers and docs/maintainer/credentials-and-environments.md §3 are corrected here, because a
# reassuring note that is not true is worse than no note: the reviewer-free environment's real blast
# radius is "any lesson row and any R2 object this token can reach", not "lesson rows only". What it
# still cannot do is replace the code served at misakanet.org — that line stays with `release`.

on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-dataset
  cancel-in-progress: true

jobs:
  publish:
    # Credential: the `automation` environment holds `CF_API_TOKEN` — the unattended Cloudflare token
    # (`misakanet-automation-d1`), scoped to D1:Edit **and** Workers R2 Storage:Edit for
    # `misakanet-dataset`, which is what the upload below needs. It cannot deploy a worker, replace the
    # served code, or touch DNS.
    #
    # `automation` has no required reviewers on purpose: a scheduled job behind an approval gate is not
    # a safer job, it is a job that stops on the day nobody is around. It is branch-restricted to
    # `main` instead — so a `workflow_dispatch` from a feature branch is rejected by the environment,
    # and testing this file means merging first or pushing to `main`.
    # See docs/maintainer/credentials-and-environments.md.
    environment: automation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      ACCOUNT_ID: 6b92325b505f2b76aec49e9fe4195d31
      BUCKET: misakanet-dataset
      PUBLIC_HOST: data.misakanet.org
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Build the bundle
        id: bundle
        run: |
          set -euo pipefail
          # The version is the date PLUS the commit, not the date alone. Measured 2026-10-27: this
          # workflow triggers on any change to the artifact paths, so two merges in a day published
          # twice under `v2026-10-27/` and the second silently overwrote the first — while
          # DATASET.md promises that a version's files never change. A path that can be rewritten
          # under a citation is worth less than no path, so the commit is part of the label.
          VERSION="$(date -u +%Y-%m-%d)-${GITHUB_SHA:0:7}"
          python3 scripts/build_dataset_bundle.py --out dist/dataset --version "$VERSION" | tee /tmp/build.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure the bucket exists
        run: |
          set -euo pipefail
          # Idempotent: an existing bucket answers 10004 ("already exists"), which is the expected
          # state on every run after the first, not a failure.
          code=$(curl -sS -o /tmp/bucket.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets" \
            -d "{\"name\":\"$BUCKET\"}")
          if [ "$code" = "200" ]; then
            echo "created $BUCKET"
          elif grep -q '"code":10004' /tmp/bucket.json; then
            echo "$BUCKET already exists"
          elif [ "$code" = "403" ]; then
            # The likeliest first-run failure, named so nobody has to decode it: the deploy token
            # carries Workers Scripts:Edit and may not carry Workers R2 Storage:Edit. The fix is a
            # scope on the token, not a code change.
            echo "::error::CF_API_TOKEN cannot write R2 (403). The `automation` environment's token must carry \"Workers R2 Storage:Edit\" for the misakanet-dataset bucket; add the permission on the token, not in this file. Response: $(cat /tmp/bucket.json)"
            exit 1
          else
            echo "::error::bucket create failed ($code): $(cat /tmp/bucket.json)"
            exit 1
          fi

      - name: Publish this version
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          set -euo pipefail
          npx wrangler --version
          upload() {  # path-in-bundle, content-type
            local src="dist/dataset/$1" key="v$VERSION/$1"
            npx wrangler r2 object put "$BUCKET/$key" \
              --file "$src" --content-type "$2" --remote
          }
          upload lessons.jsonl application/x-ndjson
          upload lessons.json application/json
          upload manifest.json application/json
          upload LICENSE text/plain
          upload LICENSE-CC0 text/plain
          for f in dist/dataset/benchmarks/*; do
            upload "benchmarks/$(basename "$f")" application/json
          done

      - name: Point `latest` at this version
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" <<'PY'
          import json, sys
          version = sys.argv[1]
          manifest = json.load(open("dist/dataset/manifest.json", encoding="utf-8"))
          manifest["latest"] = {
              "version": version,
              "base": f"v{version}/",
              "manifest": f"v{version}/manifest.json",
          }
          open("dist/dataset/latest.json", "w", encoding="utf-8").write(
              json.dumps(manifest, ensure_ascii=False, indent=1) + "\n")
          PY
          npx wrangler r2 object put "$BUCKET/latest.json" \
            --file dist/dataset/latest.json --content-type application/json --remote

      - name: Serve it on the public host
        id: host
        run: |
          set -euo pipefail
          # A custom domain is the production answer: r2.dev is rate-limited and Cloudflare documents
          # it as development-only. Attaching the domain also creates the DNS record.
          ZONE=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=misakanet.org" \
            | python3 -c "import json,sys;print((json.load(sys.stdin)['result'] or [{}])[0].get('id',''))")
          if [ -n "$ZONE" ]; then
            code=$(curl -sS -o /tmp/domain.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets/$BUCKET/domains/custom" \
              -d "{\"domain\":\"$PUBLIC_HOST\",\"zoneId\":\"$ZONE\",\"enabled\":true}")
            echo "custom domain: HTTP $code $(head -c 300 /tmp/domain.json)"
          fi
          # r2.dev is enabled as well, as a fallback URL that works before the certificate is issued.
          curl -sS -o /tmp/managed.json -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets/$BUCKET/domains/managed" \
            -d '{"enabled":true}' || true
          FALLBACK=$(python3 -c "import json;print(json.load(open('/tmp/managed.json')).get('result',{}).get('domain',''))" 2>/dev/null || true)
          echo "fallback=$FALLBACK" >> "$GITHUB_OUTPUT"

      - name: Verify the published bytes
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
          FALLBACK: ${{ steps.host.outputs.fallback }}
        run: |
          set -euo pipefail
          # A custom domain attached seconds ago is not serving yet — measured 2026-10-27: the first
          # run uploaded all ten objects, attached data.misakanet.org, then failed this step with
          # 403/401 on a bucket that was already correct. The certificate and the route take a
          # minute, so this polls instead of asking once: a verification step that reports a
          # transient as a failure is worse than no verification, because it trains the reader to
          # ignore it.
          fetch_manifest() {
            local base="$1" attempt
            for attempt in $(seq 1 12); do
              if curl -sSf --max-time 30 "$base/v$VERSION/manifest.json" -o /tmp/remote.json 2>/dev/null; then
                echo "manifest served by $base (attempt $attempt)"; return 0
              fi
              echo "attempt $attempt: $base not serving yet"; sleep 15
            done
            return 1
          }
          BASE="https://$PUBLIC_HOST"
          if ! fetch_manifest "$BASE"; then
            if [ -n "$FALLBACK" ] && fetch_manifest "https://$FALLBACK"; then
              BASE="https://$FALLBACK"
            else
              echo "::error::neither $PUBLIC_HOST nor the r2.dev host served the manifest after ~3 minutes"
              exit 1
            fi
          fi
          python3 - <<'PY'
          import hashlib, json
          local = json.load(open("dist/dataset/manifest.json", encoding="utf-8"))
          remote = json.load(open("/tmp/remote.json", encoding="utf-8"))
          assert local["files"] == remote["files"], "manifest file list differs from what was uploaded"
          print(f"verified {len(remote['files'])} file entries against {remote['version']}")
          PY
          echo "dataset URL: $BASE/v$VERSION/manifest.json" >> "$GITHUB_STEP_SUMMARY"
