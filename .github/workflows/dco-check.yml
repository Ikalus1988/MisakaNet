name: DCO Check

# `DCO / Signed-off-by` is one of the three **required** status checks on `main` (ruleset 23826057), and
# it is not a job name: this workflow creates it through the Checks API. Two things follow, and both
# cost the repository real time before they were written down here.
#
# 1. It has to run under `pull_request_target`. For a **fork** PR the default `GITHUB_TOKEN` is
#    read-only, so `checks.create` answers 403 — and the original version caught that and logged
#    "Skipping DCO status check (fork PR permission)", so the required check was **never reported** and
#    GitHub held every external PR at "Expected — waiting for status to be reported" forever, while
#    this workflow reported green. Measured 2026-09-25: 12 of the 14 open PRs were blocked that way,
#    the oldest for 17 days.
#
# 2. A privileged trigger means the job must not touch the PR's code, which is why **there is no
#    `actions/checkout` in this file at all**. The first fix kept the checkout (it used `git log` to
#    read commit messages) and hol-guard's scanner raised `GITHUB_ACTIONS_UNTRUSTED_CHECKOUT` on it the
#    same day (code-scanning alert **#284**) — correctly, because "privileged trigger + checkout of the
#    PR head" is the shape of a pwn request, and a scanner cannot read the comment explaining that this
#    particular job only reads commit messages.
#
# Commit messages and their authors come from the API, so the DCO question needs no working tree:
# `pulls.listCommits` returns exactly the commits the PR adds relative to its base — the range the old
# `git log upstream/${BASE}..HEAD` computed. Merge commits are exempt (`parents.length > 1`), matching
# the `--no-merges` the shell version used.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to audit"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  dco:
    runs-on: ubuntu-latest
    # Skip DCO check for release-please bot PRs
    if: github.event.pull_request.user.login != 'release-please[bot]'
    steps:
      - name: Check commits and report DCO status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const CHECK_NAME = 'DCO / Signed-off-by';
            const FIX_HINT = [
              'One or more commits are missing the `Signed-off-by:` trailer (merge commits are exempt). Fix:',
              '',
              '```bash',
              '# latest commit',
              'git commit --amend --signoff --no-edit',
              'git push --force-with-lease',
              '',
              '# last N commits',
              'git rebase --signoff HEAD~N',
              'git push --force-with-lease',
              '```',
              '',
              'CI re-scans on every push (including force-pushes) and the `needs-dco` label **auto-clears** '
                + 'once all commits are signed — do not push an empty commit. Same-repo PRs can also comment '
                + '`/fix-dco` to auto-apply.',
            ].join('\n');

            // The PR comes from the event under `pull_request_target`; `workflow_dispatch` has no
            // `pull_request` payload, and the first version of this step read
            // `context.payload.pull_request.head.sha` unconditionally — so the `pr_number` input, whose
            // entire purpose is to re-report the check on a PR that lost it, threw before creating
            // anything. Resolving the sha from the API is what makes that recovery path work.
            const fromEvent = context.payload.pull_request;
            const inputNumber = (context.payload.inputs || {}).pr_number;
            let pullNumber = fromEvent ? fromEvent.number : (inputNumber ? Number(inputNumber) : null);
            let headSha = fromEvent ? fromEvent.head.sha : null;

            if (!pullNumber) {
              core.setFailed('No pull request in this event and no `pr_number` input. Nothing to check '
                + '— and because this check is required on `main`, a PR without it cannot be merged.');
              return;
            }
            if (!headSha) {
              const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: pullNumber });
              headSha = data.head.sha;
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              ...context.repo, pull_number: pullNumber, per_page: 100,
            });
            const offenders = commits.filter((c) =>
              (c.parents || []).length <= 1 && !/signed-off-by:/i.test(c.commit.message || ''));

            const pass = offenders.length === 0;
            const summary = pass
              ? `✅ **DCO Check Passed** — all ${commits.length} commit(s) include \`Signed-off-by:\`. `
                + 'Thank you for respecting code origin!'
              : `❌ **DCO Check Failed** — ${offenders.length} of ${commits.length} commit(s) are missing `
                + '`Signed-off-by:`.';
            const text = pass
              ? 'All commits include a Signed-off-by trailer. This certifies that the contributor has '
                + 'the right to submit the code under the project license.'
              : FIX_HINT + '\n\n' + offenders
                  .map((c) => `- \`${c.sha.slice(0, 7)}\` ${(c.commit.message || '').split('\n')[0].slice(0, 100)}`
                    + ` — ${c.commit.author?.name || '?'} <${c.commit.author?.email || '?'}>`)
                  .join('\n');

            try {
              await github.rest.checks.create({
                ...context.repo,
                name: CHECK_NAME,
                head_sha: headSha,
                status: 'completed',
                // `failure`, not `action_required`. This repository's own lessons use
                // `action_required` to mean *the run was held by GitHub and never executed*
                // (`lessons/contrib/ci-fork-pr-run-held-as-action-required.md` and
                // `ci-github-token-push-does-not-trigger-workflows.md`), and GitHub renders it as
                // "waiting for approval" — a state only a maintainer can clear. Reporting a missing
                // sign-off that way made a contributor's fixable mistake look like an infrastructure
                // hold: measured 2026-09-25, #2090 / #2037 / #1982 all sat in it, and the comment on
                // them had to explain that the state meant "your commits are unsigned".
                // Same blocking effect (a required context is satisfied only by `success`), without
                // the ambiguity: an unsigned commit is a *failed gate*, so say so.
                conclusion: pass ? 'success' : 'failure',
                output: { title: 'Developer Certificate of Origin', summary, text },
              });
              core.info(`${CHECK_NAME} on ${headSha}: ${pass ? 'success' : 'failure'}`);
            } catch (e) {
              // The consequence is not "this run looks odd": the required check is missing, so GitHub
              // holds the PR at "Expected — waiting for status to be reported" indefinitely and no
              // amount of green elsewhere can merge it. Say that, and fail.
              core.setFailed(`Could not create the required check \`${CHECK_NAME}\` on ${headSha}: ${e.message}. `
                + 'Until it exists, this PR cannot satisfy the ruleset on `main` — check that this '
                + 'workflow has `checks: write` and that it still triggers on `pull_request_target`.');
            }

      # The DCO *comment* lives in pr-checks.yml (it needs SHELDON_PAT to write on a fork PR); this
      # workflow only reports the check, which is the part the ruleset requires.
