name: Update Badge Counts

on:
  push:
    branches: [main]
    paths:
      - "lessons/**"
      - "scripts/mcp_server.py"
  workflow_run:
    # By `name:`, which is what GitHub matches on. "Update Lessons" was not a name any workflow had
    # (the file is `update-lessons.yml`, its name is "Update lessons.json"), so this half of the
    # trigger could never fire and the badges refreshed only on the weekly cron — invisibly, with no
    # error. `tests/test_workflow_triggers.py` now checks every name in every `workflow_run` list
    # against the workflows that exist, so the next typo fails a test instead of going quiet.
    workflows: ["Lesson Quality Gate", "Update lessons.json"]
    types: [completed]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# The badges are a pure function of the tree, so the newest run is the only one worth finishing: two
# runs on the same ref race on `git push`, and the loser can only write an older count over a newer
# one. Measured 2026-10-02: 11 `workflow_run` runs in the 20 minutes 04:54–05:14Z on a `main` that never
# moved (`dedc383b`), all 11 of them executing — and `types: [completed]` includes the `cancelled`
# completions that every bounded workflow now produces, so the trigger keeps firing for runs that
# decided nothing.
concurrency:
  group: update-badges-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-badges:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Count lessons
        id: count
        run: |
          # Through the SSOT reader, not `find lessons/ -name '*.md'`. The raw file count (434)
          # includes lessons/templates, per-language copies and the repo's own describing files,
          # while every managed surface — including the "393+" two lines above this badge in the
          # same README — reports the published index (`canonical_count()`, from
          # data/lessons.json). The two numbers contradicted each other in one file.
          LESSON_COUNT=$(python3 -c "from scripts.sync_lesson_count import canonical_count; print(canonical_count())")
          echo "lessons=$LESSON_COUNT" >> "$GITHUB_OUTPUT"

      - name: Count domains
        id: domains
        run: |
          # Through the SSOT reader, so the badge and every surface that quotes the number agree
          # (issue #1687: the badge counted raw strings — `devops` and `"devops"` were two — so it
          # said 69 while the same values normalised to 61 and the copy claimed 18).
          DOMAIN_COUNT=$(python3 -c "from scripts.sync_lesson_count import canonical_domains; print(canonical_domains())")
          echo "domains=$DOMAIN_COUNT" >> "$GITHUB_OUTPUT"

      - name: Count MCP tools
        id: tools
        run: |
          # Through the SSOT reader, like the domain and node counts below — but for a stronger
          # reason than theirs (issue #1822). This step used to be
          # `grep -cE 'name: "misakanet_' workers/register-proxy-sw.js`: the expected value and the
          # measured value were the *same file*, so the badge could not disagree with the worker and
          # could never notice that the worker disagreed with the documentation. It only proved the
          # file had not been deleted.
          #
          # `canonical_mcp_tools` takes the expectation from the AGENTS.md §3.2 table and the
          # measurement from the worker, and **raises** when they differ, so this step now fails on
          # a tool that is registered but undocumented (or the reverse) instead of publishing a
          # number that is merely consistent with itself.
          TOOL_COUNT=$(python3 -c "from scripts.sync_lesson_count import canonical_mcp_tools; print(canonical_mcp_tools())")
          echo "tools=$TOOL_COUNT" >> "$GITHUB_OUTPUT"

      # The registered-node badge is gone with the number itself (2026-09-26, #2313). It imported
      # `canonical_nodes` from the count SSOT, and that metric was retired — so this workflow failed
      # with an ImportError on every run from the moment #2313 merged until this line was removed,
      # which is what a red workflow on `main` looks like when nobody reads it (#2332's neighbour).
      # `README.zh-CN.md` stopped pointing at `nodes.json` in the same change, so nothing consumes it.
      # `data/counter.json` was deleted in the same week (2026-09-28): it was the `/api/counter`
      # fallback, and a stale copy of a number read to predict the next registrant's id is worse
      # than no answer (#1820). The endpoint now says `counter_unavailable` instead.
      - name: Generate badge JSONs
        run: |
          mkdir -p /tmp/badges
          LESSON_COUNT="${{ steps.count.outputs.lessons }}"
          TOOL_COUNT="${{ steps.tools.outputs.tools }}"
          DOMAIN_COUNT="${{ steps.domains.outputs.domains }}"
          echo "{\"schemaVersion\":1,\"label\":\"lessons\",\"message\":\"$LESSON_COUNT\",\"color\":\"brightgreen\"}" > /tmp/badges/lessons.json
          echo "{\"schemaVersion\":1,\"label\":\"MCP tools\",\"message\":\"$TOOL_COUNT\",\"color\":\"purple\"}" > /tmp/badges/tools.json
          echo "{\"schemaVersion\":1,\"label\":\"domains\",\"message\":\"$DOMAIN_COUNT\",\"color\":\"blue\"}" > /tmp/badges/domains.json
          echo "Generated badges: lessons=$LESSON_COUNT, tools=$TOOL_COUNT, domains=$DOMAIN_COUNT"
          cat /tmp/badges/lessons.json
          cat /tmp/badges/tools.json
          cat /tmp/badges/domains.json

      # The one badge that is a *live* fact rather than a repository fact: how today's searches were
      # answered (BM25 vs the naive fallback). It reads `/api/search-index` and publishes one number —
      # the decision (2026-09-29) is to publish this and **not** `mcpClients`, because this one is about
      # our own implementation while that one is about other people's tooling. A transport failure
      # writes nothing, so yesterday's value stays rather than the badge claiming "no data".
      - name: Generate retrieval-backend badge
        run: python3 scripts/update_retrieval_badge.py --out /tmp/badges/retrieval.json

      # One badge cannot answer "is onboarding working" — this one puts the funnel's legs side by side
      # (npm weekly downloads, today's agent calls, GitHub's 14-day clone/view context). It publishes
      # *nothing* when a leg cannot be measured, which is why the step is allowed to fail the run: a week
      # without a measurement should be visible, not silently replaced by yesterday's number.
      - name: Generate onboarding snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/snapshot_onboarding.py --out /tmp/badges/onboarding.json

      - name: Push to data branch
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "misakanet-bot"
          git config user.email "bot@misakanet.dev"
          git remote set-url origin "https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Save badges to temp location before switching branches
          cp -r /tmp/badges /tmp/badges-backup

          # Switch to data branch
          git fetch origin data
          git checkout --track origin/data || git checkout data

          # Ensure badges directory exists
          mkdir -p badges

          # Copy badges from backup
          cp -f /tmp/badges-backup/*.json badges/

          # Stage badges and check for changes
          git add badges/
          if ! git diff --cached --quiet; then
            git commit -m "badges: auto-update lesson/tool counts [skip ci]"
            git push origin data
            echo "✅ Badges updated and pushed"
          else
            echo "⚠️ No badge changes detected"
          fi
