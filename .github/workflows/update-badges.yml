name: Update Badge Counts

on:
  push:
    branches: [main]
    paths:
      - "lessons/**"
      - "scripts/mcp_server.py"
  workflow_run:
    workflows: ["Lesson Quality Gate", "Update Lessons"]
    types: [completed]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Count lessons
        id: count
        run: |
          # Through the SSOT reader, not `find lessons/ -name '*.md'`. The raw file count (434)
          # includes lessons/templates, per-language copies and the repo's own describing files,
          # while every managed surface — including the "393+" two lines above this badge in the
          # same README — reports the published index (`canonical_count()`, from
          # data/lessons.json). The two numbers contradicted each other in one file.
          LESSON_COUNT=$(python3 -c "from scripts.sync_lesson_count import canonical_count; print(canonical_count())")
          echo "lessons=$LESSON_COUNT" >> "$GITHUB_OUTPUT"

      - name: Count domains
        id: domains
        run: |
          # Through the SSOT reader, so the badge and every surface that quotes the number agree
          # (issue #1687: the badge counted raw strings — `devops` and `"devops"` were two — so it
          # said 69 while the same values normalised to 61 and the copy claimed 18).
          DOMAIN_COUNT=$(python3 -c "from scripts.sync_lesson_count import canonical_domains; print(canonical_domains())")
          echo "domains=$DOMAIN_COUNT" >> "$GITHUB_OUTPUT"

      - name: Count MCP tools
        id: tools
        run: |
          # Through the SSOT reader, like the domain and node counts below — but for a stronger
          # reason than theirs (issue #1822). This step used to be
          # `grep -cE 'name: "misakanet_' workers/register-proxy-sw.js`: the expected value and the
          # measured value were the *same file*, so the badge could not disagree with the worker and
          # could never notice that the worker disagreed with the documentation. It only proved the
          # file had not been deleted.
          #
          # `canonical_mcp_tools` takes the expectation from the AGENTS.md §3.2 table and the
          # measurement from the worker, and **raises** when they differ, so this step now fails on
          # a tool that is registered but undocumented (or the reverse) instead of publishing a
          # number that is merely consistent with itself.
          TOOL_COUNT=$(python3 -c "from scripts.sync_lesson_count import canonical_mcp_tools; print(canonical_mcp_tools())")
          echo "tools=$TOOL_COUNT" >> "$GITHUB_OUTPUT"

      - name: Count registered nodes
        id: nodes
        run: |
          # Through the SSOT reader instead of a second copy of the offset. README.zh-CN.md's
          # badge now points at this JSON rather than carrying a number nobody refreshed — it
          # said 59 while data/counter.json said 73 (issue #1683).
          NODE_COUNT=$(python3 -c "from scripts.sync_lesson_count import canonical_nodes; print(canonical_nodes())")
          echo "nodes=$NODE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Generate badge JSONs
        run: |
          mkdir -p /tmp/badges
          LESSON_COUNT="${{ steps.count.outputs.lessons }}"
          TOOL_COUNT="${{ steps.tools.outputs.tools }}"
          NODE_COUNT="${{ steps.nodes.outputs.nodes }}"
          DOMAIN_COUNT="${{ steps.domains.outputs.domains }}"
          echo "{\"schemaVersion\":1,\"label\":\"lessons\",\"message\":\"$LESSON_COUNT\",\"color\":\"brightgreen\"}" > /tmp/badges/lessons.json
          echo "{\"schemaVersion\":1,\"label\":\"MCP tools\",\"message\":\"$TOOL_COUNT\",\"color\":\"purple\"}" > /tmp/badges/tools.json
          echo "{\"schemaVersion\":1,\"label\":\"domains\",\"message\":\"$DOMAIN_COUNT\",\"color\":\"blue\"}" > /tmp/badges/domains.json
          echo "{\"schemaVersion\":1,\"label\":\"nodes\",\"message\":\"$NODE_COUNT\",\"color\":\"green\"}" > /tmp/badges/nodes.json
          echo "Generated badges: lessons=$LESSON_COUNT, tools=$TOOL_COUNT, domains=$DOMAIN_COUNT, nodes=$NODE_COUNT"
          cat /tmp/badges/lessons.json
          cat /tmp/badges/tools.json
          cat /tmp/badges/domains.json
          cat /tmp/badges/nodes.json

      - name: Push to data branch
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "misakanet-bot"
          git config user.email "bot@misakanet.dev"
          git remote set-url origin "https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Save badges to temp location before switching branches
          cp -r /tmp/badges /tmp/badges-backup

          # Switch to data branch
          git fetch origin data
          git checkout --track origin/data || git checkout data

          # Ensure badges directory exists
          mkdir -p badges

          # Copy badges from backup
          cp -f /tmp/badges-backup/*.json badges/

          # Stage badges and check for changes
          git add badges/
          if ! git diff --cached --quiet; then
            git commit -m "badges: auto-update lesson/tool counts [skip ci]"
            git push origin data
            echo "✅ Badges updated and pushed"
          else
            echo "⚠️ No badge changes detected"
          fi
