name: PR Thank You
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read   # read docs/_lessons_count.txt for the count in the comment
  issues: write
  pull-requests: write

jobs:
  thank:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            // `context.payload.pull_request`, NOT `github.event.pull_request`: the object
            // github-script hands the body is the @actions/github module (context, getOctokit,
            // GitHub), which has no `event` property — reading one threw
            // "Cannot read properties of undefined (reading 'pull_request')" on every merged
            // PR, so this workflow had never posted its comment (issue #1685, 2026-09-15).
            // The `if:` above is a workflow expression, a different language, where the event
            // payload is spelled `github.event` — that one is correct.
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const title = pr.title;
            const number = pr.number;

            // Read the canonical lesson count at runtime instead of hardcoding it.
            // This is a workflow file, and GITHUB_TOKEN is refused any push that
            // touches .github/workflows/** — so a number kept in step by the daily
            // update job would make that job fail at push time (found 2026-09-12,
            // when the first count change broke update-lessons.yml). The count is
            // decorative here: never fail the comment over it.
            let lessons = "";
            try {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: "docs/_lessons_count.txt",
                ref: context.payload.repository.default_branch,
              });
              const count = Buffer.from(file.data.content, "base64").toString("utf8").trim();
              if (/^\d+$/.test(count)) lessons = " (now " + count + " lessons)";
            } catch (e) {
              lessons = "";
            }

            // Skip bots
            if (pr.user.type === "Bot" || author.includes("[bot]")) {
              return;
            }

            const body = [
              "## 🎉 Merged — Thank you!",
              "",
              "Your contribution has been merged into main.",
              "",
              "**PR:** #" + number + " — " + title,
              "",
              "**What's next:**",
              "- Your code is now part of MisakaNet's failure-lesson corpus" + lessons,
              "- Feel free to pick up another issue labeled `good first issue` or `status: competition`",
              "- Questions? Ask in this thread or open a Discussion",
              "",
              "Welcome to the MisakaNet contributor community! 🧠"
            ].join("\n");

            await github.rest.issues.createComment({
              issue_number: number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
