name: Build Live Feed

on:
  # The cadence is also the snapshot's freshness: `scripts/sync_site_activity.py` reads a live endpoint,
  # so nothing in the tree can trigger it — this cron is what keeps the homepage's activity panel
  # current. `scripts/ci/land_change.py` gives each run a stable `bot/build-feed` branch, so a second
  # run updates the open pull request instead of starting a queue.
  schedule:
    - cron: "23 */3 * * *"
  push:
    branches: [main]
    paths:
      - "data/lessons.json"
      - "scripts/build_feed.py"
      - "scripts/sync_site_activity.py"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write   # was read; the feed lands through the auto-merging PR, not a push to main

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # `persist-credentials: false`, because `land_change.py` supplies its own: it pushes
          # `https://x-access-token:<PAT>@…`, and the checkout's stored token takes precedence over
          # the URL — so the branch went out as `github-actions[bot]` and every run on its pull request
          # came back `action_required`: held, never executed, with nothing able to satisfy the required
          # checks, so the self-merging PR could not merge. Measured 2026-09-25: 39 held runs on
          # `bot/release-version-sync`, 24 on `bot/build-feed`, and the version-sync PR stuck.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Guard against empty lessons.json
        run: |
          SIZE=$(stat --printf="%s" data/lessons.json)
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::data/lessons.json is $SIZE bytes — refusing to sync empty/truncated file"
            exit 1
          fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('data/lessons.json'))))")
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::data/lessons.json has only $COUNT lessons — refusing to sync"
            exit 1
          fi
          echo "Guard passed: $SIZE bytes, $COUNT lessons"

      - name: Sync lessons.json to docs/data/
        run: cp data/lessons.json docs/data/lessons.json

      - name: Build feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_feed.py

      - name: Snapshot the site's activity counters
        # `docs/data/activity.json` is what the homepage's activity panel reads, and it is a snapshot
        # for one measured reason: `/api/analytics/traffic` answers in 0.66-0.75s from cache and
        # **17.4s** when it recomputes (five consecutive requests, 2026-09-24), so calling it from a
        # browser would rebuild the 504 generator #2151 spent a day removing.
        #
        # It rides in *this* job rather than getting its own workflow on purpose: this job already
        # runs every three hours and already lands its files through one self-merging pull request, so
        # the snapshot costs no additional commits, no additional PRs and no additional CI runs.
        #
        # `|| true` and then a warning: the feed landing is not allowed to fail because a counter
        # endpoint was slow. The script itself refuses to write anything it cannot vouch for (a failed
        # fetch, a zero, a partial breakdown), so a failure here leaves the previous snapshot in place
        # — and says so in the log rather than passing silently.
        run: |
          set -euo pipefail
          python3 scripts/sync_site_activity.py || {
            echo "::warning::the activity snapshot could not be refreshed; the previous file is unchanged"
            exit 0
          }

      - name: Land the feed through a pull request that merges itself
        # Was `git push` — refused since 2026-09-22 by the ruleset on `main` (run 35820175013, on
        # 2026-09-22 17:03 UTC, died here after the sync and the feed build had both succeeded).
        # See docs/maintainer/automation-lands-via-pr.md.
        #
        # The two paths are named rather than left to `git add -A` because this job's contract is
        # exactly those two files: anything else that appeared in the checkout would be a bug in
        # the guard above, not something to commit.
        env:
          # `SHELDON_PAT`, never `GITHUB_TOKEN`: a branch pushed with `GITHUB_TOKEN` starts no
          # workflow runs, so the required checks would never report and auto-merge would wait
          # forever.
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          python3 scripts/ci/land_change.py \
            --branch bot/build-feed \
            --title "chore(data): sync lessons.json + refresh feed" \
            --paths docs/data/lessons.json docs/data/feed.json docs/data/activity.json \
            --note "Any of these may be unchanged on its own; this pull request exists because at least one of them moved. The activity snapshot is refreshed every three hours so the homepage panel reads a static file instead of the 17-second recompute behind /api/analytics/traffic."
