name: Build Live Feed

on:
  schedule:
    - cron: "23 */3 * * *"
  push:
    branches: [main]
    paths:
      - "data/lessons.json"
      - "scripts/build_feed.py"
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write   # was read; the feed lands through the auto-merging PR, not a push to main

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Guard against empty lessons.json
        run: |
          SIZE=$(stat --printf="%s" data/lessons.json)
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::data/lessons.json is $SIZE bytes — refusing to sync empty/truncated file"
            exit 1
          fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('data/lessons.json'))))")
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::data/lessons.json has only $COUNT lessons — refusing to sync"
            exit 1
          fi
          echo "Guard passed: $SIZE bytes, $COUNT lessons"

      - name: Sync lessons.json to docs/data/
        run: cp data/lessons.json docs/data/lessons.json

      - name: Build feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/build_feed.py

      - name: Land the feed through a pull request that merges itself
        # Was `git push` — refused since 2026-09-22 by the ruleset on `main` (run 35820175013, on
        # 2026-09-22 17:03 UTC, died here after the sync and the feed build had both succeeded).
        # See docs/maintainer/automation-lands-via-pr.md.
        #
        # The two paths are named rather than left to `git add -A` because this job's contract is
        # exactly those two files: anything else that appeared in the checkout would be a bug in
        # the guard above, not something to commit.
        env:
          # `SHELDON_PAT`, never `GITHUB_TOKEN`: a branch pushed with `GITHUB_TOKEN` starts no
          # workflow runs, so the required checks would never report and auto-merge would wait
          # forever.
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          python3 scripts/ci/land_change.py \
            --branch bot/build-feed \
            --title "chore(data): sync lessons.json + refresh feed" \
            --paths docs/data/lessons.json docs/data/feed.json \
            --note "Either file may be unchanged on its own; this pull request exists because at least one of them moved."
