# Example: capture CI failures as MisakaNet intake artifacts
# This workflow does NOT auto-publish — it only generates redacted artifacts.
#
# Usage:
#   - uses: Ikalus1988/MisakaNet/.github/actions/misaka-capture@02a52f51543b852c5a2c6e784ff9dc16318fa28e  # main
#     if: failure()
#     with:
#       summary: "CI failed"
#       log-file: pytest.log

name: Example Capture (not active)

on:
  workflow_dispatch:  # Manual trigger only — this is an example


permissions:
  contents: read
jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Run tests (example)
        # No `|| true`. An external review noted that it made the next step's `if: failure()`
        # permanently false, so this example could never capture anything — and it is an example
        # people copy, so it taught the dead pattern. The step is *meant* to fail: that is the
        # state the capture exists to handle. If a run of this workflow should end green, the
        # honest place to say so is the capture step's own `if:`, not a `|| true` that also
        # disables the example's only interesting behaviour.
        run: python -m pytest

      - name: Capture failure
        if: failure()
        uses: ./.github/actions/misaka-capture
        with:
          summary: "pytest failed"
          log-file: pytest.log
          source: github-actions
