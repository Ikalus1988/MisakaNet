name: Mirror Node Counter

# data/counter.json is the offline-checkable copy of the node counter that
# https://misakanet.org/api/counter serves from the worker's KV.
#
# Why this exists (issue #1683, 2026-09-15): only the issue-based registration workflow ever
# wrote that file, while every MCP registration — the path the npx installer takes — only
# incremented KV. Two independent sequences then described one fact: the file said 10073 and
# KV said 10178, so the site showed 178 nodes while the file implied 73, and the surfaces that
# quoted it said "52+" and "59". Nothing watched it.
#
# The mirror and the surface refresh land in ONE commit on purpose: a commit that moved only
# the counter would leave `sync_lesson_count.py --check` (PRs, and pushes under docs/**)
# failing for however long it took the daily job to catch up.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write   # the mirror lands through the auto-merging PR, not a push to main

# Serialised: two runs racing on the same branch would force-push over one another, and two runs
# racing on the same file is how this repository previously landed a conflicted data commit.
concurrency:
  group: mirror-node-counter
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # A job with no bound holds its runner until the platform default (six hours).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # `persist-credentials: false`, because `land_change.py` supplies its own: it pushes
          # `https://x-access-token:<PAT>@…`, and the checkout's stored token takes precedence over
          # the URL — so the branch went out as `github-actions[bot]` and every run on its pull request
          # came back `action_required`: held, never executed, with nothing able to satisfy the required
          # checks, so the self-merging PR could not merge. Measured 2026-09-25: 39 held runs on
          # `bot/release-version-sync`, 24 on `bot/build-feed`, and the version-sync PR stuck.
          persist-credentials: false

      - name: Read the live counter into data/counter.json
        # Fails loudly instead of writing a bad number: the script refuses a payload that is
        # behind the file (a KV read failure makes the endpoint fall back to its GitHub copy)
        # and refuses a malformed one.
        run: python3 scripts/node_status.py --mirror

      - name: Refresh every surface that quotes it
        run: python3 scripts/sync_lesson_count.py

      - name: Land the mirror through a pull request that merges itself
        # Was `git push` — refused since 2026-09-22 by the ruleset on `main`, which requires three
        # status checks on any commit that lands there and exempts nobody: run 35843302110 died
        # here on 2026-09-23 after the two steps above had read the live counter successfully, so
        # the number the endpoint served was dropped on the floor. See
        # docs/maintainer/automation-lands-via-pr.md.
        #
        # `land_change.py` stages **everything** the two scripts just changed, not a hand-written
        # list of paths. The list used to be `data/counter.json docs/llms.txt
        # docs/.well-known/llms.txt`, which silently threw away the README tables the refresh step
        # had just corrected: the counter moved to 357 while README.zh-CN.md and README.ja.md
        # stayed at 333, so `sync_lesson_count.py --check` (and `test_lesson_count_ssot.py`)
        # failed on main for every PR opened afterwards — found 2026-09-19 on PR #1859.
        #
        # A run with nothing to mirror opens no pull request and still exits 0, so a quiet day is
        # not a red job.
        env:
          # `SHELDON_PAT`, never `GITHUB_TOKEN`: a branch pushed with `GITHUB_TOKEN` starts no
          # workflow runs, so the required checks would never report and the auto-merge below would
          # wait forever. `.github/workflows/auto-merge-docs.yml` documents the third time this
          # repository paid for that.
          GH_TOKEN: ${{ secrets.SHELDON_PAT }}
        run: |
          python3 scripts/ci/land_change.py \
            --branch bot/sync-node-counter \
            --title "chore(data): mirror the live node counter and its surfaces" \
            --note "The mirror of the live KV counter, plus every public surface that quotes it."
