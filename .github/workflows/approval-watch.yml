name: Approval Watch

# Eight workflows sit behind the `release` environment, whose only required reviewer is the owner, and
# nothing tells anyone when one of them starts waiting. Measured 2026-09-27: three runs waited on one person
# in a single day (the worker deploy plus two npm publishes), one of them for ~23 hours; the health snapshot
# recorded the same shape on 2026-09-21, a run waiting since 12:13Z with no notification anywhere.
#
# The obvious "fix" — move the deploy credential to an environment without a required reviewer — was tried
# and rejected by this repository's own gate (`tests/test_secret_scoping.py`): the deploy-capable credential
# belongs behind a reviewer, because the workflow file itself is editable by anyone who can merge, and
# required status checks do not review intent. So the liveness problem is solved here instead: make the wait
# *visible*, which changes no credential scoping at all.
#
# What this does NOT do: it never approves anything. An automation that approves deployments would defeat the
# approval it is reporting on (`tests/test_approval_watch.py` asserts the absence of that call).
on:
  schedule:
    # Twice an hour. The point is that a wait is noticed within minutes rather than the next time someone
    # happens to look at the Actions tab.
    - cron: "17,47 * * * *"
  # …and the cron is only the backstop, because it is the one part of this workflow nothing can test and
  # the part that failed. Measured 2026-09-29: this workflow ran **once** in ~9 hours against `17,47`
  # (five consecutive slots with no run created at all), while other `schedule` workflows in this
  # repository fired normally — GitHub drops scheduled events under load, and this repository runs a lot
  # of CI. So the watch also listens for the runs themselves: `requested` fires the moment a run is
  # created, which is exactly when it may start waiting.
  workflow_run:
    # By `name:`, because that is what GitHub matches on. The list must name every workflow that declares
    # `environment: release`; `tests/test_approval_watch.py` derives that set from the workflow files and
    # fails if this one stops covering it (or names something that does not exist).
    workflows:
      - "Apply D1 schema"
      - "CF diagnostics"
      - "D1 Bootstrap (PRD ④)"
      - "D1 counters report"
      - "Deploy Cloudflare Worker"
      - "Intake Pipeline Test (PRD ③)"
      - "Publish @misaka-net/fatal-guard"
      - "Publish @misaka-net/misakanet-setup"
      # "Publish misakanet" left this list on 2026-09-30 (intake #2486, D1 = A): it publishes from the
      # reviewer-free `npm-release` environment now, so it no longer waits for a person and there is
      # nothing for this watcher to make visible. If that environment ever regains required reviewers,
      # the name comes back here — the rule's other direction checks exactly that
      # (tests/test_approval_watch.py computes the cohort from the workflows that declare `release`).
    types: [requested]
  workflow_dispatch:

permissions:
  contents: read
  actions: read          # list workflow runs
  issues: write          # keep one tracking issue up to date

concurrency:
  group: approval-watch
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List runs waiting for approval and update the tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const LABEL = 'approval-watch';
            const TITLE = 'Runs waiting for approval';
            const waiting = (await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, status: 'waiting', per_page: 100,
            })).filter(r => r.status === 'waiting');

            const lines = waiting.length
              ? waiting.map(r => `- **${r.name}** — waiting since ${r.created_at} — ${r.html_url}`).join('\n')
              : '_Nothing is waiting for approval right now._';
            const age = waiting.map(r => (Date.now() - Date.parse(r.created_at)) / 3600000);
            const oldest = age.length ? Math.max(...age).toFixed(1) : '0';
            const body = [
              '<!-- approval-watch -->',
              `Updated ${new Date().toISOString()} by \`approval-watch.yml\`.`,
              '',
              `**${waiting.length}** run(s) waiting for approval; oldest **${oldest} h**.`,
              '',
              lines,
              '',
              'Approve at Actions → the run → “Review pending deployments”, or on the environment page:',
              `https://github.com/${context.repo.owner}/${context.repo.repo}/deployments/activity_log?environments_filter=release`,
            ].join('\n');

            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const existing = open.find(i => i.title === TITLE && !i.pull_request);

            // A body edit notifies nobody. This is the half that was missing, and it is why the
            // three freezes recorded in handoff-2026-10-05 §5.1/§5.2b were each found by a human
            // noticing a symptom instead of by this watcher: the body of #2416 was accurate and
            // timely every single time — it fired `workflow_run: requested` at 2026-10-04T09:57Z,
            // the exact second that run started waiting — and nobody was told. GitHub notifies
            // issue *subscribers* on a new comment, not on an edit, so a tracker that only edits
            // is a tracker that has to be visited on purpose.
            //
            // So: comment when the set of waiting runs *changes*, and on a staleness threshold, so
            // a wait that nobody acts on still escalates instead of sitting there being edited.
            // The body stays the full current state (one issue, no comment spam) — this is the
            // push, not the record.
            const fingerprint = waiting.map(r => `${r.id}`).sort().join(',');
            const newestId = waiting.length ? Math.max(...waiting.map(r => r.id)) : 0;
            const previous = existing ? (existing.body.match(/<!-- approval-watch:seen=(\S*) -->/) || [])[1] : undefined;
            const THRESHOLD_H = 6;
            const oldestOverThreshold = waiting.length && Number(oldest) >= THRESHOLD_H;
            const shouldComment = Boolean(existing) && (
              previous !== fingerprint
              || (oldestOverThreshold && previous !== `stale:${fingerprint}`)
            );

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                body: body.replace('<!-- approval-watch -->',
                  `<!-- approval-watch -->\n<!-- approval-watch:seen=${waiting.length && oldestOverThreshold ? `stale:${fingerprint}` : fingerprint} -->`),
              });
              core.info(`updated #${existing.number}`);
              if (shouldComment) {
                const headline = previous === undefined || previous === ''
                  ? 'First observation of a waiting run.'
                  : previous === fingerprint
                    ? `Still waiting — now **${oldest} h** old, past the ${THRESHOLD_H} h line.`
                    : 'The set of waiting runs changed.';
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                  body: [
                    `🔔 **approval-watch** — ${headline}`,
                    '',
                    `**${waiting.length}** run(s) waiting; oldest **${oldest} h**.`,
                    '',
                    ...waiting.map(r => `- **${r.name}** — waiting since ${r.created_at} — ${r.html_url}`),
                    '',
                    'Approve here: https://github.com/'
                      + `${context.repo.owner}/${context.repo.repo}/deployments/activity_log?environments_filter=release`,
                  ].join('\n'),
                });
                core.info(`commented on #${existing.number} (newest run ${newestId || 'none'})`);
              }
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title: TITLE,
                body: body.replace('<!-- approval-watch -->',
                  `<!-- approval-watch -->\n<!-- approval-watch:seen=${fingerprint} -->`),
                labels: [LABEL],
              });
              core.info(`created #${created.data.number}`);
            }
            // An annotation, so a waiting run shows up in the Actions tab too, not only in the issue.
            if (waiting.length) {
              core.warning(`${waiting.length} run(s) waiting for approval, oldest ${oldest} h: `
                + waiting.map(r => r.name).join(', '));
            } else {
              core.info('nothing waiting');
            }
