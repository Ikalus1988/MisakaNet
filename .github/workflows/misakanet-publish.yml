name: Publish misakanet

# The root package is the *plugin / skill* channel (DSH plugin, Codex plugin manifest,
# skills/misakanet/SKILL.md). The MCP installer for Claude Code / Codex is a separate
# package: @misaka-net/misakanet-setup, published by misakanet-setup-publish.yml.
#
# Until now nothing published this package at all - the registry copy sat at 2.23.0 while the
# repo moved to 2.30.x, because the only publish path was a human running npm by hand.

on:
  push:
    tags:
      - "misakanet-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check and show the tarball, but do not publish"
        type: boolean
        default: true
      version:
        description: >-
          Release version to publish (e.g. 2.31.0). Passing this is what the release flow does: the
          npm bundle line is moved to this version in the working tree, the package is published, and
          the bump is committed back — so `package.json` keeps meaning "the version that is on npm".
          A run with this input set publishes even when dry_run is true; the `release` environment's
          required reviewer is the human gate.
        type: string
        required: false

permissions:
  contents: write      # the published version is committed back to `package.json` (see the last step)

jobs:
  publish:
    # Secrets live in the `release` environment, not at repository level: they are publish and
    # deploy credentials, and environment secrets can carry protection rules — a branch policy today,
    # and "required reviewers" as soon as it is switched on, which is what stops a workflow that has
    # been edited on a branch from using them without a person approving the run.
    environment: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # The npm bundle line (`package.json`) deliberately lags the repository release line: a test
      # enforces that it may be behind but never ahead, because it means "the version that is on npm",
      # not "the version this checkout is". So publishing a new version means *moving* that line, and
      # the release flow cannot do it (it runs before the publish, and the publish can still be refused
      # by the reviewer). Running the alignment here is what the old error message asked a human to do
      # by hand — see `scripts/align_versions.py --source`, whose own help says the same thing.
      - name: Move the npm line to the version being published
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/align_versions.py --source "$VERSION"
          ACTUAL=$(node -e "console.log(require('./package.json').version)")
          [ "$ACTUAL" = "$VERSION" ] || {
            echo "::error::package.json says $ACTUAL after aligning to $VERSION - refusing to publish."
            exit 1
          }
          echo "npm line: $ACTUAL"

      # A tag that disagrees with package.json would publish a version nobody intended, and
      # npm does not let you take it back.
      - name: Version must match the tag
        run: |
          PKG_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "package.json: $PKG_VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#misakanet-v}"
            echo "tag: $TAG_VERSION"
            [ "$PKG_VERSION" = "$TAG_VERSION" ] || {
              echo "::error::tag $GITHUB_REF_NAME says $TAG_VERSION but package.json says $PKG_VERSION"
              echo "::error::fix with: python3 scripts/align_versions.py --source $TAG_VERSION"
              exit 1
            }
          fi

      - name: Verify zero runtime dependencies
        run: |
          DEPS=$(node -e "const p=require('./package.json');console.log(p.dependencies?Object.keys(p.dependencies).length:0)")
          echo "runtime dependencies: $DEPS"
          [ "$DEPS" = "0" ] || { echo "FAIL: this package must stay dependency-free"; exit 1; }

      - name: Show the tarball that would be published
        run: npm pack --dry-run

      # Same diagnostics as the setup package: a 401 here means the token is expired (npm
      # tokens default to 90 days), not that it lacks permissions - say so instead of leaving
      # a bare "PUT 404".
      - name: Check npm identity
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is empty - set it to a token that can publish this package."
            exit 1
          fi
          if ! ACCOUNT=$(npm whoami 2>/tmp/whoami.err); then
            echo "::error::npm rejected NPM_TOKEN (npm whoami failed)."
            sed 's/^/    /' /tmp/whoami.err | head -5
            echo "::error::A rejected token is usually expired; create a new automation token and"
            echo "::error::update the NPM_TOKEN repository secret."
            exit 1
          fi
          echo "account: $ACCOUNT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        id: publish
        if: github.event_name == 'push' || inputs.dry_run == false || inputs.version != ''
        run: |
          set +e
          npm publish --access public
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::npm publish failed (exit $RC)."
          fi
          exit $RC
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Record what was published, so the next reader of `package.json` sees the truth without running
      # anything. Before this step existed the line moved only when a human remembered to run
      # `align_versions.py --source`, which is how it sat at 2.30.2 through the 2.31.0 release — the
      # same "one fact, no writer" shape as the lesson counts. Idempotent: nothing to record, nothing
      # happens.
      - name: Record the published version on main
        if: steps.publish.outcome == 'success' && inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.SHELDON_PAT || secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "package.json already records $VERSION - nothing to record."
            exit 0
          fi
          OTHER=$(git diff --name-only | grep -vE '^(package.json|.codex-plugin/plugin.json|workers/register-proxy-sw.js)$' || true)
          if [ -n "$OTHER" ]; then
            echo "::warning::align_versions also changed: $OTHER (the record PR carries every tracked change)"
          fi

          # Through a pull request, not a direct push. `main` requires three status checks, the ruleset
          # has no bypass actors, and GitHub enforces that rule on *direct pushes* too: on 2026-09-22
          # this step was refused five times ("3 of 3 required status checks are expected") **after** a
          # publish that had already succeeded. The version record is bookkeeping, so it travels the way
          # every other change does. That also removes the old race against `main` moving during a
          # publish — a PR is rebased by the merge, not by this step.
          BRANCH="chore/record-$VERSION"
          git config user.name "misakanet-bot"
          git config user.email "bot@misakanet.dev"
          git checkout -b "$BRANCH"
          git add -u
          git commit --signoff -m "chore(npm): misakanet@$VERSION is published"

          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          EXISTING=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty' || true)
          if [ -n "$EXISTING" ]; then
            echo "record PR #$EXISTING is already open for $VERSION"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(npm): record misakanet@$VERSION as published" \
              --body "$(printf '%s\n' \
                "The npm publish of \`$VERSION\` succeeded, so \`package.json\` — and the surfaces" \
                "\`align_versions.py\` keeps in step with it — must move to it, or npm and the repository" \
                "disagree, which is the drift this step exists to prevent." \
                "" \
                "It arrives as a pull request because \`main\` requires three status checks with no bypass" \
                "actors, and GitHub enforces that on direct pushes too: the first attempt was refused with" \
                "\`3 of 3 required status checks are expected\` after the package was already published." \
                "" \
                "Computed by the repository's own tool: \`python3 scripts/align_versions.py --source $VERSION\`." \
                "" \
                "## AC" \
                "" \
                "- [x] \`package.json\` records the version that is on npm" \
                "- [x] the same version reaches \`.codex-plugin/plugin.json\` and the worker's \`serverInfo\`" \
                "- [x] \`align_versions.py --check\` passes in CI")"
          fi

      # Its own step, so it can run on failure: the publish step above is the one that must not fail
      # silently, and this one exists to say which half of the job succeeded.
      - name: The record did not land (summary)
        if: failure() && steps.publish.outcome == 'success'
        run: |
          # Deliberately a failure, not a warning: npm does not allow republishing a version, so the
          # repository has to catch up, and a silent drift is the defect this whole step exists to stop.
          # The summary says the part a human needs first — the package *is* published.
          {
            echo "### npm publish succeeded, but the version record did not land"
            echo ""
            echo "\`misakanet@${{ inputs.version }}\` **is published** — npm does not allow republishing a version."
            echo "\`package.json\` still records the previous one. The record PR could not be opened."
            echo ""
            echo "Fix by hand: \`python3 scripts/align_versions.py --source ${{ inputs.version }}\`, then commit on a branch and open a PR."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.version == ''
        run: |
          echo "dry_run: all checks passed, nothing was published." >> "$GITHUB_STEP_SUMMARY"
          echo "To publish: push a tag (git tag misakanet-v\$(node -p \"require('./package.json').version\")), or re-run this workflow with dry_run=false." >> "$GITHUB_STEP_SUMMARY"
