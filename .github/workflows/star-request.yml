name: Star Request

on:
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  star-request:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Post star request comment
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            // context.eventName, not the module-level spelling: github-script hands this body
            // the @actions/github module, whose context carries camelCase properties. The old
            // spelling read undefined, so the PR branch below never won and every PR got the
            // "thanks for the review" wording (found by tests/test_workflow_gh_script_contexts.py
            // while fixing the same class of bug in pr-thank-you.yml, 2026-09-15).
            const body = context.eventName === 'pull_request'
              ? '🎉 Thank you for opening this PR! If you find MisakaNet helpful, please consider leaving a ⭐ Star on the repository. It means a lot to our community and helps us review contributions faster!'
              : '🎉 Thank you for the review! If you find MisakaNet helpful, please consider leaving a ⭐ Star on the repository. It helps us grow!';

            // Check if we already commented (avoid spam)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const alreadyCommented = comments.data.some(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('⭐ Star')
            );

            if (!alreadyCommented) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
