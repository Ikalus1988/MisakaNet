name: PR Quality Gate

# Runs after CI checks complete to apply quality labels.
#
# ── the two guards on the job `if:` (measured 2026-10-02T04:50–05:10Z) ───────────────────────────
#
# `check_run: [completed]` fires for *every* check run in the repository, and that includes the
# `quality-labels` check run this job itself creates. On the tip of `main` (`dedc383b`) — a commit
# nobody pushed to during the whole window — that made the workflow its own trigger:
#
#     run → `quality-labels` check run completes → check_run event → run → …
#
# Nineteen of the twenty-one runs in one hour were `check_run` events with `head_branch: main` and
# `pull_requests: []`, i.e. every one of them paid for a runner in order to compute a pull-request
# number the event did not carry, and returned (the github-script body already starts with
# `if (!prs || prs.length === 0) return;`). The loop is the reason this file was the ring's
# second-largest runner consumer: 19–21 real jobs per 20 minutes, none of which could do any work.
#
# So the `if:` carries the two edges that made the loop: a check run named `quality-labels` no longer
# starts this workflow (the edge that closes the cycle), and a check run with no attached pull request
# no longer starts it either (the edge that bought nothing — same semantics as the early return, one
# level earlier). Both remaining triggers still work exactly as before.
on:
  check_run:
    types: [completed]
  pull_request:
    types: [synchronize]

permissions:
  pull-requests: write
  issues: write

# `quality-labels` is not one of the four checks `main`'s ruleset requires (`DCO / Signed-off-by`,
# `test (ubuntu-latest, 3.11)`, `gate`, `audit`), and the whole job is a pure function of facts fetched
# fresh from the API on every run. So the newest run is strictly better than the one it replaces —
# cancelling an older evaluation cannot lose a verdict, only a stale one, because the label set is
# recomputed from scratch and only the newest answer is still true.
concurrency:
  group: pr-quality-gate-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number || github.sha }}
  cancel-in-progress: true

jobs:
  quality-labels:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      || (github.event.check_run.name != 'quality-labels'
          && github.event.check_run.pull_requests[0].number != null)
    steps:
      - name: Apply quality gate labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            // Get the PR number from context
            let prNumber;
            if (context.eventName === 'check_run') {
              const prs = context.payload.check_run.pull_requests;
              if (!prs || prs.length === 0) return;
              prNumber = prs[0].number;
            } else {
              prNumber = context.payload.pull_request.number;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Get PR details
            const pr = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });

            // Get all check runs for the PR head
            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              { owner, repo, ref: pr.data.head.sha, per_page: 100 }
            );

            const allPassed = checkRuns.every(cr =>
              cr.conclusion === 'success' || cr.conclusion === 'skipped' || cr.conclusion === 'neutral'
            );
            const anyFailed = checkRuns.some(cr => cr.conclusion === 'failure');
            const allComplete = checkRuns.every(cr => cr.status === 'completed');

            // DCO truth comes from the check run, not the (sometimes stale)
            // needs-dco label. The label is cleared on pass (issue #1498);
            // it only acts as a guard when no DCO run exists yet.
            const dcoRun = checkRuns.find(cr =>
              cr.name === 'DCO / Signed-off-by' || cr.name === 'dco'
            );
            const dcoOk = dcoRun &&
              ['success', 'skipped', 'neutral'].includes(dcoRun.conclusion);

            const existing = pr.data.labels.map(l => l.name);
            const toAdd = [];
            const toRemove = [];

            // needs-rebase: has merge conflicts
            if (pr.data.mergeable === false) {
              toAdd.push('needs-rebase');
            } else {
              toRemove.push('needs-rebase');
            }

            // ready-to-merge: ALL gates must pass
            const gateBlocked =
              !allComplete || anyFailed || !allPassed ||       // checks
              pr.data.mergeable === false ||                   // conflicts
              existing.includes('shape-risk') ||               // shape
              existing.includes('destructive-rewrite') ||      // destructive
              existing.includes('generated-file') ||           // needs confirm
              (dcoRun ? !dcoOk : existing.includes('needs-dco')); // DCO missing signoff

            if (!gateBlocked && pr.data.mergeable === true) {
              toAdd.push('ready-to-merge');
            } else {
              toRemove.push('ready-to-merge');
            }

            // needs-dco lifecycle driven by the DCO check run: clear on pass,
            // (re)apply on fail — never left stale (issue #1498).
            if (dcoOk) {
              toRemove.push('needs-dco');
            } else if (dcoRun) {
              toAdd.push('needs-dco');
            }

            // Apply — label writes can 403 on fork-PR check_run events where
            // the token is read-only (issue "quality-labels 403"); treat as
            // best-effort noise like removeLabel below, never fail the job.
            const uniqueAdd = toAdd.filter(l => !existing.includes(l));
            const uniqueRemove = toRemove.filter(l => existing.includes(l));

            if (uniqueAdd.length > 0) {
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: prNumber, labels: uniqueAdd });
              } catch (e) {
                console.log(`Skipping label add ${uniqueAdd.join(',')} (fork PR read-only run):`, e.message);
              }
            }
            for (const label of uniqueRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: prNumber, name: label });
              } catch (e) {}
            }
