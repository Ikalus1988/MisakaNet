name: Nightly Mirror Consistency

on:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: nightly-mirror-consistency
  cancel-in-progress: false

jobs:
  check:
    name: Compare lessons mirror
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Check data/docs mirror
        run: python3 .github/scripts/check_mirror_consistency.py
