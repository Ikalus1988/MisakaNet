name: Search MisakaNet on CI Failure

on:
  workflow_run:
    # NOT `["*"]`. A wildcard starts this workflow on the completion of every other workflow —
    # 33,317 runs by 2026-09-17, and the recent ones are all `skipped` (the job-level `if` below
    # can only filter *after* the run has been created, so it saves nothing). The feature is "our
    # CI failed, so surface the lessons that match": that is the Cross-Platform Tests workflow.
    # Add another name here if a failure elsewhere should also be searched — see
    # tests/test_workflow_triggers.py, which keeps the wildcard out.
    workflows: ["Cross-Platform Tests"]
    types: [completed]

  # `workflow_dispatch` is here so this path can be *verified*, not for convenience.
  #
  # Measured 2026-09-21: this workflow had run 100 times and executed its steps **zero** times. Its
  # only entry was `workflow_run` on a failing `Cross-Platform Tests`, and that workflow is 100/100
  # success — so the capability "our CI failed, surface matching lessons" had never been exercised,
  # and the only way to exercise it was to break CI on purpose. A path nobody can trigger is not a
  # tested path (#1984); the same reasoning put `workflow_dispatch` on `intake-bot-demo.yml`.
  workflow_dispatch:
    inputs:
      error:
        description: 'Error text to search (empty = scrape the most recent failing Cross-Platform Tests run)'
        required: false
        default: ''
      pr-number:
        description: 'PR to comment on (testing aid; empty = no comment, the decision is still printed)'
        required: false
        default: ''

jobs:
  search-lessons:
    # The dispatch arm is what makes the automatic arm testable. Both take the same code path below:
    # the manual run only replaces *where the error text comes from*.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `actions: read` is the scope that lets this job read the *job logs* of the run that failed.
      # Without it the read is refused, and the refusal used to be swallowed by an empty `catch`
      # — so a failing matrix produced no signature, both downstream steps were skipped, and the
      # workflow reported success. Measured 2026-10-26: every run of this path behaved that way
      # (rerun attempt 2 of run 40271288490 reproduced it), and the token's own permission block
      # printed `Contents: read / Metadata: read / PullRequests: write` with no `Actions` at all.
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout MisakaNet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: Ikalus1988/MisakaNet

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install misakanet-core

      - name: Get failure context
        id: context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          # Passed through env rather than interpolated into the script: an Actions expression inside a
          # `github-script` body is substituted by the workflow engine *before* node sees it, so a
          # value containing a quote would edit the program (tests/test_workflow_gh_script_contexts.py
          # is the rule that keeps this shape out).
          MANUAL_ERROR: ${{ github.event.inputs.error || '' }}
          MANUAL_PR: ${{ github.event.inputs['pr-number'] || '' }}
          # The trigger's verdict and its branch, as *workflow* expressions. They cannot be read
          # inside the script body: `github.event` does not exist there (#1685), and an expression
          # written inside a `script: |` is substituted by the engine before node sees it.
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        with:
          script: |
            const run = context.payload.workflow_run || null;
            const manualError = (process.env.MANUAL_ERROR || '').trim();
            const manualPr = (process.env.MANUAL_PR || '').trim();
            const triggerConclusion = (process.env.TRIGGER_CONCLUSION || '').trim();
            const triggerBranch = (process.env.TRIGGER_BRANCH || '').trim();

            let prNumber = manualPr ? parseInt(manualPr, 10) : null;
            let runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let runName = 'manual dispatch';
            // Defaults to *silent* for the manual path: a dispatch has no `workflow_run` payload to
            // read the head repository from, and this workflow's own contract is that fork PRs never
            // get the intake note (:131, :204). Assuming 'true' would have posted a maintainer note on
            // a fork PR whenever someone dispatched this with a `pr-number`.
            let isSameRepo = 'false';
            let errorSignatures = [];
            // A log we could not read is a fact, not a detail: "we were not allowed to look" and
            // "there was nothing to report" have to be told apart, or the capability is blind and
            // reports itself as silent (#1825, #1984).
            let readFailures = [];
            let jobsSeen = 0;

            if (manualError) {
              // The manual path does not scrape logs: the caller supplied the error text, which is the
              // only thing the search needs. This is what makes the capability verifiable in seconds.
              errorSignatures = [manualError];
            } else if (run) {
              const prs = run.pull_requests || [];
              if (prNumber === null && prs.length > 0) prNumber = prs[0].number;

              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                // `latest` and `all` are the only values this endpoint knows. `failed` — the value
                // this used to pass — is not one of them, so the API ignored it and returned every
                // job of every attempt. `latest` is the one that means "the attempt being judged".
                filter: 'latest'
              });
              jobsSeen = jobs.jobs.length;

              for (const job of jobs.jobs) {
                try {
                  const { data: logs } = await github.rest.actions.downloadJobLogsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    job_id: job.id
                  });

                  // Extract error lines (last 50 lines, filter for errors)
                  const lines = logs.split('\n');
                  errorSignatures.push(...lines
                    .filter(l => /error|fail|exception|traceback/i.test(l))
                    .slice(-10));
                } catch (e) {
                  // Recorded, not swallowed: an empty `catch` here is what made this capability
                  // look like it worked while reading nothing at all. The message says which job
                  // and why, so the next reader does not have to guess.
                  readFailures.push(`${job.name}: ${e.message}`);
                }
              }

              runUrl = run.html_url;
              runName = run.name || 'CI';
              // same-repo failures may surface "novel intake" notes; fork PRs stay quiet
              const headRepo = (run.head_repository || {}).full_name || '';
              // `context.repo` is `{owner, repo}` — it has no `full_name` (@actions/github's
              // Context.repo). Comparing against `context.repo.full_name` compared the head repo
              // with `undefined`, so this was always false, `is_same_repo` was always 'false', and
              // the `decision == 'intake'` branch of the comment step could never fire: the path
              // read the logs, reached a decision, and still posted nothing (measured 2026-10-26).
              isSameRepo = headRepo === `${context.repo.owner}/${context.repo.repo}` ? 'true' : 'false';

              // The PR number is where the note goes — without it there is nowhere to put it, and
              // the run would end as a search nobody sees. `workflow_run.pull_requests` is not
              // populated in every payload shape, so the branch the run was made from is the
              // fallback, and a branch that no longer has an open PR simply finds nothing.
              if (prNumber === null && triggerBranch) {
                try {
                  const { data: found } = await github.rest.pulls.list({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: 'open',
                    head: `${context.repo.owner}:${triggerBranch}`
                  });
                  if (found.length > 0) prNumber = found[0].number;
                } catch (e) {
                  readFailures.push(`PR lookup by branch ${triggerBranch}: ${e.message}`);
                }
              }
            } else {
              // A dispatch with no error text and no failing run to look at: say so, and let the steps
              // below no-op on an empty signature rather than inventing one.
              core.notice('Nothing to search: no error input and no failing Cross-Platform Tests run found.');
            }

            // What this run actually saw, before anything decides what happens next. A green run is
            // not evidence unless something in it can differ (#1984), so the difference is written
            // down where a reader will find it.
            core.info(`ci-lesson-search: run=${runName} (${runUrl}) jobs=${jobsSeen} signatures=${errorSignatures.length} pr=${prNumber || 'none'} read-failures=${readFailures.length}`);
            for (const failure of readFailures) {
              core.info(`ci-lesson-search: could not read ${failure}`);
            }

            // A trigger that failed and a capability that read nothing is not "nothing to say" — it
            // is a capability that cannot see. It says so, and the run goes red, because a green run
            // here reads as "the CI failure was looked at and needed no lesson", which is the one
            // thing that was never established.
            if (triggerConclusion === 'failure' && errorSignatures.length === 0) {
              if (readFailures.length > 0 || jobsSeen === 0) {
                core.setFailed(`the triggering run failed, but no error text could be read from it (${jobsSeen} job(s), ${readFailures.length} read failure(s)) — this capability is blind, not silent`);
              } else {
                core.warning(`the triggering run failed and its logs were read, but they hold no error line — nothing to search, and no lesson was suggested`);
              }
            }

            core.setOutput('pr_number', prNumber ? String(prNumber) : '');
            core.setOutput('error_signatures', errorSignatures.join('\n').slice(0, 2000));
            core.setOutput('run_url', runUrl);
            core.setOutput('run_name', runName);
            core.setOutput('is_same_repo', isSameRepo);

      # v1.0 (PR #1539) + v1.0.1: 决策交给 intake-bot。
      # 评论策略（真实提效 + 低打扰）：
      #   hit    → 帮助式建议（@作者 + 修复线索 + 反馈入口）——所有人可见的"帮忙"
      #   intake → 仅当失败属于**本仓库**且为新颖高信号时，提示可收录（维护者侧提效）
      #   ignore → 静默；fork PR 的 intake 候选也静默（避免打扰外部贡献者）
      - name: Run intake-bot v1.0 decision
        if: steps.context.outputs.error_signatures != ''
        id: intake
        run: |
          # `$ERROR_SIGNATURES`, which is the name this step declares below. It said `$ERROR_SIG`
          # until 2026-09-21 — an undefined variable is the empty string, so the log file was one
          # newline, `intake_bot.py` answered `{"decision":"ignore","reason":"错误签名过短"}`, the
          # comment step was skipped, and the run stayed green. The dispatch added the same day
          # "verified" exactly that nothing: the path could be triggered and still produced
          # nothing. A green run is not evidence unless something in it can differ (#1984).
          printf '%s\n' "$ERROR_SIGNATURES" > /tmp/ci_error.log
          # `|| echo '{"decision":"error","reason":"bot failed"}'` used to stand here, and that is the
          # shape #1825 was about: a crash became a *constant payload*, the comment step parsed
          # `decision: 'error'`, fell through to `return;`, and the run stayed green with nothing
          # posted. A bot that cannot run and a bot that found nothing must be distinguishable — so the
          # failure is reported with its own stderr and the step goes red.
          set +e
          RESULT=$(python3 scripts/intake_bot.py --log /tmp/ci_error.log --json \
            --source ci-lesson-search 2>/tmp/intake_bot.err)
          BOT_EXIT=$?
          set -e
          if [ "$BOT_EXIT" -ne 0 ]; then
            echo "--- intake_bot.py stderr (tail) ---"
            tail -n 20 /tmp/intake_bot.err
            echo "::error title=intake-bot failed::exit $BOT_EXIT — this run could not decide, and says so instead of posting nothing"
            exit 1
          fi
          DECISION=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('decision','unknown'))")
          echo "decision=$DECISION"          # observable in run logs (dogfood)
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$RESULT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
        env:
          ERROR_SIGNATURES: ${{ steps.context.outputs.error_signatures }}

      - name: Comment lesson suggestion on PR
        if: steps.context.outputs.pr_number != '' &&
            (steps.intake.outputs.decision == 'hit' ||
             (steps.intake.outputs.decision == 'intake' && steps.context.outputs.is_same_repo == 'true'))
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        env:
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          INTAKE_RESULT: ${{ steps.intake.outputs.result }}
          RUN_URL: ${{ steps.context.outputs.run_url }}
          RUN_NAME: ${{ steps.context.outputs.run_name }}
        with:
          script: |
            const res = JSON.parse(process.env.INTAKE_RESULT || '{}');
            const prNumber = parseInt(process.env.PR_NUMBER);
            const lesson = res.lesson || {};

            let body = '';
            if (res.decision === 'hit' && lesson.id) {
              body = [
                `## 💡 MisakaNet: this failure may already be solved`,
                ``,
                `CI failed in [${process.env.RUN_NAME}](${process.env.RUN_URL}). A MisakaNet lesson matches this error:`,
                ``,
                `### ${lesson.title || lesson.id}`,
                `- **Similarity**: ${lesson.sim || '?'}`,
                `- **Lesson**: [${lesson.id}](${lesson.url || '#'})`,
                ``,
                `> ⚠️ suggest-only（仅供参考）——请人工核对后再采用修复思路。`,
                ``,
                `如果这条建议帮到了你，点个 👍 让我们知道；没帮到请回复，我们会改进。`,
              ].join('\n');
            } else if (res.decision === 'intake') {
              body = [
                `## 📥 MisakaNet: novel failure detected (maintainer note)`,
                ``,
                `CI failed in [${process.env.RUN_NAME}](${process.env.RUN_URL}). intake-bot 未找到对应课程——`,
                `这是一个**新颖且高信号**的失败（已通过去重/噪音闸）。`,
                ``,
                `如需沉淀为课程，可：`,
                `- 本地 dry-run 预览：\`python3 scripts/intake_bot.py --error "<该错误>" --json\``,
                `- 或由维护者手动收录（本 bot 默认不自动提交，避免噪音）`,
                ``,
                `> 本条只出现在**本仓库**失败上，不会打扰 fork 贡献者。`,
              ].join('\n');
            } else {
              return;
            }
            body += '\n\n---\n_Powered by intake-bot v1.0.1. To disable, remove ci-lesson-search.yml._';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body
            });
