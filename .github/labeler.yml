# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**/*', 'README.md', 'ROADMAP.md', 'CONTRIBUTING.md']

# Bug fixes
bug:
  - head-branch: ['^fix/']
  - title: ['^fix', '^bug']

# Features
enhancement:
  - head-branch: ['^feat/']
  - title: ['^feat', '^feature']

# Performance
performance:
  - head-branch: ['^perf/']
  - title: ['^perf', '^performance']

# Tests
tests:
  - changed-files:
      - any-glob-to-any-file: ['tests/**/*', '**/*test.rs']
