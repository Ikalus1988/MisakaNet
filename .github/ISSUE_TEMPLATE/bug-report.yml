name: Bug Report
description: Report a bug or issue
title: "bug: "
# `scope:repo` is automatic here, not a judgement: a bug report against this repository is,
# by definition, work in this repository. The label is triage-applied elsewhere
# (docs/maintainer/intake-triage.md has the contract).
labels: ["bug", "scope:repo"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
  - type: textarea
    id: logs
    attributes:
      label: Error messages / logs
      render: shell
