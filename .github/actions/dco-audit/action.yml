name: DCO Audit
description: |
  Verify Developer Certificate of Origin (Signed-off-by) on all commits
  in a PR range. Posts a structured remediation comment on failure.

inputs:
  base-sha:
    description: "Base branch SHA (github.event.pull_request.base.sha)"
    required: true
  head-sha:
    description: "Head branch SHA (github.event.pull_request.head.sha)"
    required: true
  token:
    description: "GitHub token with pull-requests: write scope"
    required: true
  repo:
    description: "Repository (default: Ikalus1988/MisakaNet)"
    required: false
    default: "Ikalus1988/MisakaNet"
  pr-number:
    description: "PR number (optional). If set, posts a comment on failure."
    required: false
    default: ""

outputs:
  dco-passed:
    description: "true if all commits are signed off, false otherwise"
    value: ${{ steps.scan.outputs.dco_passed }}
  failed-commits-log:
    description: "Newline-separated log of failed commits (sha | subject | author)"
    value: ${{ steps.scan.outputs.failed_commits_log }}
  failed-count:
    description: "Number of commits without sign-off"
    value: ${{ steps.scan.outputs.failed_count }}

runs:
  using: composite
  steps:
    - name: Scan DCO
      id: scan
      shell: bash
      run: |
        BASE_SHA="${{ inputs.base-sha }}"
        HEAD_SHA="${{ inputs.head-sha }}"
        FAILED_LOG=""
        FAILED_COUNT=0

        echo "=== DCO Audit ==="
        echo "  Range: ${BASE_SHA:0:7}..${HEAD_SHA:0:7}"

        while read -r sha; do
          [ -z "$sha" ] && continue
          msg=$(git log -1 --format="%B" "$sha")
          author_email=$(git log -1 --format="%ae" "$sha")
          author_name=$(git log -1 --format="%an" "$sha")
          subject=$(git log -1 --format="%s" "$sha")

          if ! echo "$msg" | grep -qE "Signed-off-by: .* <.*>"; then
            # A real newline, not the two characters `\n`: the comment step prints this value into the
            # contributor's receipt, and `echo` renders a literal `\n` as backslash-n — so every
            # offender used to arrive on one unreadable line.
            FAILED_LOG="${FAILED_LOG}${sha:0:7} | ${subject} | ${author_name} <${author_email}>"$'\n'
            FAILED_COUNT=$((FAILED_COUNT + 1))
            echo "  ❌ ${sha:0:7} — missing sign-off"
          else
            echo "  ✅ ${sha:0:7} — signed off"
          fi
        done < <(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}" 2>/dev/null || echo "")

        if [ "$FAILED_COUNT" -eq 0 ]; then
          echo "dco_passed=true" >> "$GITHUB_OUTPUT"
          echo "DCO: ALL PASSED"
        else
          echo "dco_passed=false" >> "$GITHUB_OUTPUT"
          echo "DCO: ${FAILED_COUNT} commit(s) FAILED"
        fi

        # Use printf to handle newlines in output
        printf 'failed_commits_log<<DCO_EOF\n%s\nDCO_EOF\n' "$FAILED_LOG" >> "$GITHUB_OUTPUT"
        echo "failed_count=$FAILED_COUNT" >> "$GITHUB_OUTPUT"

    - name: Post DCO Failure Comment (marker upsert)
      if: steps.scan.outputs.dco_passed == 'false' && inputs.pr-number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        PR="${{ inputs.pr-number }}"
        REPO="${{ inputs.repo }}"
        # `failed_commits_log`, with underscores: the scan step writes exactly that name to
        # `$GITHUB_OUTPUT`, and this expression spelled it with hyphens — which GitHub resolves to the
        # empty string rather than to an error. So the one comment a contributor sees for a DCO failure
        # listed **no commits at all**: "The following commits are missing Signed-off-by:" followed by an
        # empty code block. Measured 2026-09-25 on PR #2201/#2202.
        FAILED_LOG=$(cat << 'DCO_EOF'
        ${{ steps.scan.outputs.failed_commits_log }}
        DCO_EOF
        )

        # `$RUNNER_TEMP`, not a hard-coded `/tmp`: on a Windows runner that path does not exist, and the
        # step would fail on the write rather than on the comment it is trying to post.
        COMMENT_FILE="${RUNNER_TEMP:-/tmp}/dco_comment.md"

        cat > "$COMMENT_FILE" << 'CMTEOF'
        <!-- misakanet-dco-block -->
        ### 🔏 DCO Check — some commits need sign-off

        The following commits in this Pull Request are missing the required `Signed-off-by:` trailer (Developer Certificate of Origin):

        ```text
        CMTEOF
        printf '%s\n' "$FAILED_LOG" >> "$COMMENT_FILE"
        cat >> "$COMMENT_FILE" << 'CMTEOF'
        ```

        **How to fix (about 2 minutes):**

        ```bash
        # sign the latest commit
        git commit --amend --signoff --no-edit
        git push --force-with-lease

        # or sign the last N commits
        git rebase --signoff HEAD~N
        git push --force-with-lease
        ```

        Same-repo PRs can also comment `/fix-dco` to auto-apply the sign-off.

        > Merge commits are exempt from sign-off. CI re-scans on **every push**
        > (including force-pushes): once all commits are signed, the `needs-dco`
        > label **auto-clears** and this comment is removed — do NOT push an empty
        > commit. Full guide: CONTRIBUTING.md → *Developer Certificate of Origin*.
        CMTEOF

        # Upsert: update an existing block comment instead of stacking (issue #1498)
        EXISTING_ID=$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" \
          --jq '.[] | select(.body | contains("misakanet-dco-block")) | .id' 2>/dev/null | tail -n1)
        if [ -n "$EXISTING_ID" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING_ID" \
            -f "body=$(cat "$COMMENT_FILE")" >/dev/null 2>&1 \
            && echo "Updated DCO block comment on PR #$PR" \
            || gh pr comment "$PR" --repo "$REPO" --body-file "$COMMENT_FILE" 2>/dev/null \
            || echo "::warning::Could not update/post DCO comment on PR #$PR (read-only fork run?)"
        else
          gh pr comment "$PR" --repo "$REPO" --body-file "$COMMENT_FILE" 2>/dev/null \
            || echo "::warning::Could not post DCO comment on PR #$PR (read-only fork run?)"
        fi