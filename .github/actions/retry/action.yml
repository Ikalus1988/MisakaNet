name: 'Retry with Backoff'
description: 'Retry a command with exponential/linear/fixed backoff and jitter. Pure Python, no dependencies.'
inputs:
  run:
    description: 'Command to execute'
    required: true
  max_attempts:
    description: 'Maximum retry attempts'
    required: false
    default: '3'
  backoff:
    description: 'Backoff strategy: exponential, linear, or fixed'
    required: false
    default: 'exponential'
  backoff_base_seconds:
    description: 'Base wait time in seconds'
    required: false
    default: '10'
  retry_on_exit_code:
    description: 'Comma-separated exit codes to retry on. Empty = any non-zero'
    required: false
    default: ''
  shell_override:
    description: 'Shell to use for the command (default: bash)'
    required: false
    default: 'bash'
outputs:
  attempts_count:
    description: 'Number of attempts made'
    value: ${{ steps.retry.outputs.attempts_count }}
  final_exit_code:
    description: 'Exit code of the final attempt'
    value: ${{ steps.retry.outputs.final_exit_code }}
runs:
  using: 'composite'
  steps:
    - name: Retry execution
      id: retry
      shell: bash
      # `${{ … }}` is **textually** substituted into a `run:` body before bash parses it — the same
      # mechanism that let a pull request execute commands on a runner (#2938). This action used to
      # inline the caller's whole script:
      #
      #     $SHELL_CMD -c "${{ inputs.run }}"
      #
      # so a script containing a double quote closed the string it was inlined into. Measured, with
      # the two callers in this repository as the examples:
      #
      #     bash -c "if [ -n "$FOO" ]; then
      #       echo "value is $FOO"
      #     fi"
      #     -> syntax error: unexpected end of file   (exit 2)
      #
      # and a single-line script did not even fail — it ran the wrong command and exited 0. Both
      # callers pass scripts full of quotes, so the action could not run either of them.
      #
      # Carrying the values through `env:` fixes the class rather than this one script: bash
      # expands `"$RETRY_COMMAND"` as a single word and does not re-scan the result for quotes or
      # command substitutions, so the caller's text arrives exactly as written. It is also the shape
      # the injection fix settled on — see tests/test_workflow_script_injection.py.
      env:
        RETRY_COMMAND: ${{ inputs.run }}
        RETRY_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        RETRY_BACKOFF: ${{ inputs.backoff }}
        RETRY_BASE_SECONDS: ${{ inputs.backoff_base_seconds }}
        RETRY_CODES: ${{ inputs.retry_on_exit_code }}
        SHELL_CMD: ${{ inputs.shell_override }}
      run: |
        set +e
        MAX_ATTEMPTS="$RETRY_MAX_ATTEMPTS"
        BACKOFF="$RETRY_BACKOFF"
        BASE_SECONDS="$RETRY_BASE_SECONDS"
        RETRY_CODES="$RETRY_CODES"
        SHELL_CMD="$SHELL_CMD"
        LOG_FILE="${GITHUB_WORKSPACE:-$PWD}/.retry-output.log"
        : > "$LOG_FILE"
        ATTEMPT=0
        FINAL_CODE=0

        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          ATTEMPT=$((ATTEMPT + 1))
          echo "::group::Attempt $ATTEMPT/$MAX_ATTEMPTS"

          # Run the command and preserve its output for downstream classification.
          echo "Command: $RETRY_COMMAND" | tee -a "$LOG_FILE"
          "$SHELL_CMD" -c "$RETRY_COMMAND" 2>&1 | tee -a "$LOG_FILE"
          EXIT_CODE=${PIPESTATUS[0]}
          FINAL_CODE=$EXIT_CODE

          echo "Exit code: $EXIT_CODE" | tee -a "$LOG_FILE"
          echo "::endgroup::"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Success on attempt $ATTEMPT"
            break
          fi

          # Check if we should retry this exit code
          if [ -n "$RETRY_CODES" ]; then
            SHOULD_RETRY=false
            IFS=',' read -ra CODES <<< "$RETRY_CODES"
            for code in "${CODES[@]}"; do
              code=$(echo "$code" | tr -d ' ')
              if [ "$EXIT_CODE" -eq "$code" ]; then
                SHOULD_RETRY=true
                break
              fi
            done
            if [ "$SHOULD_RETRY" = "false" ]; then
              echo "❌ Exit code $EXIT_CODE not in retry list ($RETRY_CODES), stopping"
              break
            fi
          fi

          if [ $ATTEMPT -ge $MAX_ATTEMPTS ]; then
            echo "❌ Max attempts reached"
            break
          fi

          # Calculate wait time
          WAIT=$(python3 -c "
        import random
        base = $BASE_SECONDS
        attempt = $ATTEMPT
        strategy = '$BACKOFF'
        if strategy == 'exponential':
            wait = (base ** attempt) * (1 + random.uniform(-0.2, 0.2))
        elif strategy == 'linear':
            wait = base * attempt * (1 + random.uniform(-0.2, 0.2))
        else:  # fixed
            wait = base * (1 + random.uniform(-0.2, 0.2))
        print(f'{wait:.1f}')
        ")

          echo "⏳ Waiting ${WAIT}s before retry (strategy: $BACKOFF)..."
          sleep $WAIT
        done

        echo "attempts_count=$ATTEMPT" >> "$GITHUB_OUTPUT"
        echo "final_exit_code=$FINAL_CODE" >> "$GITHUB_OUTPUT"

        if [ $FINAL_CODE -ne 0 ]; then
          exit $FINAL_CODE
        fi
