<style id="misaka-design-tokens">
/*
 * The design system's tokens — ONE source for every hand-written page (#3541, batch V).
 *
 * Why this file exists: the site currently holds two products. The homepage has an identity
 * (Orbitron, a cyan glow, a grid), and the other hand-written pages are GitHub's default dark
 * theme — copied in from somewhere else. Fourteen pages, fourteen sets of hardcoded colours,
 * radii, shadows and font stacks. Nothing is *wrong* with them; they are simply not one site,
 * and every future change has to be made fourteen times.
 *
 * This block changes nothing on its own: no page references these names yet. That is deliberate
 * — batch W is the batch that replaces hardcoded values with these names, and a batch that
 * changed the rendering as well as the vocabulary would make a visual regression impossible to
 * attribute. So this file is the vocabulary, and the gate below keeps it the only copy of it.
 *
 * Every value below is measured, not chosen for taste: the text colours were picked for their
 * WCAG contrast ratio against --bg-0 (15.95:1, 7.67:1, 4.14:1), and the two accent colours
 * for theirs (12.79:1 and 5.21:1). If a value changes here, the ratios change with it, so the
 * numbers in the comments are part of the contract.
 *
 * Maintained by scripts/sync_design_tokens.py — `--check` fails when a page drifts from this
 * file, the same way the shared nav row is kept honest.
 */
:root {
  /* ── 底与面：3 档（收编 GitHub 习惯色，不再各页自定义）── */
  --bg-0: #070b15;   /* 页面底（首页既有 --bg-deep） */
  --bg-1: #0d1424;   /* 卡片 / 面 */
  --bg-2: #161b22;   /* 浮层 / 代码块 */

  /* ── 文字：3 档（对比度已实测）── */
  --fg-1: #e2e8f0;   /* 15.95:1 on --bg-0 */
  --fg-2: #94a3b8;   /*  7.67:1 on --bg-0 */
  --fg-3: #64748b;   /*  仅限 ≥16px 或非文本装饰（4.14:1，正文禁用）*/

  /* ── 品牌与语义 ── */
  --accent:   #00e5ff;  /* 12.79:1 — 品牌 / 链接（首页既有 --cyan）*/
  --accent-2: #ff0080;  /*  5.21:1 — 次级强调，限量使用 */
  --ok:       #22c55e;  /*  8.63:1 */
  --warn:     #f0c040;
  --danger:   #ef4444;  /*  5.23:1 */
  --line:        rgba(148,163,184,.14);
  --line-strong: rgba(0,229,255,.28);

  /* ── 字体：4 族（不换字体家族，只把 5 套声明收敛成 token）── */
  /* `--font-ui` 是**系统栈**，不是 Inter：十三个手写页面今天用的是
     `-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif`，而 Inter 只在首页被
     加载。#3541 的风险第 1 条写着"若 onload 不触发会静默回退……只有像素对比能抓到"，所以
     **本单不换字体家族**：把 `--font-ui` 写成 Inter 开头，等于让这十三个页面在没加载 Inter
     的情况下用 CJK 字体渲染拉丁字母——那是一次静默的排版退化。
     首页的 Inter 因此单列为 `--font-brand`：两个族都是"不动"的，只是各归其位。── */
  --font-ui:      -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  --font-brand:   'Inter','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-display: 'Orbitron', var(--font-brand);      /* 仅品牌层 */
  --font-cn:      'Ma Shan Zheng','Noto Sans SC',cursive; /* 仅首页副标 */
  --font-mono:    'JetBrains Mono',ui-monospace,monospace;

  /* ── 字阶：10 档，rem 基准 16 ── */
  --fs-3xs:.6875rem; --fs-2xs:.75rem; --fs-xs:.8125rem; --fs-sm:.875rem;
  --fs-md:1rem;     --fs-lg:1.125rem; --fs-xl:1.3125rem; --fs-2xl:1.5rem;
  --fs-3xl:1.875rem;--fs-4xl:2.375rem;
  /* 品牌层的字号（首页的标识组合）。它们不属于 UI 字阶：按 #3541 的 px 规则向上取整，52px 和
     48px 恰好不动，但 22px 会变成 24px、36px 会变成 38px——那会把首页的标识撑宽 41px，
     而首页的头部本来就比视口宽（§118.9 的既有 bug），再撑就没有余地了。
     #3541 说"首页那套签名不是要改掉的东西，它是资产"，所以这一层保留原尺寸，
     并由像素对比守住：改这里的数会立刻在 header 的宽度上被看见。── */
  --fs-display:3.25rem;      /* 52px — .logo-title */
  --fs-display-sm:3rem;      /* 48px — .logo-cn */
  --fs-display-md:2.25rem;   /* 36px — 窄屏下的 .logo-title / .logo-cn */
  --fs-tagline:1.375rem;     /* 22px — .logo-tagline */

  /* ── 间距：4px 基准，8 档 ── */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-5:24px; --sp-6:32px; --sp-7:40px; --sp-8:48px;

  /* ── 圆角：3 档（现状 14 种）── */
  --r-sm:6px; --r-md:10px; --r-lg:16px;
  /* 胶囊形不是"圆角档位"，是形状：现状的 50% 与 999px 是同一种东西的两种写法。
     它单列一个 token，而不是混进三档里——把它塞进 --r-lg 会让胶囊变成圆角矩形。── */
  --r-pill:999px;

  /* ── 动效：2 档 + 1 个 easing（现状 5 种时长）── */
  --t-fast:150ms; --t-base:250ms; --ease:cubic-bezier(.2,.8,.2,1);

  /* ── 阴影：2 档（现状 31 处）── */
  --sh-1:0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 12px 32px rgba(0,0,0,.45);
}
</style>
<!-- design-tokens:end -->

// 2026-09-30: this page's local scoring reads title/summary/domain/tags only, so it loads the projection
// (149 KB raw / 60 KB gzip) instead of the whole corpus (1.32 MB raw / 418 KB) — 7× less for an identical
// local search. The corpus stays as a fallback so a missing projection cannot empty the page.
const LESSONS_LITE_URL = "../data/lessons-lite.json";
const LESSONS_FULL_URL = "../data/lessons.json";

// One primary and one fallback — deliberately not a loop: an awaited fetch inside a `for … of` is the
// per-item fan-out pattern `tests/test_site_request_fanout.py` forbids on this site.
async function fetchLessonsOnce(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  if (!Array.isArray(data) || !data.length) throw new Error('not a non-empty array');
  return data;
}

async function fetchLessonsWithFallback() {
  try {
    return await fetchLessonsOnce(LESSONS_LITE_URL);
  } catch (err) {
    console.warn('MisakaNet search: ' + LESSONS_LITE_URL + ' unavailable — ' + err.message);
    return fetchLessonsOnce(LESSONS_FULL_URL);
  }
}

function escapeHTML(value) {
  return String(value || '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function getLessonUrl(lesson) {
  const raw = lesson && (lesson.url || lesson.path || '');
  if (!raw) return 'https://github.com/Ikalus1988/MisakaNet/tree/main/lessons';
  if (/^https?:\/\//i.test(raw)) return raw;
  return 'https://github.com/Ikalus1988/MisakaNet/blob/main/' + encodeURI(String(raw).replace(/^\/+/, ''));
}

function getLessonPath(lesson) {
  const raw = lesson && (lesson.url || lesson.path || '');
  if (!raw) return '';
  if (!/^https?:\/\//i.test(raw)) return String(raw).replace(/^\/+/, '');
  try {
    const url = new URL(raw);
    let match = url.pathname.match(/\/Ikalus1988\/MisakaNet\/(?:blob|raw)\/main\/(.+)$/);
    if (!match) match = url.pathname.match(/\/Ikalus1988\/MisakaNet\/main\/(.+)$/);
    return match ? decodeURIComponent(match[1]) : '';
  } catch (e) {
    return '';
  }
}

function getRawLessonUrl(lesson) {
  const path = getLessonPath(lesson);
  return path ? RAW_BASE + encodeURI(path) : getLessonUrl(lesson);
}

function stripFrontmatter(markdown) {
  return String(markdown || '')
    .replace(/^\uFEFF?---\s*\r?\n[\s\S]*?\r?\n---\s*\r?\n?/, '')
    .trim();
}

function isSearchable(l) {
  const text = ((l.title||'') + ' ' + (l.summary||'')).toLowerCase();
  const junk = ['context compaction','earlier turns','poc record','mojibake','bot reply'];
  return !junk.some(k => text.includes(k)) && (l.title||'').trim();
}

function search(q) {
  if (!q || !_lessons) return [];
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  return _lessons.filter(isSearchable).map(l => {
    const title = (l.title||'').toLowerCase();
    const domain = (l.domain||'').toLowerCase();
    const summary = (l.summary||'').toLowerCase();
    const tags = (l.tags||[]).join(' ').toLowerCase();
    const full = title + ' ' + domain + ' ' + summary + ' ' + tags;
    let score = tokens.filter(t => full.includes(t)).length / tokens.length;
    if (tokens.some(t => title.includes(t))) score += 0.3;
    if (tokens.some(t => tags.includes(t))) score += 0.15;
    if (tokens.some(t => domain.includes(t))) score += 0.1;
    return { ...l, score };
  }).filter(l => l.score > 0).sort((a,b) => b.score - a.score).slice(0, 20);
}

function explainResult(r, q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const title = (r.title || '').toLowerCase();
  const domain = (r.domain || '').toLowerCase();
  const tags = (r.tags || []).join(' ').toLowerCase();
  const summary = (r.summary || '').toLowerCase();
  const matched = terms.filter(term => (title + ' ' + domain + ' ' + tags + ' ' + summary).includes(term));
  const entities = [];
  if (terms.some(term => title.includes(term))) entities.push('title');
  if (terms.some(term => domain.includes(term))) entities.push('domain');
  if (terms.some(term => tags.includes(term))) entities.push('tags');
  const coverage = terms.length ? matched.length / terms.length : 0;
  return {
    matched: matched.length ? matched.join(', ') : 'none',
    entities: entities.length ? entities.join(', ') : 'content only',
    coverage: Math.round(coverage * 100),
  };
}

function updateUrl(q, lessonId) {
  const url = new URL(location);
  if (q) url.searchParams.set('q', q);
  else url.searchParams.delete('q');
  if (lessonId) url.searchParams.set('lesson', lessonId);
  else url.searchParams.delete('lesson');
  history.replaceState(null, '', url);
}

function getTakeaway(r) {
  // First complete sentence from summary, fallback to title
  const s = r.summary || '';
  const match = s.match(/^[^.!?。！？]+[.!?。！？]/);
  const takeaway = match ? match[0].trim() : s.slice(0, 120);
  return takeaway || r.title || '';
}

// The kind of failure, not its trustworthiness. This used to fall through to a green "Verified"
// badge for anything the keywords did not classify — and no branch read `evidence_level` at all, so
// 241 of the 388 cards wearing it were E0 (contributor self-reported). The trust signal on a card is
// the E-level badge beside this one; a category badge must not overrule it (#3539 H).
function inferBadge(r) {
  const text = ((r.title||'') + ' ' + (r.summary||'') + ' ' + (r.tags||[]).join(' ')).toLowerCase();
  if (/delete|drop|clear|overwrite|corrupt|destroy|清空|覆盖|丢数据/.test(text)) return { key: 'badgeFatal', cls: 'badge-fatal' };
  if (/timeout|locked|rate.limit|429|403|oom|crash|崩溃|超时|锁定/.test(text)) return { key: 'badgeRuntime', cls: 'badge-runtime' };
  if (/setup|config|install|deploy|初始化|配置|安装/.test(text)) return { key: 'badgeSetup', cls: 'badge-setup' };
  return { key: 'badgeOther', cls: 'badge-plain' };
}

// ── Evidence levels (#786) — see docs/trust-semantics.md ──
const EVIDENCE_LABELS = {
  E0: 'E0 — contributor self-reported',
  E1: 'E1 — maintainer reviewed',
  E2: 'E2 — local smoke reproduced',
  E3: 'E3 — CI / sandbox verified recovery',
  E4: 'E4 — observed reuse: two or more distinct clients retrieved it',
};

// Missing or unknown values read as E0: evidence is never assumed.
function evidenceInfo(level) {
  const key = String(level || '').trim().toUpperCase();
  const normalized = EVIDENCE_LABELS[key] ? key : 'E0';
  return { level: normalized, label: EVIDENCE_LABELS[normalized] };
}

// ── Client-side confidence / result_type classification ──
const ACTIONABLE_RE = /fix|solution|workaround|step\s*\d|verify|verification|error.code|exit.code|```|pip install|git |curl |chmod|mkdir|export /i;
const COMMON_RE = /github.com.*443|connectivity|checklist|basic|intro|overview|getting.started|quick.start|faq|troubleshooting.general|network.*basics|git.*basics|config.*general/i;
const ERROR_CODE_RE = /GH\d{3,4}|E\d{3,5}|INTP-\d+|KL-\d+|exit\s+(?:code|status)\s+\d+|HTTP\s+\d{3}/i;

function classifyResult(r, score) {
  const title = (r.title || '').toLowerCase();
  const summary = (r.summary || '').toLowerCase();
  const tags = (r.tags || []).join(' ').toLowerCase();
  const content = title + ' ' + summary + ' ' + tags;

  const hasErrorCode = ERROR_CODE_RE.test(r.title + ' ' + (r.summary || '').slice(0, 300));
  const hasActionable = ACTIONABLE_RE.test(r.summary || '');
  const hasVerification = /## verification|## verify/i.test(r.summary || '');
  const isCommon = COMMON_RE.test(title + ' ' + summary.slice(0, 300));
  const highScore = score >= 0.6;
  const lowScore = score < 0.35;

  // Confidence
  let confidence = 'medium';
  if ((hasErrorCode && score > 0.4) || (hasVerification && hasActionable && highScore)) {
    confidence = 'high';
  } else if ((isCommon && lowScore) || (score < 0.25 && !hasActionable)) {
    confidence = 'low';
  }

  // Result type
  let resultType = 'related';
  if (confidence === 'low') resultType = 'common';
  else if (confidence === 'high' || (confidence === 'medium' && hasActionable)) resultType = 'actionable';

  return { confidence, resultType };
}

const FEEDBACK_API = window.location.origin + '/api/feedback';
const SEARCH_SIGNAL_API = window.location.origin + '/api/search-signal';

// Unsolved failure map (#788). Only searches that found nothing useful are
// reported; the backend derives a task-family label and drops the query, so no
// raw query text is ever stored. Fire-and-forget, deduped per query per session.
const _signalledQueries = new Set();

function reportUnsolvedSearch(q, results) {
  if (!q) return;
  const topScore = results.length ? (results[0].score || 0) : 0;
  if (results.length && topScore >= 0.35) return; // solved — nothing to report
  const key = q.toLowerCase().trim();
  if (_signalledQueries.has(key)) return;
  _signalledQueries.add(key);

  fetch(SEARCH_SIGNAL_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      query: q, result_count: results.length, top_score: topScore,
      ...(PAGE_INTENT ? { intent: PAGE_INTENT } : {}),
    }),
  }).catch(() => {}); // silent fail — insights are best-effort
}

function submitFeedback(lessonId, query, feedback) {
  const existing = getFeedbackForLesson(lessonId, query);
  if (existing) return;
  const entry = {
    query,
    lesson_id: lessonId,
    feedback,
    ts: new Date().toISOString(),
  };
  saveFeedback(entry);
  restoreFeedbackState(lessonId, query);

  // POST to backend (fire-and-forget, localStorage is primary)
  fetch(FEEDBACK_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(entry),
  }).catch(() => {}); // silent fail, localStorage is fallback
}

function restoreFeedbackState(lessonId, query) {
  const bar = document.querySelector('[data-feedback-id="' + lessonId + '"]');
  if (!bar) return;
  const existing = getFeedbackForLesson(lessonId, query);
  if (!existing) return;
  bar.querySelectorAll('.feedback-btn').forEach(btn => {

function render(results, q, meta) {
  const el = document.getElementById('results');
  _lastResults = results;
  reportUnsolvedSearch(q, results);
  if (!results.length) {
    el.innerHTML = '<div class="fallback">' +
      '<div style="margin-bottom:8px;">' + t('noMatchPrefix') + ' "' + escapeHTML(q) + '". ' + t('noMatchSuffix') + '</div>' +
      '<div style="font-size:var(--fs-xs);margin-bottom:12px;max-width:480px;margin-left:auto;margin-right:auto;">' +

        t('noMatchHelpSuffix') + '<code style="font-size:var(--fs-3xs);">pip timeout</code>, <code style="font-size:var(--fs-3xs);">database locked</code>, <code style="font-size:var(--fs-3xs);">DCO sign-off</code>, <code style="font-size:var(--fs-3xs);">git rebase</code>.' +
      '</div>' +
      '<div style="font-size:var(--fs-2xs);"><a href="/skill.md">' + t('installSkill') + '</a> &middot; <a href="https://github.com/Ikalus1988/MisakaNet">' + t('submitLesson') + '</a> &middot; <a href="https://github.com/Ikalus1988/MisakaNet/issues/new?template=lesson-request.yml">' + t('requestLesson') + '</a></div></div>';
    return;
  }
  const searchable = _lessons ? _lessons.filter(isSearchable).length : 0;
  const total = _lessons ? _lessons.length : 0;
  if (meta && meta.source === 'server') {
    showServerNote(q, meta.relaxed ? serverNote('relaxed') : serverNote('ranked'));
  }

  // Classify and group results (resultType drives Top fixes / Related /
  // Common grouping; the composite confidence value is no longer displayed —
  // the evidence badge is the trust signal, Coogen borrow Phase 2).
  const classified = results.map((r, index) => {
    const { resultType } = classifyResult(r, r.score || 0);
    return { ...r, _index: index, _resultType: resultType };
  });
  const topFixes = classified.filter(r => r._resultType === 'actionable');
  const commonRefs = classified.filter(r => r._resultType === 'common');
  const relatedRefs = classified.filter(r => r._resultType === 'related');

  function renderCard(r) {
    const takeaway = escapeHTML(getTakeaway(r));
    const title = escapeHTML(r.title);
    const summary = escapeHTML((r.summary||'').slice(0,200));
    const domain = escapeHTML(r.domain||'general');
    const tags = (r.tags||[]).slice(0,4).map(escapeHTML).join(', ');
    const url = getLessonUrl(r);
    const id = escapeHTML(r.id || '');
    const badge = inferBadge(r);
    // Coogen borrow (Phase 2): composite match-confidence badge removed —
    // the evidence badge is the trust signal; "Why this matched" keeps the
    // relevance explanation (matched terms / coverage / trust_score).
    const ev = evidenceInfo(r.evidence_level);
    // `evidence_source` and `trust_score` are not in the lite projection the page loads (and widening
    // that gate is not free: +25.7 KB on a 228 KB file), so the card printed `trust: —` and called
    // every level "inferred" — wrong for the lessons whose level comes from frontmatter. Show what
    // the payload actually carries.
    const signals = explainResult(r, q);
    const showTakeaway = takeaway !== title;
    return '<div class="result" tabindex="0" data-index="' + r._index + '" data-id="' + id + '">' +
      '<div class="result-meta">' +
        '<span class="badge ' + badge.cls + '">' + t(badge.key) + '</span>' +
        '<span class="badge badge-domain">' + domain + '</span>' +
        '<span class="badge badge-evidence ev-' + ev.level.toLowerCase() + '" title="' + escapeHTML(ev.label) + '">' + ev.level + '</span>' +
      '</div>' +
      '<h2 class="result-title">' + title + '</h2>' +
      (showTakeaway ? '<div class="result-takeaway">' + takeaway + '</div>' : '') +
      '<div class="result-summary">' + summary + '</div>' +
      (tags ? '<div class="result-tags">' + tags + '</div>' : '') +
      '<details class="score-explain"><summary>' + t('whyThisMatched') + '</summary>' +
        '<div>' + t('matchedTerms') + ': <code>' + escapeHTML(signals.matched) + '</code></div>' +
        '<div>' + t('entityFields') + ': <code>' + escapeHTML(signals.entities) + '</code></div>' +
        '<div>' + t('keywordCoverage') + ': <code>' + signals.coverage + '%</code> · score: <code>' + Number(r.score || 0).toFixed(3) + '</code></div>' +
        '<div>evidence: <code>' + ev.level + '</code> · ' + escapeHTML(ev.label) + '</div>' +
      '</details>' +
      '<div class="result-actions">' +
        '<button class="btn-primary" type="button" data-action="preview" aria-expanded="false"' +
        ' aria-controls="preview-' + r._index + '">' + t('readLesson') + '</button>' +
        '<a class="btn-secondary" href="' + escapeHTML(url) + '" target="_blank" rel="noopener">' + t('openGitHub') + '</a>' +
      '</div>' +
      '<div class="feedback-bar" data-feedback-id="' + id + '">' +
        '<button class="feedback-btn" data-type="irrelevant">' + t('feedbackIrrelevant') + '</button>' +
        '<button class="feedback-btn" data-type="too_basic">' + t('feedbackTooBasic') + '</button>' +
        '<button class="feedback-btn" data-type="helpful">' + t('feedbackHelpful') + '</button>' +
      '</div>' +
      '<div class="lesson-preview" id="preview-' + r._index + '" hidden></div>' +
    '</div>';
  }

  let html = '<div class="results-header">' + t('resultsHeader', { count: results.length, q: escapeHTML(q) }) + '</div>';
  const e3plus = _lessons.filter(l => ['E3', 'E4'].includes(String(l.evidence_level || '').toUpperCase())).length;
  const e4 = _lessons.filter(l => String(l.evidence_level || '').toUpperCase() === 'E4').length;
  html += '<div class="stats">' + t('resultsStats', { count: searchable, total, e3: e3plus, e4 }) + '</div>';

  // Top fixes
  if (topFixes.length) {
    html += '<div class="section-label">' + t('sectionTopFixes') + '</div>';
    html += topFixes.map(renderCard).join('');
  }

  // Related (if no top fixes, show related as primary)
  if (!topFixes.length && relatedRefs.length) {
    html += '<div class="section-label">' + t('sectionResults') + '</div>';
    html += relatedRefs.map(renderCard).join('');
  } else if (relatedRefs.length) {
    html += '<div class="section-label">' + t('sectionRelated') + '</div>';
    html += relatedRefs.map(renderCard).join('');
  }

  // Common references (folded)
  if (commonRefs.length) {
    html += '<button class="fold-toggle" type="button" onclick="this.classList.toggle(\'open\');this.nextElementSibling.hidden=!this.nextElementSibling.hidden">' +
      '<span class="arrow">▸</span> ' + t('sectionCommon', { count: commonRefs.length }) +
      '</button>';
    html += '<div hidden>' + commonRefs.map(renderCard).join('') + '</div>';
  }

  el.innerHTML = html;
  restoreAllFeedbackStates();
}

function renderMarkdown(text, headingLevel = 2) {
  // Minimal markdown renderer: h2, h3, code blocks, inline code, paragraphs.
  // `headingLevel` is the level the lesson's own `##` maps to — the preview lives inside a result
  // card whose title is an h2, so the body's headings have to start one level deeper (2026-10-20).
  let html = escapeHTML(text);
  // Code blocks: ```...```
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code: `...`
  html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  // H2: ## ...
  html = html.replace(/^## (.+)$/gm, '<h' + headingLevel + '>$1</h' + headingLevel + '>');
  // H3: ### ...
  html = html.replace(/^### (.+)$/gm, '<h' + (headingLevel + 1) + '>$1</h' + (headingLevel + 1) + '>');
  // Paragraphs: double newline
  html = html.replace(/\n\n/g, '</p><p>');
  // Single newline within paragraphs
  html = html.replace(/\n/g, '<br>');
  return '<p>' + html + '</p>';
}

/** The lesson's markdown, for the inline preview panel — fetched when a reader asks for it.
 *
 * Falls back to whatever `preview` the search data happens to carry (the corpus fallback path still has
 * it), then to the API's short `description`, so the panel never shows nothing when something is known.
 */
async function fetchLessonBody(lesson) {
  if (lesson && lesson.preview) return lesson.preview;
  if (!lesson || !lesson.id) return '';
  try {
    const r = await fetch('../mcp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json',
                 'MCP-Protocol-Version': '2025-06-18', 'Origin': location.origin },
      body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/call',
        params: { name: 'misakanet_get_lesson', arguments: { id: lesson.id, detail: 'summary' } } }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const payload = await r.json();
    const text = payload && payload.result && payload.result.content && payload.result.content[0]
      && payload.result.content[0].text;
    if (!text) throw new Error('no content');
    // The tool answers with a JSON envelope: {path, content, ...}. Plain markdown is accepted too, so a
    // future shape change degrades to showing the payload rather than showing nothing.
    try {
      const parsed = JSON.parse(text);
      return parsed.content || parsed.summary || parsed.description || '';
    } catch (e) {
      return text;
    }
  } catch (err) {
    console.warn('MisakaNet search: lesson body unavailable —', err.message);
    return lesson.summary || '';
  }
}

async function togglePreview(index) {
  const lesson = _lastResults[index];
  const card = document.querySelector('.result[data-index="' + index + '"]');
  const panel = card && card.querySelector('.lesson-preview');
  if (!lesson || !panel) return;

  // Auto-collapse: close any other open preview first
  const openPanels = document.querySelectorAll('.lesson-preview:not([hidden])');
  openPanels.forEach(p => {
    if (p !== panel) {
      p.hidden = true;
      const otherBtn = p.closest('.result').querySelector('[data-action="preview"]');
      if (otherBtn) {
        otherBtn.textContent = t('readLesson');
        otherBtn.setAttribute('aria-expanded', 'false');
      }
    }
  });

  if (panel.dataset.loaded === 'true') {
    panel.hidden = !panel.hidden;
    const btn = card.querySelector('[data-action="preview"]');
    if (btn) {
      btn.textContent = panel.hidden ? t('readLesson') : t('collapse');
      btn.setAttribute('aria-expanded', panel.hidden ? 'false' : 'true');
    }
    updateUrl(document.getElementById('q').value.trim(), panel.hidden ? null : (lesson.id || ''));
    return;
  }

  panel.hidden = false;
  panel.innerHTML = '<div class="preview-status">' + t('loadingPreview') + '</div>';
  const btn = card.querySelector('[data-action="preview"]');
  if (btn) {
    btn.textContent = t('collapse');
    btn.setAttribute('aria-expanded', 'true');
  }
  try {
    // The lesson body is fetched on demand (2026-09-30). It used to ride along in the corpus as
    // `preview` (~2.1 KB per lesson, 1.09 MB of the 1.32 MB file) because this panel wanted *one* of
    // them. `misakanet_get_lesson` is the documented public read path and answers with the lesson's
    // markdown; the panel's loading and unavailable states already exist, so a failure here degrades
    // exactly as it did before.
    const body = await fetchLessonBody(lesson);
    const clipped = body.length > 2400 ? body.slice(0, 2400) + '\n\n' + t('clipped') : body;
    panel.dataset.loaded = 'true';
    panel.innerHTML = renderMarkdown(clipped || t('noPreview'), 3);
    updateUrl(document.getElementById('q').value.trim(), lesson.id || '');
  } catch (e) {
    panel.innerHTML = '<div class="preview-status">' + t('previewUnavailable') + '</div>';
  }
}

function runSearch(q) {
  const results = search(q);
  render(results, q);
  updateUrl(q);
  return results;
}

/** The *committed* query goes to the Worker; typing stays local.
 *
 * WHY (2026-09-30, measured by `scripts/bench_search_parity.mjs`): the local scorer is a substring match
 * over four metadata fields — it always returns five rows (its extra hits are mostly false positives) and
 * it cannot see lesson **bodies**. The server ranks by BM25/IDF over the bodies too. The two rankings
 * disagree on most queries, so this is a visible change, and it is split deliberately: `input` keeps using
 * the local scorer so the list is instant and no request is made per keystroke — this worker shares one
 * anti-burst window (20 reads / 60 s) across every read entry point, so per-keystroke server calls would
 * throttle a real visitor.
 *
 * The local list renders first and is replaced by the server's answer when it has one; when the server
 * answers `no_match` the local hits stay and the note says what the server knows, rather than blanking a
 * page that visibly had results.
 */
async function runServerSearch(q) {
  runSearch(q);
  try {
    const r = await fetch('/api/lessons?q=' + encodeURIComponent(q) + '&limit=20');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const payload = await r.json();
    const rows = Array.isArray(payload && payload.results) ? payload.results : [];
    if (!rows.length) {
      if (payload && payload.no_match) showServerNote(q, serverNote('noMatch'));
      return;
    }
    render(rows.map(toLocalShape), q, { source: 'server', relaxed: payload.relaxed === true });
  } catch (err) {
    console.warn('MisakaNet search: server ranking unavailable — ' + err.message);
  }
}

/** Server rows carry `description` where the local rows carry `summary`, and `rank` where they carry
 *  `score`. Only the shape is adapted — the order is the server's. */
function toLocalShape(row) {
  return Object.assign({}, row, { summary: row.summary || row.description || '' });
}

/** The note's copy lives here rather than in `docs/locales/*.json`, because those dictionaries are the
 *  *homepage's* translation surface and `tests/test_site_i18n.py` fails any key the homepage does not
 *  reach — a rule that has already caught wrong wording shipped next to the right one. This page keeps its
 *  own map, in both languages, beside the inline English copy its no-match block has always had. */
const SERVER_NOTES = {
  en: {
    ranked: 'Ranked by the server index — it matches lesson bodies, not only titles.',
    relaxed: 'No lesson matched every word; these match some of them.',
    noMatch: 'The server index found no match; showing local keyword matches.',
  },
  zh: {
    ranked: '由服务端索引排序——它覆盖课程正文，不只是标题。',
    relaxed: '没有课程命中全部词；以下是命中部分词的结果。',
    noMatch: '服务端索引没有命中；以下是本地关键词匹配。',
  },
};

const serverNote = (kind) => (SERVER_NOTES[LANG] || SERVER_NOTES.en)[kind] || '';

/** One line under the results, so "these are partial matches" and "these are substring matches" are
 *  never confused with "the server ranked these". */
function showServerNote(q, text) {
  const el = document.getElementById('results');
  if (!el || !text) return;
  const note = document.createElement('div');
  note.className = 'result-source';
  note.style.cssText = 'font-size:var(--fs-2xs);color:#8b949e;margin:10px 0 0;';
  note.textContent = text;
  el.insertBefore(note, el.firstChild);
}

async function init() {
  try {
    _lessons = await fetchLessonsWithFallback();
    updateStats();
    document.getElementById('results').innerHTML = '';
    const params = new URLSearchParams(location.search);
    const q = params.get('q');
    const lessonId = params.get('lesson');
    if (q) {
      document.getElementById('q').value = q;
      let results = search(q);
      render(results, q);
      // A deep link is a committed query: the server's ranking replaces the local one when it answers.
      await runServerSearch(q);
      results = _lastResults;
      // Auto-expand matching lesson
      if (lessonId && results.length) {
        const idx = results.findIndex(r => r.id === lessonId);
        if (idx >= 0) setTimeout(() => togglePreview(idx), 300);
      }
    }
  } catch(e) {
    document.getElementById('results').innerHTML = '<div class="fallback">' + t('loadFailed') + ' <a href="/">' + t('goHome') + '</a></div>';
  }
}

document.querySelectorAll('[data-lang]').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});

document.getElementById('q').addEventListener('input', function() {
  const q = this.value.trim();
  if (!q) { _lastResults = []; document.getElementById('results').innerHTML = ''; updateUrl(''); return; }
  runSearch(q);
});

document.getElementById('q').addEventListener('keydown', function(event) {
  if (event.key !== 'Enter') return;
  const q = this.value.trim();
  if (!q) return;
  event.preventDefault();
  const results = runSearch(q);
  if (results.length) togglePreview(0);
  runServerSearch(q);
});

document.getElementById('results').addEventListener('click', function(event) {
  if (event.target.closest('a')) return;
  if (event.target.closest('.lesson-preview')) return;
  // A feedback button and the "Why this matched" disclosure live inside the card; without this the
  // same click also opens the preview and fetches the body, i.e. it costs one of the 20 anonymous
  // reads per minute (#3539 C5).
  //
  // `button` must NOT be in this list (2026-10-20): it also swallowed the preview's own button,
  // which is the control that opens the preview — on the live site "Read lesson" did nothing at all
  // and the body could only be reached by clicking the card around it. `.feedback-btn` already
  // covers the buttons that must not expand the card.
  if (event.target.closest('.feedback-btn, summary, details')) return;
  const card = event.target.closest('.result');
  if (!card) return;
  togglePreview(Number(card.dataset.index));
});

document.getElementById('results').addEventListener('keydown', function(event) {
  if (event.target.closest('a,button')) return;
  if (event.key !== 'Enter' && event.key !== ' ') return;
  const card = event.target.closest('.result');
  if (!card) return;
  event.preventDefault();
  togglePreview(Number(card.dataset.index));
});

setLang(LANG);
init();
updateFeedbackSummary();
</script>
</body>
</html>
