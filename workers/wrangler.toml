name = "misakanet-register-proxy"
main = "register-proxy-sw.js"
# Pinned on purpose, bumped on purpose: this date chooses the runtime semantics the Worker is
# compiled against, so letting it rot means production runs by rules nobody picked any more.
# It sat at 2024-01-01 for 997 days (found 2026-09-24 by a zone audit) while the other three
# configs in this repo were current:
#   wrangler.jsonc (misakanet-web)         2026-07-04
#   workers/email-register/wrangler.jsonc  2026-06-01
# `tests/test_worker_compat_dates.py` fails once this is more than a year old, and
# `.github/workflows/deploy-worker.yml` watches this file so that a config-only change actually
# reaches production — before 2026-09-24 the deploy only triggered on `register-proxy-sw.js`, so
# this file could be edited on main and nothing would deploy it.
compatibility_date = "2026-09-01"

# Workers Logs, on because this is the worker that carries the traffic and it was the only one
# without them (2026-10-02). `wrangler.jsonc` (misakanet-web) has had observability enabled since it
# was written; this one has served every dynamic request — `/api/*`, `/mcp`, `/register` — with no
# logs at all, so an incident here left nothing to read, and the capacity question ("how many
# requests, and how many D1 rows each") could not be answered from the account either.
#
# Cost, stated because "free tier" is the constraint this project plans against: Workers Logs is
# **included in the Free plan at 200,000 log events/day** with 3-day retention (Workers Paid: 20M
# events/month, 7 days). Traffic is ~14,000 requests/day, and each request emits one invocation log
# plus whatever the handler logs — so the budget is roughly 4–10x the current volume, which is
# headroom rather than a guarantee. Two knobs if it ever gets close, in this order:
#   head_sampling_rate = 0.5     # logs half the requests; also halves the log-derived request count
#   [observability.logs]
#   invocation_logs = false      # drops the per-request invocation log and keeps `console.*`
[observability]
enabled = true
head_sampling_rate = 1

# Self-monitoring keepalive probe cadence (was */5 — every 5 min; HTTP 522 on
# the public loopback probe was generating error noise. */15 keeps watch with
# 1/3 the noise; failures are debounced in code before they escalate).
[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "MISAKANET_KV"
id = "d5fb6b0797b84d17b0586fb982231ffe"

# PRD ④: D1 lesson service (serving layer; GitHub repo stays source of truth).
# Create once: wrangler d1 create misakanet-db  →  paste database_id below,
# then apply schema: wrangler d1 execute misakanet-db --remote --file=d1/schema.sql
# and sync: python3 ../scripts/sync_lessons_to_d1.py --db misakanet-db --execute
[[d1_databases]]
binding = "MISAKANET_D1"
database_name = "misakanet-db"
database_id = "b9adbe87-6bbf-4d2f-ae56-41c3487b2831"
