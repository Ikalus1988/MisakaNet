[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salvage-digest"
version = "0.1.0"
description = "Local review and sanitization utilities for rejected intake issues"
requires-python = ">=3.9"

[project.scripts]
salvage-review = "salvage_digest.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
